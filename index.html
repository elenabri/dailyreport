<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>WB Dashboard</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    background: #f5f6f8;

    color: #20242b;

    font-family:
        Inter,
        Arial,
        sans-serif;

    font-size: 13px;
}


.container {

    max-width: 1900px;

    margin: auto;

    padding: 18px 22px;
}


/* =========================================================
   HEADER
   ========================================================= */

.header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 14px;
}


.title {

    font-size: 21px;

    font-weight: 700;
}


.subtitle {

    margin-top: 3px;

    color: #858b95;

    font-size: 12px;
}


.header-right {

    display: flex;

    align-items: center;

    gap: 12px;
}


#status {

    color: #858b95;

    font-size: 12px;
}


button {

    border: none;

    border-radius: 9px;

    padding:
        9px
        14px;

    background: #111827;

    color: white;

    font-size: 13px;

    font-weight: 600;

    cursor: pointer;
}


button:hover {

    background: #242b38;
}


button:disabled {

    opacity: .5;

    cursor: wait;
}


/* =========================================================
   TABLE
   ========================================================= */

.table-container {

    background: white;

    border: 1px solid #e5e7eb;

    border-radius: 12px;

    overflow: auto;

    box-shadow:
        0 2px 7px
        rgba(0,0,0,.03);
}


table {

    border-collapse: separate;

    border-spacing: 0;

    width: 100%;

    min-width: 1450px;
}


th {

    position: sticky;

    top: 0;

    z-index: 5;

    background: #fafbfc;

    color: #68707c;

    font-size: 11px;

    font-weight: 700;

    padding:
        7px
        8px;

    border-bottom:
        1px solid #e5e7eb;

    white-space: nowrap;

    text-align: right;
}


td {

    padding:
        7px
        8px;

    border-bottom:
        1px solid #edf0f3;

    white-space: nowrap;

    text-align: right;

    font-variant-numeric:
        tabular-nums;
}


tbody tr:hover td {

    background: #fafcff;
}


/* =========================================================
   PRODUCT
   ========================================================= */

.product-cell {

    width: 300px;

    min-width: 300px;

    max-width: 300px;

    text-align: left;

    white-space: normal;
}


.product-name {

    font-weight: 600;

    line-height: 1.25;
}


.product-article {

    color: #858b95;

    font-size: 11px;

    margin-top: 2px;
}


/* =========================================================
   DAYS
   ========================================================= */

.day-title {

    text-align: center;

    font-size: 12px;

    color: #242932;
}


.day-date {

    display: block;

    color: #8b919a;

    font-size: 10px;

    font-weight: 400;

    margin-top: 2px;
}


.day-separator {

    border-left:
        2px solid #e9ebef !important;
}


/* =========================================================
   CHANGES
   ========================================================= */

.up {

    background: #dff5e6 !important;

    color: #14783b;

    font-weight: 700;
}


.down {

    background: #ffe1e1 !important;

    color: #b42318;

    font-weight: 700;
}


.same {

    color: #505762;
}


/* =========================================================
   OTHER
   ========================================================= */

.stock {

    font-weight: 700;
}


.days-left {

    font-weight: 700;
}


.position {

    font-weight: 700;
}


.empty {

    color: #a3a8b0;
}


.error {

    padding: 35px;

    text-align: center;

    color: #b42318;
}


.loading {

    padding: 35px;

    text-align: center;

    color: #858b95;
}


@media (
    max-width: 800px
) {

    .container {

        padding:
            10px;
    }

    .header {

        align-items: flex-start;

        flex-direction: column;

        gap: 10px;
    }

    .header-right {

        width: 100%;

        justify-content:
            space-between;
    }
}

</style>

</head>


<body>


<div class="container">


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <div class="header">

        <div>

            <div class="title">
                Wildberries · товары
            </div>

            <div
                class="subtitle"
                id="period"
            >
                Загрузка...
            </div>

        </div>


        <div class="header-right">

            <div id="status">
            </div>

            <button
                id="refreshButton"
            >
                ↻ Обновить данные
            </button>

        </div>

    </div>


    <!-- =====================================================
         TABLE
         ===================================================== -->

    <div class="table-container">

        <table>

            <thead id="tableHead">
            </thead>

            <tbody id="tableBody">

                <tr>

                    <td
                        colspan="20"
                        class="loading"
                    >
                        Загрузка данных WB...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>


</div>



<script>


// ============================================================
// HELPERS
// ============================================================

function escapeHtml(value) {

    return String(value ?? '')
        .replace(
            /[&<>"']/g,
            char => ({

                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'

            }[char])
        );
}


function formatNumber(value, digits = 0) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(Number(value))
    ) {

        return '<span class="empty">—</span>';
    }


    return Number(value)
        .toLocaleString(
            'ru-RU',
            {
                maximumFractionDigits:
                    digits
            }
        );
}


function formatMoney(value) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(Number(value))
    ) {

        return '<span class="empty">—</span>';
    }


    return (
        Number(value)
            .toLocaleString(
                'ru-RU',
                {
                    maximumFractionDigits: 0
                }
            )
        + ' ₽'
    );
}


function formatPercent(value) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(Number(value))
    ) {

        return '<span class="empty">—</span>';
    }


    return (
        Number(value)
            .toLocaleString(
                'ru-RU',
                {
                    maximumFractionDigits: 1
                }
            )
        + '%'
    );
}


function formatDate(date) {

    const [
        year,
        month,
        day
    ] =
        date.split('-');


    return `${day}.${month}`;
}


function compareClass(
    current,
    previous
) {

    if (
        current === null ||
        previous === null ||
        current === undefined ||
        previous === undefined
    ) {

        return '';
    }


    const a =
        Number(current);


    const b =
        Number(previous);


    if (
        !Number.isFinite(a) ||
        !Number.isFinite(b)
    ) {

        return '';
    }


    if (a > b) {

        return 'up';

    }


    if (a < b) {

        return 'down';

    }


    return 'same';
}


// ============================================================
// RENDER
// ============================================================

function render(data) {

    const products =
        data.products || [];


    // --------------------------------------------------------
    // Период
    // --------------------------------------------------------

    document
        .getElementById('period')
        .textContent =

        `Заказы: ${
            formatDate(data.period.from)
        } — ${
            formatDate(data.period.to)
        } · товаров: ${
            products.length
        }`;


    if (!products.length) {

        document
            .getElementById('tableBody')
            .innerHTML = `

                <tr>

                    <td
                        colspan="20"
                        class="error"
                    >
                        За последние 30 дней
                        заказов нет.
                    </td>

                </tr>

            `;

        return;
    }


    // --------------------------------------------------------
    // Последние 3 дня
    //
    // Сервер отдаёт:
    // [позавчера, вчера, сегодня]
    // --------------------------------------------------------

    const days =
        products[0].days;


    const day0 =
        days[0];

    const day1 =
        days[1];

    const day2 =
        days[2];


    // --------------------------------------------------------
    // HEADER
    // --------------------------------------------------------

    document
        .getElementById('tableHead')
        .innerHTML = `

        <tr>

            <th rowspan="2">
                Товар
            </th>


            <th
                colspan="4"
                class="day-title day-separator"
            >
                Позавчера

                <span class="day-date">
                    ${formatDate(day0.date)}
                </span>

            </th>


            <th
                colspan="4"
                class="day-title day-separator"
            >
                Вчера

                <span class="day-date">
                    ${formatDate(day1.date)}
                </span>

            </th>


            <th
                colspan="4"
                class="day-title day-separator"
            >
                Сегодня

                <span class="day-date">
                    ${formatDate(day2.date)}
                </span>

            </th>


            <th
                rowspan="2"
                class="day-separator"
            >
                Заказы<br>
                сегодня
            </th>


            <th rowspan="2">
                Заказы<br>
                30 дней
            </th>


            <th rowspan="2">
                Остаток<br>
                сегодня
            </th>


            <th rowspan="2">
                Хватит<br>
                на
            </th>


            <th rowspan="2">
                Средняя позиция<br>
                сегодня
            </th>

        </tr>


        <tr>

            <!-- Позавчера -->

            <th class="day-separator">
                Цена<br>покупателя
            </th>

            <th>
                СПП
            </th>

            <th>
                Цена<br>продавца
            </th>

            <th>
                Продажи
            </th>


            <!-- Вчера -->

            <th class="day-separator">
                Цена<br>покупателя
            </th>

            <th>
                СПП
            </th>

            <th>
                Цена<br>продавца
            </th>

            <th>
                Продажи
            </th>


            <!-- Сегодня -->

            <th class="day-separator">
                Цена<br>покупателя
            </th>

            <th>
                СПП
            </th>

            <th>
                Цена<br>продавца
            </th>

            <th>
                Продажи
            </th>

        </tr>

    `;


    // --------------------------------------------------------
    // BODY
    // --------------------------------------------------------

    let html = '';


    for (
        const product of products
    ) {

        const d0 =
            product.days[0];

        const d1 =
            product.days[1];

        const d2 =
            product.days[2];


        // ----------------------------------------------------
        // Изменение цены покупателя
        // ----------------------------------------------------

        const buyerYesterday =
            compareClass(
                d1.buyerPrice,
                d0.buyerPrice
            );


        const buyerToday =
            compareClass(
                d2.buyerPrice,
                d1.buyerPrice
            );


        // ----------------------------------------------------
        // Изменение СПП
        // ----------------------------------------------------

        const sppYesterday =
            compareClass(
                d1.spp,
                d0.spp
            );


        const sppToday =
            compareClass(
                d2.spp,
                d1.spp
            );


        // ----------------------------------------------------
        // Изменение продаж
        // ----------------------------------------------------

        const salesYesterday =
            compareClass(
                d1.sales,
                d0.sales
            );


        const salesToday =
            compareClass(
                d2.sales,
                d1.sales
            );


        html += `

        <tr>


            <!-- =============================================
                 ТОВАР
                 ============================================= -->

            <td class="product-cell">

                <div class="product-name">

                    ${escapeHtml(
                        product.name ||
                        'Без названия'
                    )}

                </div>


                <div class="product-article">

                    ${escapeHtml(
                        product.article ||
                        ''
                    )}

                    · nmId ${
                        product.nmId
                    }

                </div>

            </td>


            <!-- =============================================
                 ПОЗАВЧЕРА
                 ============================================= -->


            <td class="day-separator">

                ${formatMoney(
                    d0.buyerPrice
                )}

            </td>


            <td>

                ${formatPercent(
                    d0.spp
                )}

            </td>


            <td>

                ${formatMoney(
                    d0.sellerPrice
                )}

            </td>


            <td>

                ${formatNumber(
                    d0.sales
                )}

            </td>


            <!-- =============================================
                 ВЧЕРА
                 ============================================= -->


            <td
                class="day-separator ${
                    buyerYesterday
                }"
            >

                ${formatMoney(
                    d1.buyerPrice
                )}

            </td>


            <td
                class="${sppYesterday}"
            >

                ${formatPercent(
                    d1.spp
                )}

            </td>


            <td>

                ${formatMoney(
                    d1.sellerPrice
                )}

            </td>


            <td
                class="${salesYesterday}"
            >

                ${formatNumber(
                    d1.sales
                )}

            </td>


            <!-- =============================================
                 СЕГОДНЯ
                 ============================================= -->


            <td
                class="day-separator ${
                    buyerToday
                }"
            >

                ${formatMoney(
                    d2.buyerPrice
                )}

            </td>


            <td
                class="${sppToday}"
            >

                ${formatPercent(
                    d2.spp
                )}

            </td>


            <td>

                ${formatMoney(
                    d2.sellerPrice
                )}

            </td>


            <td
                class="${salesToday}"
            >

                ${formatNumber(
                    d2.sales
                )}

            </td>


            <!-- =============================================
                 СВОДКА
                 ============================================= -->


            <td class="day-separator">

                ${formatNumber(
                    product.todayOrders
                )}

            </td>


            <td>

                ${formatNumber(
                    product.orders30
                )}

            </td>


            <td class="stock">

                ${formatNumber(
                    product.stockToday
                )}

            </td>


            <td class="days-left">

                ${
                    product.daysLeft === null

                    ? '<span class="empty">∞</span>'

                    : formatNumber(
                        product.daysLeft,
                        1
                    ) + ' дн.'
                }

            </td>


            <td class="position">

                ${formatNumber(
                    product.positionToday,
                    1
                )}

            </td>


        </tr>

        `;
    }


    document
        .getElementById('tableBody')
        .innerHTML = html;
}


// ============================================================
// ЗАГРУЗКА
// ============================================================

async function loadData() {

    const button =
        document.getElementById(
            'refreshButton'
        );


    const status =
        document.getElementById(
            'status'
        );


    button.disabled = true;


    status.textContent =
        'Обновляем данные WB...';


    document
        .getElementById('tableBody')
        .innerHTML = `

            <tr>

                <td
                    colspan="20"
                    class="loading"
                >
                    Получаем данные из WB...
                    Это может занять несколько минут.
                </td>

            </tr>

        `;


    try {

        const response =
            await fetch(
                '/api/dashboard?ts=' +
                Date.now()
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                `HTTP ${response.status}`
            );
        }


        render(data);


        const updated =
            new Date(
                data.updatedAt
            );


        status.textContent =
            'Обновлено: ' +
            updated.toLocaleTimeString(
                'ru-RU'
            );


    } catch (error) {

        console.error(error);


        status.textContent =
            'Ошибка';


        document
            .getElementById('tableBody')
            .innerHTML = `

                <tr>

                    <td
                        colspan="20"
                        class="error"
                    >

                        ${escapeHtml(
                            error.message
                        )}

                    </td>

                </tr>

            `;

    } finally {

        button.disabled = false;
    }
}


// ============================================================
// КНОПКА
// ============================================================

document
    .getElementById(
        'refreshButton'
    )
    .addEventListener(
        'click',
        loadData
    );


// ============================================================
// ПЕРВАЯ ЗАГРУЗКА
// ============================================================

loadData();


</script>

</body>

</html>
