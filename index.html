<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta

>

<title>WB Dashboard</title>

<style>

* {
    box-sizing: border-box;
}


html,
body {
    margin: 0;
    padding: 0;
}


body {

    background:
        #f5f6f8;

    color:
        #20242b;

    font-family:
        Inter,
        Arial,
        sans-serif;

    font-size:
        14px;

}


.container {

    max-width:
        2400px;

    margin:
        0 auto;

    padding:
        18px 22px;

}


/* =========================================================
   HEADER
   ========================================================= */

.header {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    gap:
        20px;

    margin-bottom:
        14px;

}


.title {

    font-size:
        22px;

    font-weight:
        700;

}


.subtitle {

    margin-top:
        4px;

    color:
        #858b95;

    font-size:
        13px;

}


.header-right {

    display:
        flex;

    align-items:
        center;

    gap:
        10px;

    flex-wrap:
        wrap;

}


#status {

    color:
        #858b95;

    font-size:
        13px;

}


button {

    border:
        none;

    border-radius:
        9px;

    padding:
        9px 14px;

    background:
        #111827;

    color:
        white;

    font-size:
        13px;

    font-weight:
        600;

    cursor:
        pointer;

}


button:hover {

    background:
        #242b38;

}


button:disabled {

    opacity:
        .5;

    cursor:
        wait;

}


/* =========================================================
   CONTROLS
   ========================================================= */

.controls {

    background:
        white;

    border:
        1px solid #e1e5ea;

    border-radius:
        12px;

    padding:
        12px 14px;

    margin-bottom:
        12px;

    box-shadow:
        0 2px 7px rgba(0,0,0,.03);

}


.controls-row {

    display:
        flex;

    align-items:
        center;

    gap:
        16px;

    flex-wrap:
        wrap;

}


.control-group {

    display:
        flex;

    align-items:
        center;

    gap:
        8px;

}


.control-label {

    color:
        #69717c;

    font-size:
        13px;

    font-weight:
        600;

}


#daysCount {

    width:
        70px;

    padding:
        7px 8px;

    border:
        1px solid #d8dde5;

    border-radius:
        7px;

    background:
        white;

    font-size:
        13px;

}


#productFilter {

    width:
        320px;

    max-width:
        100%;

    padding:
        8px 10px;

    border:
        1px solid #d8dde5;

    border-radius:
        7px;

    outline:
        none;

    font-size:
        13px;

}


#productFilter:focus {

    border-color:
        #9aa4b2;

}


.checkbox-label {

    display:
        inline-flex;

    align-items:
        center;

    gap:
        7px;

    cursor:
        pointer;

    color:
        #4c5561;

    font-size:
        13px;

}


.checkbox-label input {

    width:
        16px;

    height:
        16px;

    cursor:
        pointer;

}


/* =========================================================
   COLUMN SETTINGS
   ========================================================= */

.columns-panel {

    margin-top:
        11px;

    border-top:
        1px solid #edf0f3;

    padding-top:
        11px;

}


.columns-title {

    color:
        #68707c;

    font-size:
        12px;

    font-weight:
        700;

    margin-bottom:
        8px;

}


.columns-groups {

    display:
        flex;

    flex-wrap:
        wrap;

    gap:
        12px 18px;

}


.columns-group {

    display:
        flex;

    flex-direction:
        column;

    gap:
        6px;

}


.columns-group-title {

    font-size:
        11px;

    color:
        #9399a3;

    font-weight:
        700;

}


/* =========================================================
   TABLE
   ========================================================= */

.table-container {

    background:
        white;

    border:
        1px solid #dfe3e8;

    border-radius:
        12px;

    overflow:
        auto;

    max-height:
        calc(100vh - 205px);

    box-shadow:
        0 2px 7px rgba(0,0,0,.03);

}


table {

    border-collapse:
        separate;

    border-spacing:
        0;

    width:

    min-width:

}


th {

    position:
        sticky;

td {

    border-bottom:

th:first-child,

tbody tr:hover td {

.product-cell {

.down {

/* =========================================================

@media (

    }

            100%;

    }


    .table-container {

        max-height:
            calc(100vh - 270px);

    }

}

</style>

<script>


// ============================================================
// СОСТОЯНИЕ
// ============================================================

let dashboardData =
    null;


let currentDaysCount =
    3;


// ============================================================
// HELPERS
// ============================================================

function escapeHtml(value) {

    return String(
        value ?? ''
    )
        .replace(
            /[&<>"']/g,
            char => ({

                '&':
                    '&amp;',

                '<':
                    '&lt;',

                '>':
                    '&gt;',

                '"':
                    '&quot;',

                "'":
                    '&#039;'

            }[char])
        );

}


function toNumber(value) {

    const number =
        Number(value);


    return Number.isFinite(
        number
    )
        ? number
        : 0;

}


function formatNumber(
    value,
    digits = 0
) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(
            Number(value)
        )
    ) {

        return `
            <span class="empty">
                —
            </span>
        `;

    }


    return Number(value)
        .toLocaleString(
            'ru-RU',
            {

                maximumFractionDigits:
                    digits

            }
        );

}


function formatMoney(value) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(
            Number(value)
        )
    ) {

        return `
            <span class="empty">
                —
            </span>
        `;

    }


    return (
        Number(value)
            .toLocaleString(
                'ru-RU',
                {

                    maximumFractionDigits:
                        0

                }
            )
        +
        ' ₽'
    );

}


function formatPercent(value) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(
            Number(value)
        )
    ) {

        return `
            <span class="empty">
                —
            </span>
        `;

    }


    return (
        Number(value)
            .toLocaleString(
                'ru-RU',
                {

                    maximumFractionDigits:
                        1

                }
            )
        +
        '%'
    );

}


function formatDate(date) {

    if (!date) {

        return '';

    }


    const parts =
        String(date).split('-');


    if (
        parts.length !== 3
    ) {

        return String(date);

    }


    return (
        parts[2]
        +
        '.'
        +
        parts[1]
    );

}


// ============================================================
// КЛАСС ИЗМЕНЕНИЯ
//
// Для количества/денег:
//
// рост      -> зелёный
// падение   -> красный
//
// Для цены:
//
// снижение  -> зелёный
// повышение -> красный
//
// Для СПП:
//
// повышение -> зелёный
// снижение  -> красный
// ============================================================

function compareClass(
    current,
    previous,
    type = 'normal'
) {

    if (
        current === null ||
        previous === null ||
        current === undefined ||
        previous === undefined
    ) {

        return '';

    }


    const a =
        Number(current);

    const b =
        Number(previous);


    if (
        !Number.isFinite(a) ||
        !Number.isFinite(b)
    ) {

        return '';

    }


    if (
        a === b
    ) {

        return 'same';

    }


    if (
        type === 'price'
    ) {

        return a < b
            ? 'up'
            : 'down';

    }


    if (
        type === 'spp'
    ) {

        return a > b
            ? 'up'
            : 'down';

    }


    return a > b
        ? 'up'
        : 'down';

}


// ============================================================
// НАСТРОЙКИ КОЛОНОК
// ============================================================

function getColumnVisibility() {

    const result = {};


    document
        .querySelectorAll(
            '[data-column]'
        )
        .forEach(
            input => {

                result[
                    input.dataset.column
                ] =
                    input.checked;

            }
        );


    return result;

}


// ============================================================
// ДНИ
//
// Сервер отдаёт дни в хронологическом порядке:
// старый -> новый.
//
// В таблице показываем:
// Сегодня -> Вчера -> ...
//
// Полный массив нужен для сравнения последнего
// отображаемого дня с предыдущим скрытым.
// ============================================================

function getVisibleDays(
    product,
    count
) {

    const allDays =
        Array.isArray(
            product?.days
        )
            ? product.days
            : [];


    return allDays
        .slice(
            Math.max(
                0,
                allDays.length - count
            )
        )
        .reverse();

}


// ============================================================
// HTML ОДНОГО ЗНАЧЕНИЯ
// ============================================================

function renderMetricCell(
    html,
    classes = '',
    separator = false
) {

    return `
        <td
            class="${separator ? 'day-separator ' : ''}${classes}"
        >
            ${html}
        </td>
    `;

}


// ============================================================
// RENDER
// ============================================================

function render(
    data
) {

    dashboardData =
        data;


    const products =
        Array.isArray(
            data?.products
        )
            ? data.products
            : [];


    const visibility =
        getColumnVisibility();


    currentDaysCount =
        Math.min(
            7,
            Math.max(
                1,
                Number(
                    document
                        .getElementById(
                            'daysCount'
                        )
                        .value
                )
            )
        );


    // ========================================================
    // PERIOD
    // ========================================================

    document
        .getElementById('period')
        .textContent =

        `Период данных: ${
            formatDate(
                data?.period?.from
            )
        } — ${
            formatDate(
                data?.period?.to
            )
        } · товаров: ${
            products.length
        }`;


    if (
        !products.length
    ) {

        document
            .getElementById(
                'tableBody'
            )
            .innerHTML = `

                <tr>

                    <td
                        colspan="100"
                        class="error"
                    >

                        За последние 30 дней
                        заказов нет.

                    </td>

                </tr>

            `;

        return;

    }


    // ========================================================
    // ДНИ
    // ========================================================

    const visibleDays =
        getVisibleDays(
            products[0],
            currentDaysCount
        );


    if (
        !visibleDays.length
    ) {

        return;

    }


    // ========================================================
    // HEADER
    // ========================================================

    let headerTop = `

        <tr>

            <th
                rowspan="2"
                class="product-header"
            >

                Товар

            </th>

    `;


    let headerBottom = `
        <tr>
    `;


    visibleDays.forEach(
        (
            day,
            index
        ) => {

            const isToday =
                index === 0;


            let colspan =
                0;


            if (
                visibility.buyerPrice
            ) colspan++;


            if (
                visibility.spp
            ) colspan++;


            if (
                visibility.sellerPrice
            ) colspan++;


            if (
                visibility.allOrders
            ) colspan++;


            if (
                visibility.sales
            ) colspan++;


            if (
                visibility.adViews
            ) colspan++;


            if (
                visibility.adClicks
            ) colspan++;


            if (
                visibility.adCarts
            ) colspan++;


            if (
                visibility.adCpm
            ) colspan++;


            if (
                visibility.adSpend
            ) colspan++;


            if (
                visibility.adOrders
            ) colspan++;


            if (
                visibility.adOrdersAmount
            ) colspan++;


            if (
                visibility.forPay
            ) colspan++;


            if (
                visibility.logistics
            ) colspan++;


            if (
                visibility.storage
            ) colspan++;


            if (
                visibility.tax
            ) colspan++;


            if (
                visibility.profit
            ) colspan++;


            if (
                visibility.profitability
            ) colspan++;


            if (
                visibility.margin
            ) colspan++;


            if (
                colspan === 0
            ) {

                colspan = 1;

            }


            headerTop += `

                <th
                    colspan="${colspan}"
                    class="day-title day-separator"
                >

                    ${
                        isToday
                            ? 'Сегодня'
                            : index === 1
                                ? 'Вчера'
                                : index === 2
                                    ? 'Позавчера'
                                    : `${index} дн. назад`
                    }

                    <span class="day-date">

                        ${formatDate(day?.date)}

                    </span>

                </th>

            `;


            // -----------------------------------------------
            // ЦЕНА ПОКУПАТЕЛЯ
            // -----------------------------------------------

            if (
                visibility.buyerPrice
            ) {

                headerBottom += `

                    <th
                        class="day-separator day-col-money"
                    >

                        Цена<br>
                        покупателя

                    </th>

                `;

            }


            // -----------------------------------------------
            // СПП
            // -----------------------------------------------

            if (
                visibility.spp
            ) {

                headerBottom += `

                    <th class="day-col">

                        СПП

                    </th>

                `;

            }


            // -----------------------------------------------
            // ЦЕНА ПРОДАВЦА
            // -----------------------------------------------

            if (
                visibility.sellerPrice
            ) {

                headerBottom += `

                    <th class="day-col-money">

                        Цена<br>
                        продавца

                    </th>

                `;

            }


            // -----------------------------------------------
            // ВСЕ ЗАКАЗЫ
            // -----------------------------------------------

            if (
                visibility.allOrders
            ) {

                headerBottom += `

                    <th class="day-col">

                        Все<br>
                        заказы

                    </th>

                `;

            }


            // -----------------------------------------------
            // ПРОДАЖИ
            // -----------------------------------------------

            if (
                visibility.sales
            ) {

                headerBottom += `

                    <th class="day-col">

                        Продажи

                    </th>

                `;

            }


            // -----------------------------------------------
            // ПРОДВИЖЕНИЕ
            // -----------------------------------------------

            if (
                visibility.adViews ||
                visibility.adClicks ||
                visibility.adCarts ||
                visibility.adCpm ||
                visibility.adSpend ||
                visibility.adOrders ||
                visibility.adOrdersAmount
            ) {

                // Группа уже обозначена в названиях столбцов.
                // Внутри дня используются короткие названия.

            }


            if (
                visibility.adViews
            ) {

                headerBottom += `

                    <th class="day-col">

                        Показы

                    </th>

                `;

            }


            if (
                visibility.adClicks
            ) {

                headerBottom += `

                    <th class="day-col">

                        Клики

                    </th>

                `;

            }


            if (
                visibility.adCarts
            ) {

                headerBottom += `

                    <th class="day-col">

                        Корзины

                    </th>

                `;

            }


            if (
                visibility.adCpm
            ) {

                headerBottom += `

                    <th class="day-col-money">

                        CPM

                    </th>

                `;

            }


            if (
                visibility.adSpend
            ) {

                headerBottom += `

                    <th class="day-col-money">

                        Затраты

                    </th>

                `;

            }


            if (
                visibility.adOrders
            ) {

                headerBottom += `

                    <th class="day-col">

                        Заказы

                    </th>

                `;

            }


            if (
                visibility.adOrdersAmount
            ) {

                headerBottom += `

                    <th class="day-col-money">

                        Сумма<br>
                        заказов

                    </th>

                `;

            }


            // -----------------------------------------------
            // ФИНАНСЫ
            // -----------------------------------------------

            if (
                visibility.forPay
            ) {

                headerBottom += `

                    <th class="day-col-money">

                        К<br>
                        перечислению

                    </th>

                `;

            }


            if (
                visibility.logistics
            ) {

                headerBottom += `

                    <th class="day-col-money">

                        Логистика

                    </th>

                `;

            }


            if (
                visibility.storage
            ) {

                headerBottom += `

                    <th class="day-col-money">

                        Хранение

                    </th>

                `;

            }


            if (
                visibility.tax
            ) {

                headerBottom += `

                    <th class="day-col-money">

                        Налог

                    </th>

                `;

            }


            if (
                visibility.profit
            ) {

                headerBottom += `

                    <th class="day-col-money">

                        Прибыль

                    </th>

                `;

            }


            if (
                visibility.profitability
            ) {

                headerBottom += `

                    <th class="day-col-money">

                        Рентабельность

                    </th>

                `;

            }


            if (
                visibility.margin
            ) {

                headerBottom += `

                    <th class="day-col-money">

                        Маржа

                    </th>

                `;

            }

        }
    );


    headerBottom += `
        </tr>
    `;


    // ========================================================
    // ПРОДВИЖЕНИЕ — визуальная подпись
    // ========================================================

    /*
     * Добавляем строку названий не отдельным rowspan,
     * чтобы не ломать соответствие колонок.
     *
     * Заголовок каждой рекламной колонки начинается
     * с соответствующего показателя.
     */


    headerTop += `

        <th
            rowspan="2"
            class="day-separator"
        >

            Остаток<br>
            сегодня

        </th>

        <th
            rowspan="2"
        >

            Хватит<br>
            на

        </th>

        <th
            rowspan="2"
        >

            Позиция

        </th>

        <th
            rowspan="2"
        >

            Себестоимость

        </th>

    `;


    document
        .getElementById(
            'tableHead'
        )
        .innerHTML =

        headerTop +
        '</tr>' +
        headerBottom;


    // ========================================================
    // BODY
    // ========================================================

    let html =
        '';


    const hideZeroSales =
        document
            .getElementById(
                'hideZeroSales'
            )
            .checked;


    const search =
        String(
            document
                .getElementById(
                    'productFilter'
                )
                .value ||
            ''
        )
            .trim()
            .toLowerCase();


    // ========================================================
    // SORT
    //
    // По всем заказам за выбранные дни.
    // По убыванию.
    // ========================================================

    const sortedProducts =
        [...products]
            .sort(
                (
                    a,
                    b
                ) => {

                    const aDays =
                        getVisibleDays(
                            a,
                            currentDaysCount
                        );


                    const bDays =
                        getVisibleDays(
                            b,
                            currentDaysCount
                        );


                    const aOrders =
                        aDays.reduce(
                            (
                                sum,
                                day
                            ) =>
                                sum +
                                toNumber(
                                    day?.allOrders ??
                                    day?.orders
                                ),
                            0
                        );


                    const bOrders =
                        bDays.reduce(
                            (
                                sum,
                                day
                            ) =>
                                sum +
                                toNumber(
                                    day?.allOrders ??
                                    day?.orders
                                ),
                            0
                        );


                    return (
                        bOrders -
                        aOrders
                    );

                }
            );


    for (
        const product of sortedProducts
    ) {


        // ====================================================
        // ФИЛЬТР
        // ====================================================

        const searchText = (

            String(
                product?.name ||
                ''
            )
            +
            ' ' +
            String(
                product?.article ||
                ''
            )
            +
            ' ' +
            String(
                product?.nmId ||
                ''
            )

        )
            .toLowerCase();


        if (
            search &&
            !searchText.includes(
                search
            )
        ) {

            continue;

        }


        // ====================================================
        // ДНИ
        // ====================================================

        const allProductDays =
            Array.isArray(
                product?.days
            )
                ? product.days
                : [];


        const visibleProductDays =
            getVisibleDays(
                product,
                currentDaysCount
            );


        // ====================================================
        // НУЛЕВЫЕ ПРОДАЖИ
        //
        // Проверяем ИМЕННО продажи, а не заказы.
        // ====================================================

        const salesForPeriod =
            visibleProductDays.reduce(
                (
                    sum,
                    day
                ) =>
                    sum +
                    toNumber(
                        day?.sales
                    ),
                0
            );


        if (
            hideZeroSales &&
            salesForPeriod <= 0
        ) {

            continue;

        }


        // ====================================================
        // ПРЕДЫДУЩИЙ СКРЫТЫЙ ДЕНЬ
        //
        // Последний отображаемый день сравниваем
        // с предыдущим календарным днём, который
        // находится за пределами выбранного диапазона.
        // ====================================================

        const visibleCount =
            visibleProductDays.length;


        html += `
            <tr>
        `;


        // ====================================================
        // ТОВАР
        // ====================================================

        html += `

            <td
                class="product-cell"
            >

                <div class="product-name">

                    ${escapeHtml(
                        product?.name ||
                        'Без названия'
                    )}

                </div>


                <div
                    class="product-article"
                >

                    ${escapeHtml(
                        product?.article ||
                        ''
                    )}

                    <span class="product-nmid">

                        · nmId ${
                            escapeHtml(
                                product?.nmId ||
                                ''
                            )
                        }

                    </span>

                </div>

            </td>

        `;


        // ====================================================
        // ДНИ
        // ====================================================

        visibleProductDays.forEach(
            (
                day,
                index
            ) => {

                const actualIndex =
                    allProductDays.length -
                    1 -
                    index;


                const previousDay =
                    actualIndex > 0
                        ? allProductDays[
                            actualIndex - 1
                        ]
                        : null;


                // --------------------------------------------
                // ДАННЫЕ
                // --------------------------------------------

                const buyerPrice =
                    day?.buyerPrice;


                const spp =
                    day?.spp;


                const sellerPrice =
                    day?.sellerPrice;


                const allOrders =
                    toNumber(
                        day?.allOrders ??
                        day?.orders
                    );


                const sales =
                    toNumber(
                        day?.sales
                    );


                const advertising =
                    day?.advertising ||
                    {};


                const adViews =
                    toNumber(
                        advertising?.views
                    );


                const adClicks =
                    toNumber(
                        advertising?.clicks
                    );


                const adCarts =
                    toNumber(
                        advertising?.atbs
                    );


                const adCpm =
                    toNumber(
                        advertising?.cpm
                    );


                const adSpend =
                    toNumber(
                        advertising?.spend
                    );


                const adOrders =
                    toNumber(
                        advertising?.orders
                    );


                const adOrdersAmount =
                    toNumber(
                        advertising?.ordersAmount
                    );


                const financial =
                    day?.financial ||
                    {};


                const forPay =
                    financial?.forPay;


                const logistics =
                    financial?.logistics;


                const storage =
                    financial?.storage;


                const tax =
                    financial?.tax;


                const profit =
                    financial?.profit;


                const profitability =
                    financial?.profitability;


                const margin =
                    financial?.margin;


                // --------------------------------------------
                // ПРЕДЫДУЩИЕ ЗНАЧЕНИЯ
                // --------------------------------------------

                const previousOrders =
                    previousDay
                        ? toNumber(
                            previousDay?.allOrders ??
                            previousDay?.orders
                        )
                        : null;


                const previousSales =
                    previousDay
                        ? toNumber(
                            previousDay?.sales
                        )
                        : null;


                const previousBuyer =
                    previousDay
                        ? previousDay?.buyerPrice
                        : null;


                const previousSpp =
                    previousDay
                        ? previousDay?.spp
                        : null;


                const previousSeller =
                    previousDay
                        ? previousDay?.sellerPrice
                        : null;


                const previousAdvertising =
                    previousDay?.advertising ||
                    {};


                const previousAdViews =
                    previousDay
                        ? toNumber(
                            previousAdvertising?.views
                        )
                        : null;


                const previousAdClicks =
                    previousDay
                        ? toNumber(
                            previousAdvertising?.clicks
                        )
                        : null;


                const previousAdCarts =
                    previousDay
                        ? toNumber(
                            previousAdvertising?.atbs
                        )
                        : null;


                const previousAdCpm =
                    previousDay
                        ? toNumber(
                            previousAdvertising?.cpm
                        )
                        : null;


                const previousAdSpend =
                    previousDay
                        ? toNumber(
                            previousAdvertising?.spend
                        )
                        : null;


                const previousAdOrders =
                    previousDay
                        ? toNumber(
                            previousAdvertising?.orders
                        )
                        : null;


                const previousAdOrdersAmount =
                    previousDay
                        ? toNumber(
                            previousAdvertising?.ordersAmount
                        )
                        : null;


                const previousFinancial =
                    previousDay?.financial ||
                    {};


                // --------------------------------------------
                // КЛАССЫ
                // --------------------------------------------

                const buyerClass =
                    compareClass(
                        buyerPrice,
                        previousBuyer,
                        'price'
                    );


                const sppClass =
                    compareClass(
                        spp,
                        previousSpp,
                        'spp'
                    );


                const sellerClass =
                    compareClass(
                        sellerPrice,
                        previousSeller,
                        'price'
                    );


                const ordersClass =
                    compareClass(
                        allOrders,
                        previousOrders,
                        'normal'
                    );


                const salesClass =
                    compareClass(
                        sales,
                        previousSales,
                        'normal'
                    );


                const adViewsClass =
                    compareClass(
                        adViews,
                        previousAdViews,
                        'normal'
                    );


                const adClicksClass =
                    compareClass(
                        adClicks,
                        previousAdClicks,
                        'normal'
                    );


                const adCartsClass =
                    compareClass(
                        adCarts,
                        previousAdCarts,
                        'normal'
                    );


                const adCpmClass =
                    compareClass(
                        adCpm,
                        previousAdCpm,
                        'normal'
                    );


                const adSpendClass =
                    compareClass(
                        adSpend,
                        previousAdSpend,
                        'normal'
                    );


                const adOrdersClass =
                    compareClass(
                        adOrders,
                        previousAdOrders,
                        'normal'
                    );


                const adOrdersAmountClass =
                    compareClass(
                        adOrdersAmount,
                        previousAdOrdersAmount,
                        'normal'
                    );


                const profitabilityClass =
                    compareClass(
                        profitability,
                        previousFinancial?.profitability,
                        'normal'
                    );


                const marginClass =
                    compareClass(
                        margin,
                        previousFinancial?.margin,
                        'normal'
                    );


                // --------------------------------------------
                // ЦЕНА ПОКУПАТЕЛЯ
                // --------------------------------------------

                if (
                    visibility.buyerPrice
                ) {

                    html +=
                        renderMetricCell(
                            formatMoney(
                                buyerPrice
                            ),
                            buyerClass,
                            true
                        );

                }


                // --------------------------------------------
                // СПП
                // --------------------------------------------

                if (
                    visibility.spp
                ) {

                    html +=
                        renderMetricCell(
                            formatPercent(
                                spp
                            ),
                            sppClass
                        );

                }


                // --------------------------------------------
                // ЦЕНА ПРОДАВЦА
                // --------------------------------------------

                if (
                    visibility.sellerPrice
                ) {

                    html +=
                        renderMetricCell(
                            formatMoney(
                                sellerPrice
                            ),
                            sellerClass
                        );

                }


                // --------------------------------------------
                // ВСЕ ЗАКАЗЫ
                // --------------------------------------------

                if (
                    visibility.allOrders
                ) {

                    html +=
                        renderMetricCell(
                            formatNumber(
                                allOrders
                            ),
                            ordersClass
                        );

                }


                // --------------------------------------------
                // ПРОДАЖИ
                // --------------------------------------------

                if (
                    visibility.sales
                ) {

                    html +=
                        renderMetricCell(
                            formatNumber(
                                sales
                            ),
                            salesClass
                        );

                }


                // --------------------------------------------
                // ПРОДВИЖЕНИЕ
                // --------------------------------------------

                if (
                    visibility.adViews
                ) {

                    html +=
                        renderMetricCell(
                            formatNumber(
                                adViews
                            ),
                            adViewsClass
                        );

                }


                if (
                    visibility.adClicks
                ) {

                    html +=
                        renderMetricCell(
                            formatNumber(
                                adClicks
                            ),
                            adClicksClass
                        );

                }


                if (
                    visibility.adCarts
                ) {

                    html +=
                        renderMetricCell(
                            formatNumber(
                                adCarts
                            ),
                            adCartsClass
                        );

                }


                if (
                    visibility.adCpm
                ) {

                    html +=
                        renderMetricCell(
                            formatMoney(
                                adCpm
                            ),
                            adCpmClass
                        );

                }


                if (
                    visibility.adSpend
                ) {

                    html +=
                        renderMetricCell(
                            formatMoney(
                                adSpend
                            ),
                            adSpendClass
                        );

                }


                if (
                    visibility.adOrders
                ) {

                    html +=
                        renderMetricCell(
                            formatNumber(
                                adOrders
                            ),
                            adOrdersClass
                        );

                }


                if (
                    visibility.adOrdersAmount
                ) {

                    html +=
                        renderMetricCell(
                            formatMoney(
                                adOrdersAmount
                            ),
                            adOrdersAmountClass
                        );

                }


                // --------------------------------------------
                // ФИНАНСЫ
                // --------------------------------------------

                if (
                    visibility.forPay
                ) {

                    html +=
                        renderMetricCell(
                            formatMoney(
                                forPay
                            ),
                            '',
                            false
                        );

                }


                if (
                    visibility.logistics
                ) {

                    html +=
                        renderMetricCell(
                            formatMoney(
                                logistics
                            )
                        );

                }


                if (
                    visibility.storage
                ) {

                    html +=
                        renderMetricCell(
                            formatMoney(
                                storage
                            )
                        );

                }


                if (
                    visibility.tax
                ) {

                    html +=
                        renderMetricCell(
                            formatMoney(
                                tax
                            )
                        );

                }


                if (
                    visibility.profit
                ) {

                    const profitClass =
                        profit == null
                            ? ''
                            : profit > 0
                                ? 'positive'
                                : profit < 0
                                    ? 'negative'
                                    : '';


                    html +=
                        renderMetricCell(
                            formatMoney(
                                profit
                            ),
                            profitClass
                        );

                }


                if (
                    visibility.profitability
                ) {

                    html +=
                        renderMetricCell(
                            formatPercent(
                                profitability
                            ),
                            profitabilityClass
                        );

                }


                if (
                    visibility.margin
                ) {

                    html +=
                        renderMetricCell(
                            formatPercent(
                                margin
                            ),
                            marginClass
                        );

                }

            }
        );


        // ====================================================
        // СВОДКА
        // ====================================================

        html += `

            <td class="day-separator stock">

                ${formatNumber(
                    product?.stockToday
                )}

            </td>


            <td class="days-left">

                ${
                    product?.daysLeft === null ||
                    product?.daysLeft === undefined

                        ? '<span class="empty">∞</span>'

                        : formatNumber(
                            product.daysLeft,
                            1
                        )
                        +
                        ' дн.'
                }

            </td>


            <td class="position">

                ${formatNumber(
                    product?.positionToday,
                    1
                )}

            </td>


            <td>

                ${formatMoney(
                    product?.cost
                )}

            </td>

        `;


        html += `
            </tr>
        `;

    }


    // ========================================================
    // OUTPUT
    // ========================================================

    document
        .getElementById(
            'tableBody'
        )
        .innerHTML =

        html ||
        `

            <tr>

                <td
                    colspan="100"
                    class="error"
                >

                    По выбранным условиям
                    товары не найдены.

                </td>

            </tr>

        `;

}


// ============================================================
// COLUMN VISIBILITY
// ============================================================

function rerender() {

    if (
        !dashboardData
    ) {

        return;

    }


    render(
        dashboardData
    );

}


document
    .querySelectorAll(
        '[data-column]'
    )
    .forEach(
        input => {

            input.addEventListener(
                'change',
                rerender
            );

        }
    );


// ============================================================
// DAYS
// ============================================================

document
    .getElementById(
        'daysCount'
    )
    .addEventListener(
        'change',
        () => {

            currentDaysCount =
                Number(
                    document
                        .getElementById(
                            'daysCount'
                        )
                        .value
                );


            rerender();

        }
    );


// ============================================================
// FILTER
// ============================================================

document
    .getElementById(
        'productFilter'
    )
    .addEventListener(
        'input',
        rerender
    );


// ============================================================
// ZERO SALES
// ============================================================

document
    .getElementById(
        'hideZeroSales'
    )
    .addEventListener(
        'change',
        rerender
    );


// ============================================================
// LOAD DATA
// ============================================================

async function loadData() {

    const button =
        document
            .getElementById(
                'refreshButton'
            );


    const status =
        document
            .getElementById(
                'status'
            );


    button.disabled =
        true;


    status.textContent =
        'Обновляем данные WB...';


    document
        .getElementById(
            'tableBody'
        )
        .innerHTML = `

            <tr>

                <td
                    colspan="100"
                    class="loading"
                >

                    Получаем данные из WB...
                    Это может занять несколько минут.

                </td>

            </tr>

        `;


    try {

        const response =
            await fetch(
                '/api/dashboard?ts=' +
                Date.now()
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                `HTTP ${response.status}`
            );

        }


        dashboardData =
            data;


        render(
            data
        );


        const updated =
            new Date(
                data.updatedAt
            );


        status.textContent =
            'Обновлено: ' +
            updated.toLocaleTimeString(
                'ru-RU'
            );

    } catch (
        error
    ) {

        console.error(
            error
        );


        status.textContent =
            'Ошибка';


        document
            .getElementById(
                'tableBody'
            )
            .innerHTML = `

                <tr>

                    <td
                        colspan="100"
                        class="error"
                    >

                        ${escapeHtml(
                            error.message
                        )}

                    </td>

                </tr>

            `;

    } finally {

        button.disabled =
            false;

    }

}


// ============================================================
// BUTTON
// ============================================================

document
    .getElementById(
        'refreshButton'
    )
    .addEventListener(
        'click',
        loadData
    );


// ============================================================
// INITIAL LOAD
// ============================================================

loadData();

</script>

</body>

</html>
