<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>WB Dashboard</title>


<style>

/* =========================================================
   BASE
   ========================================================= */

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    background: #f5f6f8;

    color: #20242b;

    font-family:
        Inter,
        Arial,
        sans-serif;

    font-size: 13px;
}


.container {

    max-width: 1900px;

    margin: auto;

    padding: 18px 22px;
}


/* =========================================================
   HEADER
   ========================================================= */

.header {

    display: flex;

    justify-content:
        space-between;

    align-items:
        center;

    margin-bottom:
        14px;
}


.title {

    font-size:
        21px;

    font-weight:
        700;
}


.subtitle {

    margin-top:
        3px;

    color:
        #858b95;

    font-size:
        12px;
}


.header-right {

    display: flex;

    align-items:
        center;

    gap:
        12px;
}


#status {

    color:
        #858b95;

    font-size:
        12px;
}


button {

    border:
        none;

    border-radius:
        9px;

    padding:
        9px 14px;

    background:
        #111827;

    color:
        white;

    font-size:
        13px;

    font-weight:
        600;

    cursor:
        pointer;
}


button:hover {

    background:
        #242b38;
}


button:disabled {

    opacity:
        .5;

    cursor:
        wait;
}


/* =========================================================
   TABLE
   ========================================================= */

.table-container {

    background:
        white;

    border:
        1px solid #e5e7eb;

    border-radius:
        12px;

    overflow:
        auto;

    box-shadow:
        0 2px 7px
        rgba(0,0,0,.03);
}


table {

    border-collapse:
        separate;

    border-spacing:
        0;

    width:
        100%;

    min-width:
        1280px;

    table-layout:
        auto;
}


/* =========================================================
   HEADER CELLS
   ========================================================= */

th {

    position:
        sticky;

    top:
        0;

    z-index:
        5;

    background:
        #fafbfc;

    color:
        #68707c;

    font-size:
        11px;

    font-weight:
        700;

    padding:
        7px;

    border-bottom:
        1px solid #e5e7eb;

    white-space:
        nowrap;

    text-align:
        right;
}


/* =========================================================
   ТОВАР
   ========================================================= */

th.product-header {

    text-align:
        center;

    width:
        235px;

    min-width:
        235px;

    max-width:
        235px;
}


/* =========================================================
   ЗАГОЛОВКИ ДНЕЙ
   ========================================================= */

.day-title {

    text-align:
        center;

    font-size:
        12px;

    color:
        #242932;
}


.day-date {

    display:
        block;

    color:
        #8b919a;

    font-size:
        10px;

    font-weight:
        400;

    margin-top:
        2px;
}


/* =========================================================
   TABLE CELLS
   ========================================================= */

td {

    padding:
        7px;

    border-bottom:
        1px solid #edf0f3;

    white-space:
        nowrap;

    text-align:
        right;

    font-variant-numeric:
        tabular-nums;
}


tbody tr:hover td {

    background:
        #fafcff;
}


/* =========================================================
   PRODUCT
   ========================================================= */

.product-cell {

    width:
        235px;

    min-width:
        235px;

    max-width:
        235px;

    text-align:
        left;

    white-space:
        normal;

    overflow:
        hidden;

    vertical-align:
        middle;
}


.product-name {

    font-weight:
        600;

    line-height:
        1.25;

    overflow:
        hidden;

    display:
        -webkit-box;

    -webkit-box-orient:
        vertical;

    -webkit-line-clamp:
        3;

    line-clamp:
        3;

    white-space:
        normal;

    overflow-wrap:
        anywhere;
}


.product-article {

    color:
        #858b95;

    font-size:
        11px;

    margin-top:
        3px;

    overflow:
        hidden;

    text-overflow:
        ellipsis;

    white-space:
        nowrap;
}


/* =========================================================
   РАЗДЕЛИТЕЛЬ ДНЕЙ
   ========================================================= */

.day-separator {

    border-left:
        2px solid #e9ebef !important;
}


/* =========================================================
   ПОДСВЕТКА
   ========================================================= */

.up {

    background:
        #dff5e6 !important;

    color:
        #14783b;

    font-weight:
        700;
}


.down {

    background:
        #ffe1e1 !important;

    color:
        #b42318;

    font-weight:
        700;
}


.same {

    color:
        #505762;
}


/* =========================================================
   OTHER
   ========================================================= */

.stock {

    font-weight:
        700;
}


.days-left {

    font-weight:
        700;
}


.position {

    font-weight:
        700;
}


.cost {

    font-weight:
        700;
}


.empty {

    color:
        #a3a8b0;
}


.error {

    padding:
        35px;

    text-align:
        center;

    color:
        #b42318;
}


.loading {

    padding:
        35px;

    text-align:
        center;

    color:
        #858b95;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (
    max-width: 800px
) {

    .container {

        padding:
            10px;
    }


    .header {

        align-items:
            flex-start;

        flex-direction:
            column;

        gap:
            10px;
    }


    .header-right {

        width:
            100%;

        justify-content:
            space-between;
    }


    .product-cell,
    th.product-header {

        width:
            190px;

        min-width:
            190px;

        max-width:
            190px;
    }

}


/* =========================================================
   ФИЛЬТРЫ ТОВАРОВ
   ========================================================= */

.table-filters {

    display: flex;

    align-items: flex-end;

    gap: 18px;

    margin-bottom: 12px;

    padding: 10px 12px;

    background: white;

    border: 1px solid #e5e7eb;

    border-radius: 12px;
}

.filter-group {

    display: flex;

    flex-direction: column;

    gap: 5px;

    width: 420px;
}

.filter-group label {

    color: #68707c;

    font-size: 11px;

    font-weight: 700;
}

#productFilter {

    width: 100%;

    height: 36px;

    padding: 0 11px;

    border: 1px solid #d9dde3;

    border-radius: 8px;

    outline: none;

    background: white;

    color: #20242b;

    font-size: 13px;
}

#productFilter:focus {

    border-color: #9aa2ad;
}

.zero-sales-filter {

    display: flex;

    align-items: center;

    gap: 7px;

    height: 36px;

    color: #3f4650;

    font-size: 12px;

    cursor: pointer;

    user-select: none;
}

.zero-sales-filter input {

    width: 16px;

    height: 16px;

    margin: 0;

    cursor: pointer;
}

/* =========================================================
   РОВНЫЕ КОЛОНКИ
   ========================================================= */

table {

    table-layout: fixed;

    min-width: 2300px;
}

.day-cell {

    width: 82px;

    min-width: 82px;

    max-width: 82px;
}

.day-cell-wide {

    width: 100px;

    min-width: 100px;

    max-width: 100px;
}

.result-cell {

    width: 95px;

    min-width: 95px;

    max-width: 95px;
}

th,
td {

    overflow: hidden;

    text-overflow: ellipsis;
}

</style>

</head>


<body>


<div class="container">


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <div class="header">

        <div>

            <div class="title">
                Wildberries · товары
            </div>

            <div
                class="subtitle"
                id="period"
            >
                Загрузка...
            </div>

        </div>


        <div class="header-right">

            <div id="status">
            </div>

            <button
                id="refreshButton"
            >
                ↻ Обновить данные
            </button>

        </div>

    </div>


    <!-- =====================================================
         ФИЛЬТРЫ
         ===================================================== -->

    <div class="table-filters">

        <div class="filter-group">

            <label for="productFilter">
                Фильтр товаров
            </label>

            <input
                type="text"
                id="productFilter"
                placeholder="Название, код или nmId"
                autocomplete="off"
            >

        </div>

        <label class="zero-sales-filter">

            <input
                type="checkbox"
                id="hideZeroSales"
                checked
            >

            <span>
                Нулевые продажи скрыты
            </span>

        </label>

    </div>


    <!-- =====================================================
         TABLE
         ===================================================== -->

    <div class="table-container">

        <table>

            <thead
                id="tableHead"
            >
            </thead>


            <tbody
                id="tableBody"
            >

                <tr>

                    <td
                        colspan="50"
                        class="loading"
                    >
                        Загрузка данных WB...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


<script>


// ============================================================
// HELPERS
// ============================================================

function escapeHtml(value) {

    return String(
        value ?? ''
    )

        .replace(
            /[&<>"']/g,
            char => ({

                '&':
                    '&amp;',

                '<':
                    '&lt;',

                '>':
                    '&gt;',

                '"':
                    '&quot;',

                "'":
                    '&#039;'

            }[char])
        );

}


// ============================================================
// ЧИСЛА
// ============================================================

function formatNumber(
    value,
    digits = 0
) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(
            Number(value)
        )
    ) {

        return `
            <span class="empty">
                —
            </span>
        `;

    }


    return Number(
        value
    )

        .toLocaleString(
            'ru-RU',
            {

                maximumFractionDigits:
                    digits

            }
        );

}


// ============================================================
// ДЕНЬГИ
// ============================================================

function formatMoney(value) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(
            Number(value)
        )
    ) {

        return `
            <span class="empty">
                —
            </span>
        `;

    }


    return (

        Number(value)

            .toLocaleString(
                'ru-RU',
                {

                    maximumFractionDigits:
                        0

                }
            )

        + ' ₽'

    );

}


// ============================================================
// ДЕНЬГИ РЕКЛАМЫ
// ============================================================

function formatAdMoney(value) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(
            Number(value)
        )
    ) {

        return `
            <span class="empty">
                —
            </span>
        `;

    }


    return (

        Number(value)

            .toLocaleString(
                'ru-RU',
                {

                    minimumFractionDigits:
                        2,

                    maximumFractionDigits:
                        2

                }
            )

        + ' ₽'

    );

}


// ============================================================
// ПРОЦЕНТ
// ============================================================

function formatPercent(value) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(
            Number(value)
        )
    ) {

        return `
            <span class="empty">
                —
            </span>
        `;

    }


    return (

        Number(value)

            .toLocaleString(
                'ru-RU',
                {

                    maximumFractionDigits:
                        1

                }
            )

        + '%'

    );

}


// ============================================================
// ДАТА
// ============================================================

function formatDate(date) {

    if (!date) {

        return '';

    }


    const parts =
        String(date).split('-');


    if (
        parts.length !== 3
    ) {

        return String(date);

    }


    return `${
        parts[2]
    }.${
        parts[1]
    }`;

}


// ============================================================
// КЛАСС ИЗМЕНЕНИЯ
// ============================================================

function getChangeClass(
    current,
    previous,
    type
) {

    if (
        current === null ||
        previous === null ||
        current === undefined ||
        previous === undefined
    ) {

        return '';

    }


    const currentNumber =
        Number(current);


    const previousNumber =
        Number(previous);


    if (
        !Number.isFinite(
            currentNumber
        ) ||
        !Number.isFinite(
            previousNumber
        )
    ) {

        return '';

    }


    if (
        currentNumber ===
        previousNumber
    ) {

        return 'same';

    }


    if (
        type === 'price'
    ) {

        return currentNumber <
            previousNumber
            ? 'up'
            : 'down';

    }


    if (
        type === 'spp'
    ) {

        return currentNumber >
            previousNumber
            ? 'up'
            : 'down';

    }


    if (
        type === 'sales'
    ) {

        return currentNumber >
            previousNumber
            ? 'up'
            : 'down';

    }


    return '';

}


// ============================================================
// RENDER
// ============================================================

function render(data) {

    // ========================================================
    // ВСЕ ТОВАРЫ
    // ========================================================

    const allProducts =
        Array.isArray(data.products)
            ? data.products
            : [];


    // ========================================================
    // ФИЛЬТРЫ
    // ========================================================

    const filterInput =
        document.getElementById(
            'productFilter'
        );

    const hideZeroSalesCheckbox =
        document.getElementById(
            'hideZeroSales'
        );

    const filterText =
        String(
            filterInput?.value || ''
        )
            .trim()
            .toLowerCase();

    const hideZeroSales =
        hideZeroSalesCheckbox
            ? hideZeroSalesCheckbox.checked
            : true;


    // ========================================================
    // ФИЛЬТРАЦИЯ ТОВАРОВ
    //
    // При включённой галочке показываем только товары,
    // у которых была хотя бы одна продажа за 3 последних дня.
    //
    // Поиск работает по:
    // - названию
    // - коду / артикулу
    // - nmId
    // ========================================================

    const products =
        allProducts.filter(
            product => {

                const dayBefore =
                    product.days?.[0] || {};

                const yesterday =
                    product.days?.[1] || {};

                const today =
                    product.days?.[2] || {};

                const sales3Days =
                    Number(dayBefore.sales || 0) +
                    Number(yesterday.sales || 0) +
                    Number(today.sales || 0);

                if (
                    hideZeroSales &&
                    sales3Days <= 0
                ) {
                    return false;
                }

                if (filterText) {

                    const name =
                        String(
                            product.name || ''
                        ).toLowerCase();

                    const article =
                        String(
                            product.article || ''
                        ).toLowerCase();

                    const nmId =
                        String(
                            product.nmId || ''
                        ).toLowerCase();

                    if (
                        !name.includes(filterText) &&
                        !article.includes(filterText) &&
                        !nmId.includes(filterText)
                    ) {
                        return false;
                    }
                }

                return true;
            }
        );


    // ========================================================
    // ПЕРИОД
    // ========================================================

    document
        .getElementById('period')
        .textContent =
            `Заказы: ${
                formatDate(data.period.from)
            } — ${
                formatDate(data.period.to)
            } · товаров: ${
                products.length
            }`;


    // ========================================================
    // НЕТ ТОВАРОВ
    // ========================================================

    if (!products.length) {

        document
            .getElementById('tableHead')
            .innerHTML = '';

        document
            .getElementById('tableBody')
            .innerHTML = `

                <tr>

                    <td
                        colspan="50"
                        class="error"
                    >

                        ${
                            filterText
                                ? 'Товары не найдены.'
                                : hideZeroSales
                                    ? 'За последние 3 дня продаж нет.'
                                    : 'Товары отсутствуют.'
                        }

                    </td>

                </tr>

            `;

        return;
    }


    // ========================================================
    // ДНИ
    // ========================================================

    const today =
        products[0].days[2];

    const yesterday =
        products[0].days[1];

    const dayBefore =
        products[0].days[0];


    // ========================================================
    // HEADER
    // ========================================================

    document
        .getElementById('tableHead')
        .innerHTML = `

        <tr>

            <th
                rowspan="2"
                class="product-header"
            >
                Товар
            </th>

            <!-- ================== СЕГОДНЯ ================== -->

            <th
                colspan="9"
                class="day-title day-separator"
            >

                Сегодня

                <span class="day-date">
                    ${formatDate(today.date)}
                </span>

            </th>


            <!-- ==================== ВЧЕРА ==================== -->

            <th
                colspan="16"
                class="day-title day-separator"
            >

                Вчера

                <span class="day-date">
                    ${formatDate(yesterday.date)}
                </span>

            </th>


            <!-- ================= ПОЗАВЧЕРА ================= -->

            <th
                colspan="16"
                class="day-title day-separator"
            >

                Позавчера

                <span class="day-date">
                    ${formatDate(dayBefore.date)}
                </span>

            </th>


            <!-- ==================== ИТОГИ ==================== -->

            <th
                rowspan="2"
                class="day-separator result-cell"
            >
                Заказы<br>
                30 дней
            </th>

            <th
                rowspan="2"
                class="result-cell"
            >
                Остаток<br>
                сегодня
            </th>

            <th
                rowspan="2"
                class="result-cell"
            >
                Хватит<br>
                на
            </th>

            <th
                rowspan="2"
                class="result-cell"
            >
                Позиция
            </th>

            <th
                rowspan="2"
                class="result-cell"
            >
                Себестоимость
            </th>

        </tr>


        <tr>

            <!-- =================================================
                 СЕГОДНЯ — ФИНАНСОВЫХ КОЛОНОК НЕТ
                 ================================================= -->

            <th class="day-separator day-cell-wide">
                Цена<br>покупателя
            </th>

            <th class="day-cell">
                СПП
            </th>

            <th class="day-cell-wide">
                Цена<br>продавца
            </th>

            <th class="day-cell">
                Показы
            </th>

            <th class="day-cell">
                Клики
            </th>

            <th class="day-cell">
                Корзины
            </th>

            <th class="day-cell">
                CPM
            </th>

            <th class="day-cell-wide">
                Затраты
            </th>

            <th class="day-cell">
                Продажи
            </th>


            <!-- =================================================
                 ВЧЕРА
                 ================================================= -->

            <th class="day-separator day-cell-wide">
                Цена<br>покупателя
            </th>

            <th class="day-cell">
                СПП
            </th>

            <th class="day-cell-wide">
                Цена<br>продавца
            </th>

            <th class="day-cell">
                Показы
            </th>

            <th class="day-cell">
                Клики
            </th>

            <th class="day-cell">
                Корзины
            </th>

            <th class="day-cell">
                CPM
            </th>

            <th class="day-cell-wide">
                Затраты
            </th>

            <th class="day-cell">
                Продажи
            </th>

            <th class="day-cell-wide">
                К перечислению
            </th>

            <th class="day-cell-wide">
                Логистика
            </th>

            <th class="day-cell-wide">
                Хранение
            </th>

            <th class="day-cell-wide">
                Налог
            </th>

            <th class="day-cell-wide">
                Прибыль
            </th>

            <th class="day-cell-wide">
                Рентабельность
            </th>

            <th class="day-cell-wide">
                Маржа
            </th>


            <!-- =================================================
                 ПОЗАВЧЕРА
                 ================================================= -->

            <th class="day-separator day-cell-wide">
                Цена<br>покупателя
            </th>

            <th class="day-cell">
                СПП
            </th>

            <th class="day-cell-wide">
                Цена<br>продавца
            </th>

            <th class="day-cell">
                Показы
            </th>

            <th class="day-cell">
                Клики
            </th>

            <th class="day-cell">
                Корзины
            </th>

            <th class="day-cell">
                CPM
            </th>

            <th class="day-cell-wide">
                Затраты
            </th>

            <th class="day-cell">
                Продажи
            </th>

            <th class="day-cell-wide">
                К перечислению
            </th>

            <th class="day-cell-wide">
                Логистика
            </th>

            <th class="day-cell-wide">
                Хранение
            </th>

            <th class="day-cell-wide">
                Налог
            </th>

            <th class="day-cell-wide">
                Прибыль
            </th>

            <th class="day-cell-wide">
                Рентабельность
            </th>

            <th class="day-cell-wide">
                Маржа
            </th>

        </tr>

    `;


    // ========================================================
    // BODY
    // ========================================================

    let html = '';


    for (
        const product of products
    ) {

        const today =
            product.days[2];

        const yesterday =
            product.days[1];

        const dayBefore =
            product.days[0];


        // ====================================================
        // КЛАССЫ ИЗМЕНЕНИЙ
        // ====================================================

        const buyerTodayClass =
            getChangeClass(
                today.buyerPrice,
                yesterday.buyerPrice,
                'price'
            );

        const buyerYesterdayClass =
            getChangeClass(
                yesterday.buyerPrice,
                dayBefore.buyerPrice,
                'price'
            );

        const sppTodayClass =
            getChangeClass(
                today.spp,
                yesterday.spp,
                'spp'
            );

        const sppYesterdayClass =
            getChangeClass(
                yesterday.spp,
                dayBefore.spp,
                'spp'
            );

        const sellerTodayClass =
            getChangeClass(
                today.sellerPrice,
                yesterday.sellerPrice,
                'price'
            );

        const sellerYesterdayClass =
            getChangeClass(
                yesterday.sellerPrice,
                dayBefore.sellerPrice,
                'price'
            );

        const salesYesterdayClass =

// ============================================================
// ЗАГРУЗКА
// ============================================================
//
// ВАЖНО:
//
// loadingData не позволяет отправить второй запрос,
// пока первый /api/dashboard ещё выполняется.
// ============================================================

// ============================================================
// ЗАЩИТА ОТ ПОВТОРНОЙ ЗАГРУЗКИ
// ============================================================

let loadingData = false;


// ============================================================
// ЗАГРУЗКА ДАННЫХ
//
// ВАЖНО:
// Автоматически НЕ запускается.
// Только после нажатия кнопки.
// ============================================================

async function loadData() {

    if (loadingData) {

        console.log(
            'Загрузка уже выполняется.'
        );

        return;
    }


    loadingData =
        true;


    const button =
        document.getElementById(
            'refreshButton'
        );


    const status =
        document.getElementById(
            'status'
        );


    button.disabled =
        true;


    button.textContent =
        '↻ Обновляем...';


    status.textContent =
        'Обновляем данные WB...';


    document
        .getElementById(
            'tableBody'
        )
        .innerHTML = `

            <tr>

                <td
                    colspan="50"
                    class="loading"
                >

                    Получаем данные из WB...

                    Это может занять
                    несколько минут.

                </td>

            </tr>

        `;


    try {

        const response =
            await fetch(
                '/api/dashboard?ts=' +
                Date.now(),
                {

                    method:
                        'GET',

                    cache:
                        'no-store'

                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                `HTTP ${response.status}`
            );

        }


        window.dashboardData =
            data;

        render(
            data
        );


        const updated =
            new Date(
                data.updatedAt
            );


        status.textContent =
            'Обновлено: ' +
            updated.toLocaleTimeString(
                'ru-RU'
            );


    } catch (error) {

        console.error(
            'LOAD DATA ERROR:',
            error
        );


        status.textContent =
            'Ошибка';


        document
            .getElementById(
                'tableBody'
            )
            .innerHTML = `

                <tr>

                    <td
                        colspan="50"
                        class="error"
                    >

                        ${escapeHtml(
                            error.message
                        )}

                    </td>

                </tr>

            `;


    } finally {

        loadingData =
            false;


        button.disabled =
            false;


        button.textContent =
            '↻ Обновить данные';

    }

}


// ============================================================
// КНОПКА
// ============================================================

document
    .getElementById(
        'refreshButton'
    )
    .addEventListener(
        'click',
        loadData
    );

// ============================================================

    );
