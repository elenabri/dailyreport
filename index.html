<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>WB Dashboard</title>


<style>

/* =========================================================
   BASE
   ========================================================= */

* {
    box-sizing: border-box;
}


html,
body {
    width: 100%;
}


body {

    margin: 0;

    background: #f5f6f8;

    color: #20242b;

    font-family:
        Inter,
        Arial,
        sans-serif;

    font-size: 12px;
}


.container {

    width: 100%;

    max-width: 1900px;

    margin: auto;

    padding:
        12px 14px;
}


/* =========================================================
   HEADER
   ========================================================= */

.header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 9px;
}


.title {

    font-size: 19px;

    font-weight: 700;
}


.subtitle {

    margin-top: 2px;

    color: #858b95;

    font-size: 11px;
}


.header-right {

    display: flex;

    align-items: center;

    gap: 10px;
}


#status {

    color: #858b95;

    font-size: 11px;
}


button {

    border: none;

    border-radius: 8px;

    padding:
        7px
        11px;

    background: #111827;

    color: white;

    font-size: 12px;

    font-weight: 600;

    cursor: pointer;
}


button:hover {

    background: #242b38;
}


button:disabled {

    opacity: .5;

    cursor: wait;
}


/* =========================================================
   TABLE CONTAINER
   ========================================================= */

.table-container {

    width: 100%;

    background: white;

    border:
        1px solid #e5e7eb;

    border-radius: 10px;

    overflow: hidden;

    box-shadow:
        0 2px 7px
        rgba(0,0,0,.03);
}


/* =========================================================
   TABLE
   ========================================================= */

table {

    border-collapse: separate;

    border-spacing: 0;

    width: 100%;

    min-width: 0;

    table-layout: fixed;
}


/* =========================================================
   HEADER CELLS
   ========================================================= */

th {

    position: sticky;

    top: 0;

    z-index: 5;

    background: #fafbfc;

    color: #68707c;

    font-size: 9px;

    font-weight: 700;

    padding:
        4px 2px;

    border-bottom:
        1px solid #e5e7eb;

    white-space: nowrap;

    text-align: right;

    line-height: 1.05;
}


/* =========================================================
   ТОВАР
   ========================================================= */

th.product-header {

    text-align: center;

    width: 235px;

    min-width: 235px;

    max-width: 235px;

    padding:
        4px 6px;
}


/* =========================================================
   ЗАГОЛОВКИ ДНЕЙ
   ========================================================= */

.day-title {

    text-align: center;

    font-size: 10px;

    color: #242932;

    padding:
        4px 2px;
}


.day-date {

    display: block;

    color: #8b919a;

    font-size: 9px;

    font-weight: 400;

    margin-top: 1px;
}


/* =========================================================
   TABLE CELLS
   ========================================================= */

td {

    padding:
        3px 2px;

    border-bottom:
        1px solid #edf0f3;

    white-space: nowrap;

    text-align: right;

    font-size: 10px;

    line-height: 1.1;

    font-variant-numeric:
        tabular-nums;
}


tbody tr:hover td {

    background: #fafcff;
}


/* =========================================================
   PRODUCT
   ========================================================= */

.product-cell {

    width: 235px;

    min-width: 235px;

    max-width: 235px;

    text-align: left;

    white-space: normal;

    overflow: hidden;

    vertical-align: middle;

    padding:
        3px 6px;
}


.product-name {

    font-weight: 600;

    line-height: 1.12;

    overflow: hidden;

    display: -webkit-box;

    -webkit-box-orient: vertical;

    -webkit-line-clamp: 2;

    line-clamp: 2;

    white-space: normal;

    overflow-wrap: anywhere;
}


.product-article {

    color: #858b95;

    font-size: 9px;

    margin-top: 1px;

    line-height: 1.05;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}


/* =========================================================
   РАЗДЕЛИТЕЛЬ ДНЕЙ
   ========================================================= */

.day-separator {

    border-left:
        2px solid #e9ebef !important;
}


/* =========================================================
   ПОДСВЕТКА
   ========================================================= */

.up {

    background: #dff5e6 !important;

    color: #14783b;

    font-weight: 700;
}


.down {

    background: #ffe1e1 !important;

    color: #b42318;

    font-weight: 700;
}


.same {

    color: #505762;
}


/* =========================================================
   OTHER
   ========================================================= */

.stock {

    font-weight: 700;
}


.days-left {

    font-weight: 700;
}


.position {

    font-weight: 700;
}


.empty {

    color: #a3a8b0;
}


.error {

    padding: 25px;

    text-align: center;

    color: #b42318;
}


.loading {

    padding: 25px;

    text-align: center;

    color: #858b95;
}


/* =========================================================
   ЧИСЛОВЫЕ КОЛОНКИ
   ========================================================= */

table th:not(.product-header),
table td:not(.product-cell) {

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (
    max-width: 1100px
) {

    .container {

        padding:
            8px;
    }


    th {

        font-size: 8px;

        padding:
            3px 1px;
    }


    td {

        font-size: 9px;

        padding:
            3px 1px;
    }


    .product-cell,
    th.product-header {

        width: 200px;

        min-width: 200px;

        max-width: 200px;
    }


    .product-name {

        font-size: 11px;
    }


    .product-article {

        font-size: 8px;
    }
}


@media (
    max-width: 800px
) {

    .container {

        padding:
            6px;
    }


    .header {

        align-items: flex-start;

        flex-direction: column;

        gap: 7px;
    }


    .header-right {

        width: 100%;

        justify-content:
            space-between;
    }


    /*
       На маленьком экране
       горизонтальный скролл разрешаем,
       иначе таблица станет нечитаемой.
    */

    .table-container {

        overflow-x: auto;
    }


    table {

        min-width: 1150px;
    }


    .product-cell,
    th.product-header {

        width: 190px;

        min-width: 190px;

        max-width: 190px;
    }
}

</style>

</head>


<body>


<div class="container">


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <div class="header">

        <div>

            <div class="title">
                Wildberries · товары
            </div>

            <div
                class="subtitle"
                id="period"
            >
                Загрузка...
            </div>

        </div>


        <div class="header-right">

            <div id="status">
            </div>

            <button
                id="refreshButton"
            >
                ↻ Обновить данные
            </button>

        </div>

    </div>


    <!-- =====================================================
         TABLE
         ===================================================== -->

    <div class="table-container">

        <table>

            <thead id="tableHead">
            </thead>

            <tbody id="tableBody">

                <tr>

                    <td
                        colspan="17"
                        class="loading"
                    >
                        Загрузка данных WB...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>


</div>



<script>


// ============================================================
// HELPERS
// ============================================================

function escapeHtml(value) {

    return String(value ?? '')
        .replace(
            /[&<>"']/g,
            char => ({

                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'

            }[char])
        );
}


// ============================================================
// ЧИСЛА
// ============================================================

function formatNumber(
    value,
    digits = 0
) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(
            Number(value)
        )
    ) {

        return '<span class="empty">—</span>';
    }


    return Number(value)
        .toLocaleString(
            'ru-RU',
            {
                maximumFractionDigits:
                    digits
            }
        );
}


// ============================================================
// ДЕНЬГИ
// ============================================================

function formatMoney(value) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(
            Number(value)
        )
    ) {

        return '<span class="empty">—</span>';
    }


    return (
        Number(value)
            .toLocaleString(
                'ru-RU',
                {
                    maximumFractionDigits: 0
                }
            )
        + ' ₽'
    );
}


// ============================================================
// ПРОЦЕНТ
// ============================================================

function formatPercent(value) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(
            Number(value)
        )
    ) {

        return '<span class="empty">—</span>';
    }


    return (
        Number(value)
            .toLocaleString(
                'ru-RU',
                {
                    maximumFractionDigits: 1
                }
            )
        + '%'
    );
}


// ============================================================
// ДАТА
// ============================================================

function formatDate(date) {

    if (!date) {

        return '';
    }


    const parts =
        String(date).split('-');


    if (parts.length !== 3) {

        return String(date);
    }


    const year =
        parts[0];

    const month =
        parts[1];

    const day =
        parts[2];


    return `${day}.${month}`;
}


// ============================================================
// ЗАКАЗЫ ЗА 3 ДНЯ
// ============================================================

function getSales3(product) {

    const days =
        product.days || [];


    return days.reduce(
        (
            sum,
            day
        ) => {

            return sum +
                Number(
                    day?.sales || 0
                );

        },
        0
    );
}


// ============================================================
// ФИЛЬТР ТОВАРА
//
// Показываем:
//
// остаток > 0
//
// ИЛИ
//
// были заказы хотя бы в один
// из последних 3 дней.
// ============================================================

function shouldShowProduct(product) {

    const stock =
        Number(
            product.stockToday || 0
        );


    const sales3 =
        getSales3(product);


    return (
        stock > 0 ||
        sales3 > 0
    );
}


// ============================================================
// КЛАСС ИЗМЕНЕНИЯ
//
// price:
//
// уменьшение = зелёный
// увеличение = красный
//
// spp:
//
// увеличение = зелёный
// уменьшение = красный
//
// sales:
//
// увеличение = зелёный
// уменьшение = красный
// ============================================================

function getChangeClass(
    current,
    previous,
    type
) {

    if (
        current === null ||
        previous === null ||
        current === undefined ||
        previous === undefined
    ) {

        return '';
    }


    const currentNumber =
        Number(current);


    const previousNumber =
        Number(previous);


    if (
        !Number.isFinite(currentNumber) ||
        !Number.isFinite(previousNumber)
    ) {

        return '';
    }


    if (
        currentNumber === previousNumber
    ) {

        return 'same';
    }


    if (
        type === 'price'
    ) {

        if (
            currentNumber < previousNumber
        ) {

            return 'up';
        }


        return 'down';
    }


    if (
        type === 'spp'
    ) {

        if (
            currentNumber > previousNumber
        ) {

            return 'up';
        }


        return 'down';
    }


    if (
        type === 'sales'
    ) {

        if (
            currentNumber > previousNumber
        ) {

            return 'up';
        }


        return 'down';
    }


    return '';
}


// ============================================================
// RENDER
// ============================================================

function render(data) {


    // ========================================================
    // ПОЛУЧАЕМ ТОВАРЫ
    // ========================================================

    let products =
        data.products || [];


    // ========================================================
    // ФИЛЬТР
    //
    // Остаток > 0
    //
    // ИЛИ
    //
    // заказы за 3 дня > 0
    // ========================================================

    products =
        products.filter(
            product =>
                shouldShowProduct(
                    product
                )
        );


    // ========================================================
    // СОРТИРОВКА
    //
    // ПО ВОЗРАСТАНИЮ
    //
    // Сумма заказов:
    //
    // позавчера +
    // вчера +
    // сегодня
    // ========================================================

    products.sort(
        (
            a,
            b
        ) => {

            const salesA =
                getSales3(a);


            const salesB =
                getSales3(b);


            return (
                salesA -
                salesB
            );
        }
    );


    // ========================================================
    // ПЕРИОД
    // ========================================================

    document
        .getElementById('period')
        .textContent =

        `Заказы: ${
            formatDate(
                data.period.from
            )
        } — ${
            formatDate(
                data.period.to
            )
        } · товаров: ${
            products.length
        }`;


    // ========================================================
    // НЕТ ТОВАРОВ
    // ========================================================

    if (
        !products.length
    ) {

        document
            .getElementById('tableHead')
            .innerHTML = '';


        document
            .getElementById('tableBody')
            .innerHTML = `

                <tr>

                    <td
                        colspan="17"
                        class="error"
                    >

                        Нет товаров с остатком
                        или заказами за последние 3 дня.

                    </td>

                </tr>

            `;

        return;
    }


    // ========================================================
    // ДНИ
    //
    // days[0] = позавчера
    // days[1] = вчера
    // days[2] = сегодня
    // ========================================================

    const firstProduct =
        products[0];


    const today =
        firstProduct.days[2];


    const yesterday =
        firstProduct.days[1];


    const dayBefore =
        firstProduct.days[0];


    // ========================================================
    // HEADER
    // ========================================================

    document
        .getElementById('tableHead')
        .innerHTML = `

        <tr>

            <!-- ТОВАР -->

            <th
                rowspan="2"
                class="product-header"
            >
                Товар
            </th>


            <!-- СЕГОДНЯ -->

            <th
                colspan="4"
                class="day-title day-separator"
            >

                Сегодня

                <span class="day-date">
                    ${formatDate(
                        today.date
                    )}
                </span>

            </th>


            <!-- ВЧЕРА -->

            <th
                colspan="4"
                class="day-title day-separator"
            >

                Вчера

                <span class="day-date">
                    ${formatDate(
                        yesterday.date
                    )}
                </span>

            </th>


            <!-- ПОЗАВЧЕРА -->

            <th
                colspan="4"
                class="day-title day-separator"
            >

                Позавчера

                <span class="day-date">
                    ${formatDate(
                        dayBefore.date
                    )}
                </span>

            </th>


            <!-- ЗАКАЗЫ 30 ДНЕЙ -->

            <th
                rowspan="2"
                class="day-separator"
            >

                Заказы<br>
                30 дней

            </th>


            <!-- ОСТАТОК -->

            <th
                rowspan="2"
            >

                Остаток<br>
                сегодня

            </th>


            <!-- ХВАТИТ НА -->

            <th
                rowspan="2"
            >

                Хватит<br>
                на

            </th>


            <!-- ПОЗИЦИЯ -->

            <th
                rowspan="2"
            >

                Позиция

            </th>

        </tr>


        <tr>

            <!-- =================================================
                 СЕГОДНЯ
                 ================================================= -->

            <th
                class="day-separator"
            >

                Цена<br>
                покуп.

            </th>


            <th>

                СПП

            </th>


            <th>

                Цена<br>
                продав.

            </th>


            <th>

                Продажи

            </th>


            <!-- =================================================
                 ВЧЕРА
                 ================================================= -->

            <th
                class="day-separator"
            >

                Цена<br>
                покуп.

            </th>


            <th>

                СПП

            </th>


            <th>

                Цена<br>
                продав.

            </th>


            <th>

                Продажи

            </th>


            <!-- =================================================
                 ПОЗАВЧЕРА
                 ================================================= -->

            <th
                class="day-separator"
            >

                Цена<br>
                покуп.

            </th>


            <th>

                СПП

            </th>


            <th>

                Цена<br>
                продав.

            </th>


            <th>

                Продажи

            </th>

        </tr>

    `;


    // ========================================================
    // BODY
    // ========================================================

    let html = '';


    for (
        const product of products
    ) {


        // ====================================================
        // ДНИ
        // ====================================================

        const today =
            product.days[2];


        const yesterday =
            product.days[1];


        const dayBefore =
            product.days[0];


        // ====================================================
        // ЦЕНА ПОКУПАТЕЛЯ
        // ====================================================

        const buyerTodayClass =
            getChangeClass(
                today.buyerPrice,
                yesterday.buyerPrice,
                'price'
            );


        const buyerYesterdayClass =
            getChangeClass(
                yesterday.buyerPrice,
                dayBefore.buyerPrice,
                'price'
            );


        // ====================================================
        // СПП
        // ====================================================

        const sppTodayClass =
            getChangeClass(
                today.spp,
                yesterday.spp,
                'spp'
            );


        const sppYesterdayClass =
            getChangeClass(
                yesterday.spp,
                dayBefore.spp,
                'spp'
            );


        // ====================================================
        // ЦЕНА ПРОДАВЦА
        // ====================================================

        const sellerTodayClass =
            getChangeClass(
                today.sellerPrice,
                yesterday.sellerPrice,
                'price'
            );


        const sellerYesterdayClass =
            getChangeClass(
                yesterday.sellerPrice,
                dayBefore.sellerPrice,
                'price'
            );


        // ====================================================
        // ПРОДАЖИ
        //
        // Вчера сравниваем с позавчера.
        //
        // Сегодня не подсвечиваем.
        // ====================================================

        const salesYesterdayClass =
            getChangeClass(
                yesterday.sales,
                dayBefore.sales,
                'sales'
            );


        // ====================================================
        // HTML
        // ====================================================

        html += `

        <tr>


            <!-- =============================================
                 ТОВАР
                 ============================================= -->

            <td
                class="product-cell"
                title="${escapeHtml(
                    product.name || ''
                )}"
            >

                <div class="product-name">

                    ${escapeHtml(
                        product.name ||
                        'Без названия'
                    )}

                </div>


                <div class="product-article">

                    ${escapeHtml(
                        product.article ||
                        ''
                    )}

                    · nmId ${
                        product.nmId
                    }

                </div>

            </td>


            <!-- =============================================
                 СЕГОДНЯ
                 ============================================= -->


            <!-- Цена покупателя -->

            <td
                class="day-separator ${
                    buyerTodayClass
                }"
            >

                ${formatMoney(
                    today.buyerPrice
                )}

            </td>


            <!-- СПП -->

            <td
                class="${
                    sppTodayClass
                }"
            >

                ${formatPercent(
                    today.spp
                )}

            </td>


            <!-- Цена продавца -->

            <td
                class="${
                    sellerTodayClass
                }"
            >

                ${formatMoney(
                    today.sellerPrice
                )}

            </td>


            <!-- Продажи -->

            <td>

                ${formatNumber(
                    today.sales
                )}

            </td>


            <!-- =============================================
                 ВЧЕРА
                 ============================================= -->


            <!-- Цена покупателя -->

            <td
                class="day-separator ${
                    buyerYesterdayClass
                }"
            >

                ${formatMoney(
                    yesterday.buyerPrice
                )}

            </td>


            <!-- СПП -->

            <td
                class="${
                    sppYesterdayClass
                }"
            >

                ${formatPercent(
                    yesterday.spp
                )}

            </td>


            <!-- Цена продавца -->

            <td
                class="${
                    sellerYesterdayClass
                }"
            >

                ${formatMoney(
                    yesterday.sellerPrice
                )}

            </td>


            <!-- Продажи -->

            <td
                class="${
                    salesYesterdayClass
                }"
            >

                ${formatNumber(
                    yesterday.sales
                )}

            </td>


            <!-- =============================================
                 ПОЗАВЧЕРА
                 ============================================= -->


            <!-- Цена покупателя -->

            <td
                class="day-separator"
            >

                ${formatMoney(
                    dayBefore.buyerPrice
                )}

            </td>


            <!-- СПП -->

            <td>

                ${formatPercent(
                    dayBefore.spp
                )}

            </td>


            <!-- Цена продавца -->

            <td>

                ${formatMoney(
                    dayBefore.sellerPrice
                )}

            </td>


            <!-- Продажи -->

            <td>

                ${formatNumber(
                    dayBefore.sales
                )}

            </td>


            <!-- =============================================
                 ЗАКАЗЫ 30 ДНЕЙ
                 ============================================= -->

            <td
                class="day-separator"
            >

                ${formatNumber(
                    product.orders30
                )}

            </td>


            <!-- =============================================
                 ОСТАТОК
                 ============================================= -->

            <td
                class="stock"
            >

                ${formatNumber(
                    product.stockToday
                )}

            </td>


            <!-- =============================================
                 ХВАТИТ НА
                 ============================================= -->

            <td
                class="days-left"
            >

                ${
                    product.daysLeft === null

                    ? '<span class="empty">∞</span>'

                    : formatNumber(
                        product.daysLeft,
                        1
                    ) + ' дн.'
                }

            </td>


            <!-- =============================================
                 ПОЗИЦИЯ
                 ============================================= -->

            <td
                class="position"
            >

                ${formatNumber(
                    product.positionToday,
                    1
                )}

            </td>


        </tr>

        `;
    }


    // ========================================================
    // ВЫВОД
    // ========================================================

    document
        .getElementById('tableBody')
        .innerHTML = html;
}


// ============================================================
// ЗАГРУЗКА
// ============================================================

async function loadData() {

    const button =
        document.getElementById(
            'refreshButton'
        );


    const status =
        document.getElementById(
            'status'
        );


    button.disabled = true;


    status.textContent =
        'Обновляем данные WB...';


    document
        .getElementById('tableBody')
        .innerHTML = `

            <tr>

                <td
                    colspan="17"
                    class="loading"
                >

                    Получаем данные из WB...

                    Это может занять
                    несколько минут.

                </td>

            </tr>

        `;


    try {

        const response =
            await fetch(
                '/api/dashboard?ts=' +
                Date.now()
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                `HTTP ${response.status}`
            );
        }


        render(data);


        const updated =
            new Date(
                data.updatedAt
            );


        status.textContent =
            'Обновлено: ' +
            updated.toLocaleTimeString(
                'ru-RU'
            );


    } catch (error) {

        console.error(error);


        status.textContent =
            'Ошибка';


        document
            .getElementById('tableBody')
            .innerHTML = `

                <tr>

                    <td
                        colspan="17"
                        class="error"
                    >

                        ${escapeHtml(
                            error.message
                        )}

                    </td>

                </tr>

            `;

    } finally {

        button.disabled = false;
    }
}


// ============================================================
// КНОПКА
// ============================================================

document
    .getElementById(
        'refreshButton'
    )
    .addEventListener(
        'click',
        loadData
    );


// ============================================================
// ПЕРВАЯ ЗАГРУЗКА
// ============================================================

loadData();


</script>

</body>

</html>
