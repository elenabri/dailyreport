/* =========================================================
   BASE
   ========================================================= */

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    background: #f5f6f8;

    color: #20242b;

    font-family:
        Inter,
        Arial,
        sans-serif;

    font-size: 13px;
}


.container {

    max-width: 1900px;

    margin: auto;

    padding: 18px 22px;
}


/* =========================================================
   HEADER
   ========================================================= */

.header {

    display: flex;

    justify-content:
        space-between;

    align-items:
        center;

    margin-bottom:
        14px;
}


.title {

    font-size:
        21px;

    font-weight:
        700;
}


.subtitle {

    margin-top:
        3px;

    color:
        #858b95;

    font-size:
        12px;
}


.header-right {

    display: flex;

    align-items:
        center;

    gap:
        12px;
}


#status {

    color:
        #858b95;

    font-size:
        12px;
}


button {

    border:
        none;

    border-radius:
        9px;

    padding:
        9px 14px;

    background:
        #111827;

    color:
        white;

    font-size:
        13px;

    font-weight:
        600;

    cursor:
        pointer;
}


button:hover {

    background:
        #242b38;
}


button:disabled {

    opacity:
        .5;

    cursor:
        wait;
}

}

.down {

thead tr:nth-child(2) th:nth-child(11),

thead tr:nth-child(2) th:nth-child(13),
thead tr:nth-child(2) th:nth-child(14),

thead tr:nth-child(2) th:nth-child(20),

thead tr:nth-child(2) th:nth-child(23),
thead tr:nth-child(2) th:nth-child(24),
thead tr:nth-child(2) th:nth-child(25),

/* =========================================================
   ПОДГОН ПОД РАЗМЕР ЭКРАНА
   ========================================================= */

@media (min-width: 1600px) {
    table {
        zoom: 0.92;
        width: 108.7%;
    }
}

@media (min-width: 1900px) {
    table {
        zoom: 1;
        width: 100%;
    }
}

@media (max-width: 1599px) {
    table {
        zoom: 0.82;

    }
}

@media (max-width: 1100px) {

        zoom: 0.68;
        width: 147.06%;

        width: 240px;
    }

.big-load-button {

    padding: 18px 34px;
    border-radius: 16px;
    font-size: 22px;
    font-weight: 700;

    box-shadow: 0 10px 28px rgba(17, 24, 39, .14);
    transition: transform .15s ease, box-shadow .15s ease;

}

.big-load-button:disabled {
    transform: none;

/* =========================================================
   ОКНО ЗАГРУЗКИ
   ========================================================= */

.loading-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(20, 24, 31, .38);
    backdrop-filter: blur(5px);
}

.loading-overlay.visible {
    display: flex;
}

.loading-modal {
    width: min(460px, calc(100vw - 34px));
    padding: 30px 30px 28px;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 24px 80px rgba(0, 0, 0, .24);
}

.modal-spinner {
    width: 48px;
    height: 48px;
    margin: 0 auto 17px;
    border: 4px solid #e6e9ee;
    border-top-color: #111827;
    border-radius: 50%;
    animation: dashboardSpin .85s linear infinite;
}

@keyframes dashboardSpin {
    to {
        transform: rotate(360deg);
    }
}

.loading-title {
    text-align: center;
    font-size: 21px;
    font-weight: 700;
}

.loading-subtitle {
    margin-top: 6px;
    margin-bottom: 22px;
    text-align: center;
    color: #838a95;
    font-size: 12px;
}

.operation-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.operation {
    display: flex;
    align-items: center;
    gap: 11px;
    min-height: 34px;
    padding: 6px 9px;
    border-radius: 9px;
    color: #7d8591;
    font-size: 12px;
    font-weight: 600;
}

.operation-mark {
    width: 21px;
    height: 21px;
    flex: 0 0 21px;
    border: 2px solid #cdd2da;
    border-radius: 50%;
    background: #fff;
}

.operation.active {
    color: #20242b;
    background: #f6f7f9;
}

.operation.active .operation-mark {
    border-color: #6b7280;
}

.operation.done {
    color: #1f2937;
}

.operation.done .operation-mark {
    position: relative;
    border-color: #22c55e;
    background: #22c55e;
}

.operation.done .operation-mark::after {
    content: '✓';
    position: absolute;
    left: 3px;
    top: -1px;
    color: #fff;
    font-size: 15px;
    font-weight: 800;
}

    .big-load-button {
        min-width: 240px;
        min-height: 66px;
        font-size: 19px;
    }
}

<script>


// ============================================================
// HELPERS
// ============================================================

function escapeHtml(value) {

    return String(
        value ?? ''
    )

        .replace(
            /[&<>"']/g,
            char => ({

                '&':
                    '&amp;',

                '<':
                    '&lt;',

                '>':
                    '&gt;',

                '"':
                    '&quot;',

                "'":
                    '&#039;'

            }[char])
        );

}


// ============================================================
// ЧИСЛА
// ============================================================

function formatNumber(
    value,
    digits = 0
) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(
            Number(value)
        )
    ) {

        return `
            <span class="empty">
                —
            </span>
        `;

    }


    return Number(
        value
    )

        .toLocaleString(
            'ru-RU',
            {

                maximumFractionDigits:
                    digits

            }
        );

}


// ============================================================
// ДЕНЬГИ
// ============================================================

function formatMoney(value) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(
            Number(value)
        )
    ) {

        return `
            <span class="empty">
                —
            </span>
        `;

    }


    return (

        Number(value)

            .toLocaleString(
                'ru-RU',
                {

                    maximumFractionDigits:
                        0

                }
            )

        + ' ₽'

    );

}


// ============================================================
// ДЕНЬГИ РЕКЛАМЫ
// ============================================================

function formatAdMoney(value) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(
            Number(value)
        )
    ) {

        return `
            <span class="empty">
                —
            </span>
        `;

    }


    return (

        Number(value)

            .toLocaleString(
                'ru-RU',
                {

                    minimumFractionDigits:
                        2,

                    maximumFractionDigits:
                        2

                }
            )

        + ' ₽'

    );

}


// ============================================================
// ПРОЦЕНТ
// ============================================================

function formatPercent(value) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(
            Number(value)
        )
    ) {

        return `
            <span class="empty">
                —
            </span>
        `;

    }


    return (

        Number(value)

            .toLocaleString(
                'ru-RU',
                {

                    maximumFractionDigits:
                        1

                }
            )

        + '%'

    );

}


// ============================================================
// ДАТА
// ============================================================

function formatDate(date) {

    if (!date) {

        return '';

    }


    const parts =
        String(date).split('-');


    if (
        parts.length !== 3
    ) {

        return String(date);

    }


    return `${
        parts[2]
    }.${
        parts[1]
    }`;

}


// ============================================================
// КЛАСС ИЗМЕНЕНИЯ
// ============================================================

function getChangeClass(
    current,
    previous,
    type
) {

    if (
        current === null ||
        previous === null ||
        current === undefined ||
        previous === undefined
    ) {

        return '';

    }


    const currentNumber =
        Number(current);


    const previousNumber =
        Number(previous);


    if (
        !Number.isFinite(
            currentNumber
        ) ||
        !Number.isFinite(
            previousNumber
        )
    ) {

        return '';

    }


    if (
        currentNumber ===
        previousNumber
    ) {

        return 'same';

    }


    if (
        type === 'price'
    ) {

        return currentNumber <
            previousNumber
            ? 'up'
            : 'down';

    }


    if (
        type === 'spp'
    ) {

        return currentNumber >
            previousNumber
            ? 'up'
            : 'down';

    }


    if (
        type === 'sales'
    ) {

        return currentNumber >
            previousNumber
            ? 'up'
            : 'down';

    }


    // ========================================================
    // РЕНТАБЕЛЬНОСТЬ / МАРЖА
    //
    // Рост  -> зелёный
    // Падение -> красный
    // ========================================================

    if (
        type === 'profitability' ||
        type === 'margin'
    ) {

        return currentNumber >
            previousNumber
            ? 'up'
            : 'down';

    }


    return '';

}


// ============================================================
// RENDER
// ============================================================

function render(data) {

    // ========================================================
    // ВСЕ ТОВАРЫ
    // ========================================================

    const allProducts =
        Array.isArray(data?.products)
            ? data.products
            : [];


    // ========================================================
    // ФИЛЬТР ТОВАРОВ
    // ========================================================

    const filterText =
        String(
            document.getElementById(
                'productFilter'
            )?.value || ''
        )
            .trim()
            .toLowerCase();


    const hideZeroSales =
        document.getElementById(
            'hideZeroSales'
        )?.checked !== false;


    // ========================================================
    // КОЛИЧЕСТВО ДНЕЙ
    // 1–7, по умолчанию 3
    // ========================================================

    let daysCount = Number(
        document.getElementById(
            'daysCount'
        )?.value || 3
    );


    if (
        !Number.isFinite(daysCount) ||
        daysCount < 1
    ) {
        daysCount = 3;
    }

    daysCount = Math.min(
        7,
        Math.max(1, daysCount)
    );


    // ========================================================
    // СНАЧАЛА ФИЛЬТРУЕМ ТОВАРЫ
    // ========================================================

    let products =
        allProducts.filter(
            product => {

                const days =
                    Array.isArray(product.days)
                        ? product.days
                        : [];


                const visibleDays =
                    days.slice(-daysCount);


                // --------------------------------------------
                // НУЛЕВЫЕ ПРОДАЖИ
                // --------------------------------------------

                if (
                    hideZeroSales
                ) {

                    const orders =
                        visibleDays.reduce(
                            (
                                sum,
                                day
                            ) =>
                                sum +
                                Number(
                                    day?.allOrders ??
                                    day?.orders ??
                                    0
                                ),
                            0
                        );


                    if (
                        orders <= 0
                    ) {

                        return false;
                    }
                }


                // --------------------------------------------
                // ПОИСК
                // --------------------------------------------

                if (
                    filterText
                ) {

                    const name =
                        String(
                            product.name ||
                            ''
                        )
                            .toLowerCase();


                    const article =
                        String(
                            product.article ||
                            ''
                        )
                            .toLowerCase();


                    const nmId =
                        String(
                            product.nmId ||
                            ''
                        )
                            .toLowerCase();


                    if (
                        !name.includes(filterText) &&
                        !article.includes(filterText) &&
                        !nmId.includes(filterText)
                    ) {

                        return false;
                    }
                }


                return true;
            }
        );


    // ========================================================
    // СОРТИРОВКА ПО ЗАКАЗАМ ЗА ВЫБРАННОЕ ЧИСЛО ДНЕЙ
    // ПО ВОЗРАСТАНИЮ
    // ========================================================

    products.sort(
        (
            a,
            b
        ) => {

            const aSales =
                (Array.isArray(a.days)
                    ? a.days
                    : []
                )
                    .slice(-daysCount)
                    .reduce(
                        (
                            sum,
                            day
                        ) =>
                            sum +
                            Number(
                                day?.sales ||
                                0
                            ),
                        0
                    );


            const bSales =
                (Array.isArray(b.days)
                    ? b.days
                    : []
                )
                    .slice(-daysCount)
                    .reduce(
                        (
                            sum,
                            day
                        ) =>
                            sum +
                            Number(
                                day?.sales ||
                                0
                            ),
                        0
                    );


            if (
                aSales !== bSales
            ) {

                return aSales - bSales;
            }


            return Number(a.nmId || 0) -
                   Number(b.nmId || 0);
        }
    );


    // ========================================================
    // ПЕРИОД
    // ========================================================

    document
        .getElementById('period')
        .textContent =
            `Заказы: ${
                formatDate(
                    data?.period?.from
                )
            } — ${
                formatDate(
                    data?.period?.to
                )
            } · товаров: ${
                products.length
            }`;


    // ========================================================
    // НЕТ ТОВАРОВ
    // ========================================================

    if (
        !products.length
    ) {

        document
            .getElementById('tableHead')
            .innerHTML = '';


        document
            .getElementById('tableBody')
            .innerHTML = `

                <tr>

                    <td
                        colspan="50"
                        class="error"
                    >

                        ${
                            filterText
                                ? 'Товары не найдены.'
                                : hideZeroSales
                                    ? `За выбранные ${daysCount} ${daysCount === 1 ? 'день' : daysCount < 5 ? 'дня' : 'дней'} продаж нет.`
                                    : 'Товары отсутствуют.'
                        }

                    </td>

                </tr>

            `;

        return;
    }


    // ========================================================
    // СОСТОЯНИЕ КОЛОНОК
    // ========================================================

    const columnState = {};


    document
        .querySelectorAll(
            '.column-chooser input[data-column]'
        )
        .forEach(
            checkbox => {

                columnState[
                    checkbox.dataset.column
                ] = checkbox.checked;

            }
        );


    // ========================================================
    // КОЛОНКИ
    // ========================================================

    const operationalColumns = [

        {
            key: 'buyerPrice',
            title: 'Цена<br>покупателя',
            className: 'day-col-wide',
            group: 'base'
        },

        {
            key: 'spp',
            title: 'СПП',
            className: 'day-col',
            group: 'base'
        },

        {
            key: 'sellerPrice',
            title: 'Цена<br>продавца',
            className: 'day-col-wide',
            group: 'base'
        },

        {
            key: 'allOrders',
            title: 'Все<br>заказы',
            className: 'day-col',
            group: 'base'
        },

        {
            key: 'sales',
            title: 'Продажи',
            className: 'day-col',
            group: 'base'
        },

        {
            key: 'adViews',
            title: 'Показы',
            className: 'day-col promotion-col',
            group: 'promotion'
        },

        {
            key: 'adClicks',
            title: 'Клики',
            className: 'day-col promotion-col',
            group: 'promotion'
        },

        {
            key: 'adCarts',
            title: 'Корзины',
            className: 'day-col promotion-col',
            group: 'promotion'
        },

        {
            key: 'adCpm',
            title: 'CPM',
            className: 'day-col promotion-col',
            group: 'promotion'
        },

        {
            key: 'adSpend',
            title: 'Затраты',
            className: 'day-col-wide promotion-col',
            group: 'promotion'
        },

        {
            key: 'adOrders',
            title: 'Заказы',
            className: 'day-col promotion-col',
            group: 'promotion'
        },

        {
            key: 'adOrdersAmount',
            title: 'Сумма<br>заказов',
            className: 'day-col-wide promotion-col',
            group: 'promotion'
        }

    ];


    const financialColumns = [

        {
            key: 'retailSales',
            title: 'Оборот',
            className: 'day-col-wide',
            group: 'finance'
        },

        {
            key: 'forPay',
            title: 'К<br>перечислению',
            className: 'day-col-wide',
            group: 'finance'
        },

        {
            key: 'logistics',
            title: 'Логистика',
            className: 'day-col-wide',
            group: 'finance'
        },

        {
            key: 'storage',
            title: 'Хранение',
            className: 'day-col-wide',
            group: 'finance'
        },

        {
            key: 'tax',
            title: 'Налог',
            className: 'day-col-wide',
            group: 'finance'
        },

        {
            key: 'profit',
            title: 'Прибыль',
            className: 'day-col-wide',
            group: 'finance'
        },

        {
            key: 'profitability',
            title: 'Рентабельность',
            className: 'day-col-wide',
            group: 'finance'
        },

        {
            key: 'margin',
            title: 'Маржа',
            className: 'day-col-wide',
            group: 'finance'
        }

    ];


    const selectedOperationalColumns =
        operationalColumns.filter(
            column =>
                columnState[column.key]
        );


    const selectedFinancialColumns =
        financialColumns.filter(
            column =>
                columnState[column.key]
        );


    // Сегодня колонка «Продажи» полностью скрыта.
    // В остальные дни «Продажи» остаются.
    const todayColumns =
        selectedOperationalColumns.filter(
            column =>
                column.key !== 'sales'
        );


    const historicalColumns =
        selectedOperationalColumns.concat(
            selectedFinancialColumns
        );


    // ========================================================
    // ДНИ
    // ========================================================

    const sampleDays =
        Array.isArray(
            products[0]?.days
        )
            ? products[0].days
            : [];


    const visibleDateValues =
        sampleDays.slice(-daysCount).reverse();


    // ========================================================
    // НАЗВАНИЯ ДНЕЙ
    // ========================================================

    function getDayTitle(
        visibleIndex,
        total
    ) {

        if (
            visibleIndex === 0
        ) {
            return 'Сегодня';
        }


        if (
            visibleIndex === 1
        ) {
            return 'Вчера';
        }


        if (
            visibleIndex === 2
        ) {
            return 'Позавчера';
        }


        return 'День';
    }


    function renderDayTitle(
        day,
        index,
        total,
        columns
    ) {

        return `

            <th
                colspan="${columns.length}"
                class="day-title day-separator day-group-cell"
            >

                ${getDayTitle(
                    index,
                    total
                )}

                <span class="day-date">

                    ${formatDate(
                        day.date
                    )}

                </span>

            </th>

        `;
    }


    function renderColumnsHeader(
        columns
    ) {

        return columns
            .map(
                (
                    column,
                    index
                ) => {

                    const firstClass =
                        index === 0
                            ? 'day-separator '
                            : '';

                    const lastClass =
                        index === columns.length - 1
                            ? 'day-end '
                            : '';

                    return `

                        <th
                            class="${firstClass}${lastClass}${column.className || ''}"
                        >

                            ${column.title}

                        </th>

                    `;
                }
            )
            .join('');
    }


    function renderGroupHeader(
        columns
    ) {

        if (!columns.length) {
            return '';
        }

        const groups = [];

        let currentGroup = null;
        let count = 0;

        for (const column of columns) {

            if (column.group !== currentGroup) {

                if (currentGroup !== null) {
                    groups.push({
                        key: currentGroup,
                        count
                    });
                }

                currentGroup = column.group;
                count = 1;

            } else {
                count++;
            }
        }

        if (currentGroup !== null) {
            groups.push({
                key: currentGroup,
                count
            });
        }

        const titles = {
            base: 'Основные',
            promotion: 'Продвижение',
            finance: 'Финансы'
        };

        return groups
            .map(
                (group, index) => {

                    const separator =
                        index === 0
                            ? 'day-separator '
                            : '';

                    const endSeparator =
                        index === groups.length - 1
                            ? 'day-end '
                            : '';

                    const promotion =
                        group.key === 'promotion'
                            ? 'promotion-group-title'
                            : '';

                    return `
                        <th
                            colspan="${group.count}"
                            class="${separator}${endSeparator}${promotion} day-group-cell"
                        >
                            ${titles[group.key] || group.key}
                        </th>
                    `;
                }
            )
            .join('');
    }


    // ========================================================
    // HEADER
    // ========================================================

    // В шапке 3 строки:
    // 1) День
    // 2) Группа показателей
    // 3) Конкретные столбцы
    //
    // Поэтому Товар и итоговые колонки имеют rowspan="3".

    let headerDays = `

        <tr>

            <th
                rowspan="3"
                class="product-header"
            >
                Товар
            </th>
    `;


    let headerGroups = `
        <tr>
    `;


    let headerColumns = `
        <tr>
    `;


    visibleDateValues.forEach(
        (
            day,
            index
        ) => {

            const isToday =
                index === 0;


            const columns =
                isToday
                    ? todayColumns
                    : historicalColumns;


            if (
                !columns.length
            ) {
                return;
            }


            // -----------------------------------------------
            // СТРОКА ДНЕЙ
            // -----------------------------------------------

            headerDays += `

                <th
                    colspan="${columns.length}"
                    class="day-title day-separator"
                >

                    ${getDayTitle(
                        index,
                        visibleDateValues.length
                    )}

                    <span class="day-date">

                        ${formatDate(
                            day.date
                        )}

                    </span>

                </th>

            `;


            // -----------------------------------------------
            // СТРОКА ГРУПП
            // -----------------------------------------------

            headerGroups +=
                renderGroupHeader(
                    columns
                );


            // -----------------------------------------------
            // СТРОКА КОЛОНОК
            // -----------------------------------------------

            headerColumns +=
                renderColumnsHeader(
                    columns
                );

        }
    );


    // ========================================================
    // ИТОГОВЫЕ КОЛОНКИ
    //
    // Они должны быть в ПЕРВОЙ строке и иметь rowspan="3",
    // чтобы не создавать сдвиг между заголовком и значениями.
    // ========================================================

    headerDays += `

            <th
                rowspan="3"
                class="day-separator result-col"
            >
                Все заказы<br>30 дней
            </th>

            <th
                rowspan="3"
                class="result-col"
            >
                Средние заказы<br>за 7 дней
            </th>

            <th
                rowspan="3"
                class="result-col"
            >
                Остаток<br>сегодня
            </th>

            <th
                rowspan="3"
                class="result-col"
            >
                Хватит<br>на
            </th>

            <th
                rowspan="3"
                class="result-col"
            >
                Позиция
            </th>

        </tr>
    `;


    headerGroups += `

        <th
            colspan="2"
            class="moysklad-group-title day-group-cell result-col"
        >
            МойСклад
        </th>

        </tr>
    `;


    headerColumns += `

        <th
            class="result-col"
        >
            Себестоимость
        </th>

        <th
            class="result-col"
        >
            Основной склад
        </th>

        </tr>
    `;


    document
        .getElementById('tableHead')
        .innerHTML =
            headerDays +
            headerGroups +
            headerColumns;


    // ========================================================
    // РЕНДЕР ЗНАЧЕНИЯ КОЛОНКИ
    // ========================================================

    function renderColumnValue(
        column,
        day,
        financial,
        changeClasses,
        isFirst,
        isLast,
        isToday
    ) {

        let value = '';
        let extraClass = '';


        switch (
            column.key
        ) {

            case 'buyerPrice':

                value =
                    formatMoney(
                        day.buyerPrice
                    );

                extraClass =
                    changeClasses.buyer ||
                    '';

                break;


            case 'spp':

                value =
                    formatPercent(
                        day.spp
                    );

                extraClass =
                    changeClasses.spp ||
                    '';

                break;


            case 'sellerPrice':

                value =
                    formatMoney(
                        day.sellerPrice
                    );

                extraClass =
                    changeClasses.seller ||
                    '';

                break;


            case 'adViews':

                value =
                    formatNumber(
                        day.advertising?.views ||
                        0
                    );

                break;


            case 'adClicks':

                value =
                    formatNumber(
                        day.advertising?.clicks ||
                        0
                    );

                break;


            case 'adCarts':

                value =
                    formatNumber(
                        day.advertising?.atbs ||
                        0
                    );

                break;


            case 'adCpm':

                value =
                    formatNumber(
                        day.advertising?.cpm ||
                        0,
                        2
                    );

                break;


            case 'adSpend':

                value =
                    formatAdMoney(
                        day.advertising?.spend ||
                        0
                    );

                break;


            case 'allOrders':

                value =
                    formatNumber(
                        day.allOrders ??
                        day.orders ??
                        0
                    );

                extraClass =
                    changeClasses.allOrders ||
                    '';

                break;


            case 'adOrders':

                value =
                    formatNumber(
                        day.advertising?.orders ||
                        0
                    );

                extraClass =
                    changeClasses.adOrders ||
                    '';

                break;


            case 'adOrdersAmount':

                value =
                    formatAdMoney(
                        day.advertising?.ordersAmount ||
                        0
                    );

                extraClass =
                    changeClasses.adOrdersAmount ||
                    '';

                break;


            case 'sales':

                // Сегодня продажи НЕ показываем.
                // За остальные дни оставляем как есть.
                value =
                    isToday
                        ? '<span class="empty">—</span>'
                        : formatNumber(
                            day.sales
                        );

                extraClass =
                    isToday
                        ? ''
                        : (
                            changeClasses.sales ||
                            ''
                        );

                break;


            case 'retailSales':

                value =
                    formatMoney(
                        financial?.retailSales
                    );

                break;


            case 'forPay':

                value =
                    formatMoney(
                        financial?.forPay
                    );

                break;


            case 'logistics':

                value =
                    formatMoney(
                        financial?.logistics
                    );

                break;


            case 'storage':

                value =
                    formatMoney(
                        financial?.storage
                    );

                break;


            case 'tax':

                value =
                    formatMoney(
                        financial?.tax
                    );

                break;


            case 'profit':

                value =
                    formatMoney(
                        financial?.profit
                    );

                break;


            case 'profitability':

                value =
                    formatPercent(
                        financial?.profitability
                    );

                extraClass =
                    changeClasses.profitability ||
                    '';

                break;


            case 'margin':

                value =
                    formatPercent(
                        financial?.margin
                    );

                extraClass =
                    changeClasses.margin ||
                    '';

                break;


            default:

                value =
                    '<span class="empty">—</span>';
        }


        return `

            <td
                class="${
                    isFirst
                        ? 'day-separator '
                        : ''
                }${
                    isLast
                        ? 'day-end '
                        : ''
                }${
                    column.className || ''
                } ${
                    extraClass
                }"
            >

                ${value}

            </td>

        `;
    }


    // ========================================================
    // BODY
    // ========================================================

    let html = '';


    for (
        const product of products
    ) {

        const allDays =
            Array.isArray(
                product.days
            )
                ? product.days
                : [];


        const visibleDays =
            allDays.slice(-daysCount).reverse();


        html += `

            <tr>

                <td
                    class="product-cell"
                    data-product-nm-id="${escapeHtml(product.nmId || '')}"
                    title="Нажмите, чтобы открыть данные за 7 дней"
                >

                    <div class="product-name">

                        ${escapeHtml(
                            product.name ||
                            'Без названия'
                        )}

                    </div>

                    <div class="product-article">

                        ${escapeHtml(
                            product.article ||
                            ''
                        )}

                        · nmId

                        ${escapeHtml(
                            product.nmId ||
                            ''
                        )}

                    </div>

                </td>

        `;


        visibleDays.forEach(
            (
                day,
                index
            ) => {

                const isToday =
                    index === 0;


                const columns =
                    isToday
                        ? todayColumns
                        : historicalColumns;


                // Предыдущий календарный день берём из ПОЛНОГО массива.
                // Поэтому самый старый отображаемый день тоже получает
                // сравнение с днём, который скрыт за пределами выбранного диапазона.
                const currentDayIndex =
                    allDays.findIndex(
                        item =>
                            String(item?.date || '') ===
                            String(day?.date || '')
                    );

                const previousDay =
                    currentDayIndex > 0
                        ? allDays[currentDayIndex - 1]
                        : null;


                // --------------------------------------------
                // ИЗМЕНЕНИЯ
                // --------------------------------------------

                const changeClasses = {

                    buyer:
                        previousDay
                            ? getChangeClass(
                                day.buyerPrice,
                                previousDay.buyerPrice,
                                'price'
                            )
                            : '',

                    spp:
                        previousDay
                            ? getChangeClass(
                                day.spp,
                                previousDay.spp,
                                'spp'
                            )
                            : '',

                    seller:
                        previousDay
                            ? getChangeClass(
                                day.sellerPrice,
                                previousDay.sellerPrice,
                                'price'
                            )
                            : '',

                    allOrders:
                        !isToday && previousDay
                            ? getChangeClass(
                                day.allOrders ?? day.orders,
                                previousDay.allOrders ?? previousDay.orders,
                                'sales'
                            )
                            : '',

                    adOrders:
                        !isToday && previousDay
                            ? getChangeClass(
                                day.advertising?.orders,
                                previousDay.advertising?.orders,
                                'sales'
                            )
                            : '',

                    adOrdersAmount:
                        !isToday && previousDay
                            ? getChangeClass(
                                day.advertising?.ordersAmount,
                                previousDay.advertising?.ordersAmount,
                                'sales'
                            )
                            : '',

                    sales:
                        previousDay
                            ? getChangeClass(
                                day.sales,
                                previousDay.sales,
                                'sales'
                            )
                            : '',

                    profitability:
                        previousDay
                            ? getChangeClass(
                                day.financial?.profitability,
                                previousDay.financial?.profitability,
                                'profitability'
                            )
                            : '',

                    margin:
                        previousDay
                            ? getChangeClass(
                                day.financial?.margin,
                                previousDay.financial?.margin,
                                'margin'
                            )
                            : ''
                };


                columns.forEach(
                    (
                        column,
                        columnIndex
                    ) => {

                        html +=
                            renderColumnValue(
                                column,
                                day,
                                day.financial || {},
                                changeClasses,
                                columnIndex === 0,
                                columnIndex === columns.length - 1,
                                isToday
                            );
                    }
                );

            }
        );


        // ====================================================
        // ИТОГОВЫЕ КОЛОНКИ
        // ====================================================

        html += `

                <td
                    class="day-separator result-col"
                >

                    ${formatNumber(
                        product.orders30
                    )}

                </td>

                <td
                    class="result-col"
                >

                    ${formatNumber(
                        allDays
                            .slice(-7)
                            .reduce(
                                (sum, day) =>
                                    sum +
                                    Number(
                                        day?.orders ||
                                        0
                                    ),
                                0
                            ) / 7,
                        1
                    )}

                </td>

                <td
                    class="stock result-col"
                >

                    ${formatNumber(
                        product.stockToday
                    )}

                </td>

                <td
                    class="days-left result-col"
                >

                    ${
                        product.daysLeft === null
                            ? '<span class="empty">∞</span>'
                            : formatNumber(
                                product.daysLeft,
                                1
                            ) + ' дн.'
                    }

                </td>

                <td
                    class="position result-col"
                >

                    ${formatNumber(
                        product.positionToday,
                        1
                    )}

                </td>

                <td
                    class="cost result-col"
                >

                    ${formatMoney(
                        product.cost
                    )}

                </td>

                <td
                    class="stock result-col"
                >

                    ${formatNumber(
                        product.mainStock ??
                        0
                    )}

                </td>

            </tr>

        `;
    }


    document
        .getElementById('tableBody')
        .innerHTML =
            html;
}

function getModalColumns() {

    const columns = [];

    document
        .querySelectorAll(
            '.column-chooser input[data-column]'
        )
        .forEach(
            checkbox => {

                if (!checkbox.checked) {
                    return;
                }

                columns.push(
                    checkbox.dataset.column
                );
            }
        );

    return columns;
}

        },

            title: 'Клики',

        },

            group: 'promotion'
        },
        adCpm: {

            group: 'promotion'
        },

        },

function getModalChangeClass(
    key,
    currentDay,
    previousDay
) {

    if (!previousDay) {
        return '';
    }

    let current;
    let previous;
    let type = 'sales';

    switch (key) {

        case 'buyerPrice':
            current = currentDay.buyerPrice;
            previous = previousDay.buyerPrice;
            type = 'price';
            break;

        case 'spp':
            current = currentDay.spp;
            previous = previousDay.spp;
            type = 'spp';
            break;

        case 'sellerPrice':
            current = currentDay.sellerPrice;
            previous = previousDay.sellerPrice;
            type = 'price';
            break;

        case 'allOrders':
            current = currentDay.allOrders ?? currentDay.orders;
            previous = previousDay.allOrders ?? previousDay.orders;
            break;

        case 'sales':
            current = currentDay.sales;
            previous = previousDay.sales;
            break;

        case 'adOrders':
            current = currentDay.advertising?.orders;
            previous = previousDay.advertising?.orders;
            break;

        case 'adOrdersAmount':
            current = currentDay.advertising?.ordersAmount;
            previous = previousDay.advertising?.ordersAmount;
            break;

        case 'profitability':
            current = currentDay.financial?.profitability;
            previous = previousDay.financial?.profitability;
            type = 'profitability';
            break;

        case 'margin':
            current = currentDay.financial?.margin;
            previous = previousDay.financial?.margin;
            type = 'margin';
            break;

        default:
            return '';
    }

    return getChangeClass(
        current,
        previous,
        type
    );
}


function formatModalDayTitle(date, index) {

    const titles = [
        'Сегодня',
        'Вчера',
        'Позавчера'
    ];

    return `${titles[index] || 'День'} ${formatDate(date)}`;
}


function openProductDetails(product) {

    const overlay =
        document.getElementById(
            'productDetailsOverlay'
        );

    const title =
        document.getElementById(
            'productDetailsTitle'
        );

    const meta =
        document.getElementById(
            'productDetailsMeta'
        );

    const tableContainer =
        document.getElementById(
            'productDetailsTable'
        );

    if (
        !overlay ||
        !title ||
        !meta ||
        !tableContainer ||
        !product
    ) {
        return;
    }

    const allDays =
        Array.isArray(product.days)
            ? product.days
            : [];

    const days =
        allDays
            .slice(-7)
            .reverse();

    const keys =
        getModalColumns();

    title.textContent =
        product.name ||
        'Без названия';

    meta.innerHTML = `
        <span>Артикул: <b>${escapeHtml(product.article || '—')}</b></span>
        <span>Код: <b>${escapeHtml(product.nmId || '—')}</b></span>
    `;

    let html = `
        <table class="product-details-table">
            <thead>
                <tr>
                    <th>День</th>
    `;

    for (const key of keys) {

        const definition =
            getColumnDefinition(key);

        html += `
            <th
                class="${
                    definition.group === 'promotion'
                        ? 'promotion-modal'
                        : ''
                }"
            >
                ${definition.title}
            </th>
        `;
    }

    html += `
                </tr>
            </thead>
            <tbody>
    `;

    days.forEach(
        (day, index) => {

            const currentDay =
                day || {};

            const currentDate =
                String(
                    currentDay.date || ''
                ).slice(0, 10);

            const currentDayIndex =
                allDays.findIndex(
                    item =>
                        String(
                            item?.date || ''
                        ).slice(0, 10) ===
                        currentDate
                );

            const previousDay =
                currentDayIndex > 0
                    ? allDays[currentDayIndex - 1]
                    : null;

            html += `
                <tr>
                    <td class="day-label day-separator-modal">
                        ${formatModalDayTitle(
                            currentDate,
                            index
                        )}
                    </td>
            `;

            for (const key of keys) {

                const definition =
                    getColumnDefinition(key);

                const changeClass =
                    getModalChangeClass(
                        key,
                        currentDay,
                        previousDay
                    );

                html += `
                    <td
                        class="${
                            definition.group === 'promotion'
                                ? 'promotion-modal '
                                : ''
                        }${changeClass}"
                    >
                        ${getModalValue(
                            key,
                            currentDay,
                            index === 0
                        )}
                    </td>
                `;
            }

            html += `
                </tr>
            `;
        }
    );

    html += `
            </tbody>
        </table>
    `;

    tableContainer.innerHTML = html;

    overlay.classList.add('visible');
    overlay.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
}


function closeProductDetails() {

    const overlay =
        document.getElementById(
            'productDetailsOverlay'
        );

    if (!overlay) {
        return;
    }

    overlay.classList.remove('visible');
    overlay.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
}

document
    .getElementById('tableBody')
    .addEventListener(
        'click',
        event => {

            const cell =
                event.target.closest(
                    '.product-cell'
                );

            if (!cell) {
                return;
            }

            const nmId =
                Number(
                    cell.dataset.productNmId
                );

            const product =
                window.dashboardData?.products?.find(
                    item =>
                        Number(item?.nmId) === nmId
                );

            if (product) {
                openProductDetails(product);
            }
        }
    );


document
    .getElementById('productDetailsClose')
    .addEventListener(
        'click',
        closeProductDetails
    );


document
    .getElementById('productDetailsOverlay')
    .addEventListener(
        'click',
        event => {

            if (
                event.target ===
                event.currentTarget
            ) {
                closeProductDetails();
            }
        }
    );


document.addEventListener(
    'keydown',
    event => {

        if (event.key === 'Escape') {
            closeProductDetails();
        }
    }
);

function resetLoadingOperations() {

    document
        .querySelectorAll(
            '#operationList .operation'
        )
        .forEach(
            operation => {
                operation.classList.remove(
                    'active',
                    'done'
                );
            }
        );
}


function updateLoadingOperations(progress) {

    if (!progress || !progress.steps) {
        return;
    }

    document
        .querySelectorAll(
            '#operationList .operation'
        )
        .forEach(
            operation => {

                const key =
                    operation.dataset.operation;

                const done =
                    progress.steps[key] === true;

                operation.classList.toggle(
                    'done',
                    done
                );

                operation.classList.toggle(
                    'active',
                    !done &&
                    progress.running === true &&
                    key === progress.current
                );
            }
        );
}


async function pollDashboardProgress() {

    while (loadingData) {

        try {

            const response =
                await fetch(
                    '/api/dashboard-progress?ts=' +
                    Date.now(),
                    {
                        method: 'GET',
                        cache: 'no-store'
                    }
                );

            if (response.ok) {

                const progress =
                    await response.json();

                updateLoadingOperations(
                    progress
                );
            }

        } catch (error) {

            // Не прерываем основную загрузку,
            // если временно не удалось получить статус.
        }

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    700
                )
        );
    }
}


function markAllOperationsDone() {

    document
        .querySelectorAll(
            '#operationList .operation'
        )
        .forEach(
            operation => {
                operation.classList.remove(
                    'active'
                );
                operation.classList.add(
                    'done'
                );
            }
        );
}


function closeLoadingOverlay() {

    const loadingOverlay =
        document.getElementById(
            'loadingOverlay'
        );

    if (!loadingOverlay) {
        return;
    }

    loadingOverlay.classList.remove(
        'visible'
    );

    loadingOverlay.setAttribute(
        'aria-hidden',
        'true'
    );
}


// ============================================================
// ЗАГРУЗКА ДАННЫХ
// ============================================================

async function loadData() {

    if (loadingData) {

        console.log(
            'Загрузка уже выполняется.'
        );

        return;
    }


    loadingData = true;


    const button =
        document.getElementById(
            'refreshButton'
        );

    const headerRefreshButton =
        document.getElementById(
            'headerRefreshButton'
        );

    const status =
        document.getElementById(
            'status'
        );

    const loadingOverlay =
        document.getElementById(
            'loadingOverlay'
        );


    if (button) {
        button.disabled = true;
    }

    if (headerRefreshButton) {
        headerRefreshButton.disabled = true;
    }

    status.textContent =
        'Обновление...';


    resetLoadingOperations();

    // Этапы будут обновляться реальным
    // состоянием /api/dashboard-progress.
    updateLoadingOperations({
        running: true,
        current: 'orders',
        steps: {
            orders: false,
            prices: false,
            stocks: false,
            moysklad: false,
            advertising: false,
            finance: false,
            storage: false
        }
    });


    loadingOverlay.classList.add(
        'visible'
    );

    loadingOverlay.setAttribute(
        'aria-hidden',
        'false'
    );


    document
        .getElementById(
            'tableBody'
        )
        .innerHTML = `

            <tr>

                <td
                    colspan="60"
                    class="loading"
                >
                    &nbsp;
                </td>

            </tr>

        `;


    const progressPromise =
        pollDashboardProgress();


    try {

        const response =
            await fetch(
                '/api/dashboard?ts=' +
                Date.now(),
                {
                    method: 'GET',
                    cache: 'no-store'
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                `HTTP ${response.status}`
            );
        }


        window.dashboardData = data;

        render(data);

        markAllOperationsDone();

        if (headerRefreshButton) {
            headerRefreshButton.style.display =
                'inline-flex';
        }


        const updated =
            new Date(
                data.updatedAt
            );


        status.textContent =
            'Обновлено: ' +
            updated.toLocaleTimeString(
                'ru-RU'
            );


    } catch (error) {

        console.error(
            'LOAD DATA ERROR:',
            error
        );


        status.textContent =
            'Ошибка';

        if (headerRefreshButton) {
            headerRefreshButton.style.display =
                'none';
        }


        document
            .getElementById(
                'tableBody'
            )
            .innerHTML = `

                <tr>

                    <td
                        colspan="60"
                        class="table-empty-state"
                    >

                        <div
                            style="margin-bottom:12px;color:#c0392b;font-size:13px"
                        >
                            ${escapeHtml(
                                error.message
                            )}
                        </div>

                        <button
                            id="refreshButton"
                            class="big-load-button"
                            type="button"
                        >
                            Получить данные
                        </button>

                    </td>

                </tr>

            `;


        document
            .getElementById(
                'refreshButton'
            )
            .addEventListener(
                'click',
                loadData
            );


    } finally {

        loadingData = false;

        // Дожидаемся последнего чтения прогресса,
        // чтобы не оставить активный этап.
        await progressPromise;

        markAllOperationsDone();

        if (button) {
            button.disabled = false;
        }

        if (headerRefreshButton) {
            headerRefreshButton.disabled = false;
        }

        closeLoadingOverlay();
    }
}


// ============================================================
// КНОПКИ
// ============================================================

document

    )
    .addEventListener(
        'click',
        loadData
    );
