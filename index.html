<script>


// ============================================================
// HELPERS
// ============================================================

function escapeHtml(value) {

    return String(
        value ?? ''
    )

        .replace(
            /[&<>"']/g,
            char => ({

                '&':
                    '&amp;',

                '<':
                    '&lt;',

                '>':
                    '&gt;',

                '"':
                    '&quot;',

                "'":
                    '&#039;'

            }[char])
        );

}


// ============================================================
// ЧИСЛА
// ============================================================

function formatNumber(
    value,
    digits = 0
) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(
            Number(value)
        )
    ) {

        return `
            <span class="empty">
                —
            </span>
        `;

    }


    return Number(
        value
    )

        .toLocaleString(
            'ru-RU',
            {

                maximumFractionDigits:
                    digits

            }
        );

}


// ============================================================
// ДЕНЬГИ
// ============================================================

function formatMoney(value) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(
            Number(value)
        )
    ) {

        return `
            <span class="empty">
                —
            </span>
        `;

    }


    return (

        Number(value)

            .toLocaleString(
                'ru-RU',
                {

                    maximumFractionDigits:
                        0

                }
            )

        + ' ₽'

    );

}


// ============================================================
// ДЕНЬГИ РЕКЛАМЫ
// ============================================================

function formatAdMoney(value) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(
            Number(value)
        )
    ) {

        return `
            <span class="empty">
                —
            </span>
        `;

    }


    return (

        Number(value)

            .toLocaleString(
                'ru-RU',
                {

                    minimumFractionDigits:
                        2,

                    maximumFractionDigits:
                        2

                }
            )

        + ' ₽'

    );

}


// ============================================================
// ПРОЦЕНТ
// ============================================================

function formatPercent(value) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(
            Number(value)
        )
    ) {

        return `
            <span class="empty">
                —
            </span>
        `;

    }


    return (

        Number(value)

            .toLocaleString(
                'ru-RU',
                {

                    maximumFractionDigits:
                        1

                }
            )

        + '%'

    );

}


// ============================================================
// ДАТА
// ============================================================

function formatDate(date) {

    if (!date) {

        return '';

    }


    const parts =
        String(date).split('-');


    if (
        parts.length !== 3
    ) {

        return String(date);

    }


    return `${
        parts[2]
    }.${
        parts[1]
    }`;

}


// ============================================================
// КЛАСС ИЗМЕНЕНИЯ
// ============================================================

function getChangeClass(
    current,
    previous,
    type
) {

    if (
        current === null ||
        previous === null ||
        current === undefined ||
        previous === undefined
    ) {

        return '';

    }


    const currentNumber =
        Number(current);


    const previousNumber =
        Number(previous);


    if (
        !Number.isFinite(
            currentNumber
        ) ||
        !Number.isFinite(
            previousNumber
        )
    ) {

        return '';

    }


    if (
        currentNumber ===
        previousNumber
    ) {

        return 'same';

    }


    if (
        type === 'price'
    ) {

        return currentNumber <
            previousNumber
            ? 'up'
            : 'down';

    }


    if (
        type === 'spp'
    ) {

        return currentNumber >
            previousNumber
            ? 'up'
            : 'down';

    }


    if (
        type === 'sales'
    ) {

        return currentNumber >
            previousNumber
            ? 'up'
            : 'down';

    }


    return '';

}


// ============================================================
// RENDER
// ============================================================

function render(data) {

    // ========================================================
    // ВСЕ ТОВАРЫ
    // ========================================================

    const allProducts =
        Array.isArray(data.products)
            ? data.products
            : [];


    // ========================================================
    // ФИЛЬТР ТОВАРОВ
    // ========================================================

    const filterInput =
        document.getElementById(
            'productFilter'
        );


    const hideZeroSalesCheckbox =
        document.getElementById(
            'hideZeroSales'
        );


    const filterText =
        String(
            filterInput?.value || ''
        )
            .trim()
            .toLowerCase();


    const hideZeroSales =
        hideZeroSalesCheckbox
            ? hideZeroSalesCheckbox.checked
            : true;


    // ========================================================
    // ФИЛЬТРАЦИЯ
    // ========================================================

    const products =
        allProducts.filter(
            product => {

                const dayBefore =
                    product.days?.[0] || {};

                const yesterday =
                    product.days?.[1] || {};

                const today =
                    product.days?.[2] || {};


                const sales3Days =
                    Number(dayBefore.sales || 0) +
                    Number(yesterday.sales || 0) +
                    Number(today.sales || 0);


                // --------------------------------------------
                // НУЛЕВЫЕ ПРОДАЖИ
                // --------------------------------------------

                if (
                    hideZeroSales &&
                    sales3Days <= 0
                ) {

                    return false;
                }


                // --------------------------------------------
                // ПОИСК ПО НАЗВАНИЮ / КОДУ / NM ID
                // --------------------------------------------

                if (filterText) {

                    const name =
                        String(
                            product.name || ''
                        )
                            .toLowerCase();


                    const article =
                        String(
                            product.article || ''
                        )
                            .toLowerCase();


                    const nmId =
                        String(
                            product.nmId || ''
                        )
                            .toLowerCase();


                    if (
                        !name.includes(filterText) &&
                        !article.includes(filterText) &&
                        !nmId.includes(filterText)
                    ) {

                        return false;
                    }
                }


                return true;
            }
        );


    // ========================================================
    // СОРТИРОВКА ПО ЗАКАЗАМ ЗА 3 ДНЯ — ВОЗРАСТАНИЕ
    // ========================================================

    products.sort(
        (a, b) => {

            const aSales =
                Number(a.days?.[0]?.sales || 0) +
                Number(a.days?.[1]?.sales || 0) +
                Number(a.days?.[2]?.sales || 0);


            const bSales =
                Number(b.days?.[0]?.sales || 0) +
                Number(b.days?.[1]?.sales || 0) +
                Number(b.days?.[2]?.sales || 0);


            if (
                aSales !== bSales
            ) {

                return aSales - bSales;
            }


            return Number(a.nmId || 0) -
                   Number(b.nmId || 0);
        }
    );


    // ========================================================
    // СОХРАНЯЕМ ВЫБОР КОЛОНОК
    // ========================================================

    const columnState = {};


    document
        .querySelectorAll(
            '.column-chooser input[data-column]'
        )
        .forEach(
            checkbox => {

                columnState[
                    checkbox.dataset.column
                ] = checkbox.checked;
            }
        );


    // ========================================================
    // КОЛОНКИ
    // ========================================================

    const operationalColumns = [

        {
            key: 'buyerPrice',
            title: 'Цена<br>покупателя',
            className: 'day-col-wide'
        },

        {
            key: 'spp',
            title: 'СПП',
            className: 'day-col'
        },

        {
            key: 'sellerPrice',
            title: 'Цена<br>продавца',
            className: 'day-col-wide'
        },

        {
            key: 'views',
            title: 'Показы',
            className: 'day-col'
        },

        {
            key: 'clicks',
            title: 'Клики',
            className: 'day-col'
        },

        {
            key: 'atbs',
            title: 'Корзины',
            className: 'day-col'
        },

        {
            key: 'cpm',
            title: 'CPM',
            className: 'day-col'
        },

        {
            key: 'spend',
            title: 'Затраты',
            className: 'day-col-wide'
        },

        {
            key: 'sales',
            title: 'Продажи',
            className: 'day-col'
        }
    ];


    const financialColumns = [

        {
            key: 'forPay',
            title: 'К<br>перечислению',
            className: 'day-col-wide'
        },

        {
            key: 'logistics',
            title: 'Логистика',
            className: 'day-col-wide'
        },

        {
            key: 'storage',
            title: 'Хранение',
            className: 'day-col-wide'
        },

        {
            key: 'tax',
            title: 'Налог',
            className: 'day-col-wide'
        },

        {
            key: 'profit',
            title: 'Прибыль',
            className: 'day-col-wide'
        },

        {
            key: 'profitability',
            title: 'Рентабельность',
            className: 'day-col-wide'
        },

        {
            key: 'margin',
            title: 'Маржа',
            className: 'day-col-wide'
        }
    ];


    const selectedOperationalColumns =
        operationalColumns.filter(
            column =>
                columnState[column.key]
        );


    const selectedFinancialColumns =
        financialColumns.filter(
            column =>
                columnState[column.key]
        );


    // ========================================================
    // ФИНАНСОВЫЕ КОЛОНКИ ЗА СЕГОДНЯ НЕ ПОКАЗЫВАЕМ
    // ========================================================

    const todayColumns =
        selectedOperationalColumns.length
            ? selectedOperationalColumns
            : [
                {
                    key: '__emptyToday',
                    title: '—',
                    className: 'day-col'
                }
            ];


    const historicalColumns =
        selectedOperationalColumns.concat(
            selectedFinancialColumns
        );


    const yesterdayColumns =
        historicalColumns.length
            ? historicalColumns
            : [
                {
                    key: '__emptyYesterday',
                    title: '—',
                    className: 'day-col'
                }
            ];


    const dayBeforeColumns =
        historicalColumns.length
            ? historicalColumns
            : [
                {
                    key: '__emptyDayBefore',
                    title: '—',
                    className: 'day-col'
                }
            ];


    // ========================================================
    // ПЕРИОД
    // ========================================================

    document
        .getElementById('period')
        .textContent =
            `Заказы: ${
                formatDate(data.period.from)
            } — ${
                formatDate(data.period.to)
            } · товаров: ${
                products.length
            }`;


    // ========================================================
    // НЕТ ТОВАРОВ
    // ========================================================

    if (!products.length) {

        document
            .getElementById('tableHead')
            .innerHTML = '';


        document
            .getElementById('tableBody')
            .innerHTML = `

                <tr>

                    <td
                        colspan="20"
                        class="error"
                    >

                        ${
                            filterText
                                ? 'Товары не найдены.'
                                : hideZeroSales
                                    ? 'За последние 3 дня продаж нет.'
                                    : 'Товары отсутствуют.'
                        }

                    </td>

                </tr>

            `;

        return;
    }


    // ========================================================
    // ДНИ
    // ========================================================

    const today =
        products[0].days[2];

    const yesterday =
        products[0].days[1];

    const dayBefore =
        products[0].days[0];


    // ========================================================
    // HEADER — ПЕРВАЯ СТРОКА
    // ========================================================

    const renderDayTitle =
        (title, day, columns) => `

            <th
                colspan="${columns.length}"
                class="day-title day-separator"
            >

                ${title}

                <span class="day-date">
                    ${formatDate(day.date)}
                </span>

            </th>
        `;


    let headerTop = `

        <tr>

            <th
                rowspan="2"
                class="product-header"
            >
                Товар
            </th>

            ${renderDayTitle(
                'Сегодня',
                today,
                todayColumns
            )}

            ${renderDayTitle(
                'Вчера',
                yesterday,
                yesterdayColumns
            )}

            ${renderDayTitle(
                'Позавчера',
                dayBefore,
                dayBeforeColumns
            )}

            <th
                rowspan="2"
                class="day-separator result-col"
            >
                Заказы<br>30 дней
            </th>

            <th
                rowspan="2"
                class="result-col"
            >
                Остаток<br>сегодня
            </th>

            <th
                rowspan="2"
                class="result-col"
            >
                Хватит<br>на
            </th>

            <th
                rowspan="2"
                class="result-col"
            >
                Позиция
            </th>

            <th
                rowspan="2"
                class="result-col"
            >
                Себестоимость
            </th>

        </tr>
    `;


    // ========================================================
    // HEADER — ВТОРАЯ СТРОКА
    // ========================================================

    const renderColumnsHeader =
        columns => {

            return columns
                .map(
                    (column, index) => `

                        <th
                            class="${
                                index === 0
                                    ? 'day-separator '
                                    : ''
                            }${column.className || ''}"
                        >
                            ${column.title}
                        </th>
                    `
                )
                .join('');
        };


    const headerBottom = `

        <tr>

            ${renderColumnsHeader(
                todayColumns
            )}

            ${renderColumnsHeader(
                yesterdayColumns
            )}

            ${renderColumnsHeader(
                dayBeforeColumns
            )}

        </tr>
    `;


    document
        .getElementById('tableHead')
        .innerHTML =
            headerTop +
            headerBottom;


    // ========================================================
    // ЗНАЧЕНИЕ КОЛОНКИ
    // ========================================================

    function renderColumnValue(
        column,
        day,
        financial,
        changeClasses,
        isFirst
    ) {

        let value = '';
        let extraClass = '';


        switch (column.key) {

            case 'buyerPrice':

                value =
                    formatMoney(
                        day.buyerPrice
                    );

                extraClass =
                    changeClasses.buyer ||
                    '';

                break;


            case 'spp':

                value =
                    formatPercent(
                        day.spp
                    );

                extraClass =
                    changeClasses.spp ||
                    '';

                break;


            case 'sellerPrice':

                value =
                    formatMoney(
                        day.sellerPrice
                    );

                extraClass =
                    changeClasses.seller ||
                    '';

                break;


            case 'views':

                value =
                    formatNumber(
                        day.advertising?.views ||
                        0
                    );

                break;


            case 'clicks':

                value =
                    formatNumber(
                        day.advertising?.clicks ||
                        0
                    );

                break;


            case 'atbs':

                value =
                    formatNumber(
                        day.advertising?.atbs ||
                        0
                    );

                break;


            case 'cpm':

                value =
                    formatNumber(
                        day.advertising?.cpm ||
                        0,
                        2
                    );

                break;


            case 'spend':

                value =
                    formatAdMoney(
                        day.advertising?.spend ||
                        0
                    );

                break;


            case 'sales':

                value =
                    formatNumber(
                        day.sales
                    );

                extraClass =
                    changeClasses.sales ||
                    '';

                break;


            case 'forPay':

                value =
                    formatMoney(
                        financial?.forPay
                    );

                break;


            case 'logistics':

                value =
                    formatMoney(
                        financial?.logistics
                    );

                break;


            case 'storage':

                value =
                    formatMoney(
                        financial?.storage
                    );

                break;


            case 'tax':

                value =
                    formatMoney(
                        financial?.tax
                    );

                break;


            case 'profit':

                value =
                    formatMoney(
                        financial?.profit
                    );

                break;


            case 'profitability':

                value =
                    formatPercent(
                        financial?.profitability
                    );

                break;


            case 'margin':

                value =
                    formatPercent(
                        financial?.margin
                    );

                break;


            default:

                value =
                    '<span class="empty">—</span>';
        }


        return `

            <td
                class="${
                    isFirst
                        ? 'day-separator '
                        : ''
                }${
                    column.className || ''
                } ${
                    extraClass
                }"
            >

                ${value}

            </td>
        `;
    }


    // ========================================================
    // BODY
    // ========================================================

    let html = '';


    for (
        const product of products
    ) {

        const today =
            product.days[2] || {};

        const yesterday =
            product.days[1] || {};

        const dayBefore =
            product.days[0] || {};


        // ====================================================
        // ИЗМЕНЕНИЯ
        // ====================================================

        const buyerTodayClass =
            getChangeClass(
                today.buyerPrice,
                yesterday.buyerPrice,
                'price'
            );


        const sppTodayClass =
            getChangeClass(
                today.spp,
                yesterday.spp,
                'spp'
            );


        const sellerTodayClass =
            getChangeClass(
                today.sellerPrice,
                yesterday.sellerPrice,
                'price'
            );


        const buyerYesterdayClass =
            getChangeClass(
                yesterday.buyerPrice,
                dayBefore.buyerPrice,
                'price'
            );


        const sppYesterdayClass =
            getChangeClass(
                yesterday.spp,
                dayBefore.spp,
                'spp'
            );


        const sellerYesterdayClass =
            getChangeClass(
                yesterday.sellerPrice,
                dayBefore.sellerPrice,
                'price'
            );


        const salesTodayClass =
            getChangeClass(
                today.sales,
                yesterday.sales,
                'sales'
            );


        const salesYesterdayClass =
            getChangeClass(
                yesterday.sales,
                dayBefore.sales,
                'sales'
            );


        const todayFinancial =
            today.financial || {};


        const yesterdayFinancial =
            yesterday.financial || {};


        const dayBeforeFinancial =
            dayBefore.financial || {};


        const todayClasses = {

            buyer:
                buyerTodayClass,

            spp:
                sppTodayClass,

            seller:
                sellerTodayClass,

            sales:
                salesTodayClass
        };


        const yesterdayClasses = {

            buyer:
                buyerYesterdayClass,

            spp:
                sppYesterdayClass,

            seller:
                sellerYesterdayClass,

            sales:
                salesYesterdayClass
        };


        const dayBeforeClasses = {

            buyer: '',

            spp: '',

            seller: '',

            sales: ''
        };


        html += `

<tr>

    <!-- ====================================================
         ТОВАР
         ==================================================== -->

    <td
        class="product-cell"
        title="${escapeHtml(
            product.name || ''
        )}"
    >

        <div class="product-name">

            ${escapeHtml(
                product.name ||
                'Без названия'
            )}

        </div>


        <div class="product-article">

            ${escapeHtml(
                product.article ||
                ''
            )}

            · nmId

            ${escapeHtml(
                product.nmId ||
                ''
            )}

        </div>

    </td>


    <!-- ====================================================
         СЕГОДНЯ
         ==================================================== -->

    ${todayColumns
        .map(
            (column, index) =>
                renderColumnValue(
                    column,
                    today,
                    todayFinancial,
                    todayClasses,
                    index === 0
                )
        )
        .join('')}


    <!-- ====================================================
         ВЧЕРА
         ==================================================== -->

    ${yesterdayColumns
        .map(
            (column, index) =>
                renderColumnValue(
                    column,
                    yesterday,
                    yesterdayFinancial,
                    yesterdayClasses,
                    index === 0
                )
        )
        .join('')}


    <!-- ====================================================
         ПОЗАВЧЕРА
         ==================================================== -->

    ${dayBeforeColumns
        .map(
            (column, index) =>
                renderColumnValue(
                    column,
                    dayBefore,
                    dayBeforeFinancial,
                    dayBeforeClasses,
                    index === 0
                )
        )
        .join('')}


    <!-- ====================================================
         ИТОГИ
         ==================================================== -->

    <td class="day-separator result-col">
        ${formatNumber(
            product.orders30
        )}
    </td>


    <td class="stock result-col">
        ${formatNumber(
            product.stockToday
        )}
    </td>


    <td class="days-left result-col">

        ${
            product.daysLeft === null
                ? '<span class="empty">∞</span>'
                : formatNumber(
                    product.daysLeft,
                    1
                ) + ' дн.'
        }

    </td>


    <td class="position result-col">
        ${formatNumber(
            product.positionToday,
            1
        )}
    </td>


    <td class="cost result-col">
        ${formatMoney(
            product.cost
        )}
    </td>

</tr>

`;

    }


    document
        .getElementById('tableBody')
        .innerHTML =
            html;
}


// ============================================================
// ЗАГРУЗКА
// ============================================================
//
// ВАЖНО:
//
// loadingData не позволяет отправить второй запрос,
// пока первый /api/dashboard ещё выполняется.
// ============================================================

// ============================================================
// ЗАЩИТА ОТ ПОВТОРНОЙ ЗАГРУЗКИ
// ============================================================

let loadingData = false;


// ============================================================
// ЗАГРУЗКА ДАННЫХ
//
// ВАЖНО:
// Автоматически НЕ запускается.
// Только после нажатия кнопки.
// ============================================================

async function loadData() {

    if (loadingData) {

        console.log(
            'Загрузка уже выполняется.'
        );

        return;
    }


    loadingData =
        true;


    const button =
        document.getElementById(
            'refreshButton'
        );


    const status =
        document.getElementById(
            'status'
        );


    button.disabled =
        true;


    button.textContent =
        '↻ Обновляем...';


    status.textContent =
        'Обновляем данные WB...';


    document
        .getElementById(
            'tableBody'
        )
        .innerHTML = `

            <tr>

                <td
                    colspan="60"
                    class="loading"
                >

                    Получаем данные из WB...

                    Это может занять
                    несколько минут.

                </td>

            </tr>

        `;


    try {

        const response =
            await fetch(
                '/api/dashboard?ts=' +
                Date.now(),
                {

                    method:
                        'GET',

                    cache:
                        'no-store'

                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                `HTTP ${response.status}`
            );

        }


        window.dashboardData =
            data;

        window.dashboardData = data;

        window.dashboardData =
            data;

        render(
            data
        );


        const updated =
            new Date(
                data.updatedAt
            );


        status.textContent =
            'Обновлено: ' +
            updated.toLocaleTimeString(
                'ru-RU'
            );


    } catch (error) {

        console.error(
            'LOAD DATA ERROR:',
            error
        );


        status.textContent =
            'Ошибка';


        document
            .getElementById(
                'tableBody'
            )
            .innerHTML = `

                <tr>

                    <td
                        colspan="60"
                        class="error"
                    >

                        ${escapeHtml(
                            error.message
                        )}

                    </td>

                </tr>

            `;


    } finally {

        loadingData =
            false;


        button.disabled =
            false;


        button.textContent =
            '↻ Обновить данные';

    }

}


// ============================================================
// КНОПКА
// ============================================================

document
    .getElementById(
        'refreshButton'
    )
    .addEventListener(
        'click',
        loadData
    );


// ============================================================
// ФИЛЬТР ПО ТОВАРУ
// ============================================================

document
    .getElementById(
        'productFilter'
    )
    .addEventListener(
        'input',
        () => {

            if (
                window.dashboardData
            ) {

                render(
                    window.dashboardData
                );

            }

        }
    );


// ============================================================
// НУЛЕВЫЕ ПРОДАЖИ
// ============================================================

document
    .getElementById(
        'hideZeroSales'
    )
    .addEventListener(
        'change',
        () => {

            if (
                window.dashboardData
            ) {

                render(
                    window.dashboardData
                );

            }

        }
    );


// ============================================================
// ФИЛЬТР ТОВАРОВ
// ============================================================

document
    .getElementById(
        'productFilter'
    )
    .addEventListener(
        'input',
        () => {

            if (
                window.dashboardData
            ) {

                render(
                    window.dashboardData
                );
            }
        }
    );


// ============================================================
// НУЛЕВЫЕ ПРОДАЖИ
// ============================================================

document
    .getElementById(
        'hideZeroSales'
    )
    .addEventListener(
        'change',
        () => {

            if (
                window.dashboardData
            ) {

                render(
                    window.dashboardData
                );
            }
        }
    );


// ============================================================
// ВЫБОР КОЛОНОК
// ============================================================

document
    .querySelectorAll(
        '.column-chooser input[data-column]'
    )
    .forEach(
        checkbox => {

            checkbox.addEventListener(
                'change',
                () => {

                    if (
                        window.dashboardData
                    ) {

                        render(
                            window.dashboardData
                        );
                    }
                }
            );
        }
    );

// ============================================================

</script>
