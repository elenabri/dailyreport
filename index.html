<script>


// ============================================================
// HELPERS
// ============================================================

function escapeHtml(value) {

    return String(
        value ?? ''
    )

        .replace(
            /[&<>"']/g,
            char => ({

                '&':
                    '&amp;',

                '<':
                    '&lt;',

                '>':
                    '&gt;',

                '"':
                    '&quot;',

                "'":
                    '&#039;'

            }[char])
        );

}


// ============================================================
// ЧИСЛА
// ============================================================

function formatNumber(
    value,
    digits = 0
) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(
            Number(value)
        )
    ) {

        return `
            <span class="empty">
                —
            </span>
        `;

    }


    return Number(
        value
    )

        .toLocaleString(
            'ru-RU',
            {

                maximumFractionDigits:
                    digits

            }
        );

}


// ============================================================
// ДЕНЬГИ
// ============================================================

function formatMoney(value) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(
            Number(value)
        )
    ) {

        return `
            <span class="empty">
                —
            </span>
        `;

    }


    return (

        Number(value)

            .toLocaleString(
                'ru-RU',
                {

                    maximumFractionDigits:
                        0

                }
            )

        + ' ₽'

    );

}


// ============================================================
// ДЕНЬГИ РЕКЛАМЫ
// ============================================================

function formatAdMoney(value) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(
            Number(value)
        )
    ) {

        return `
            <span class="empty">
                —
            </span>
        `;

    }


    return (

        Number(value)

            .toLocaleString(
                'ru-RU',
                {

                    minimumFractionDigits:
                        2,

                    maximumFractionDigits:
                        2

                }
            )

        + ' ₽'

    );

}


// ============================================================
// ПРОЦЕНТ
// ============================================================

function formatPercent(value) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(
            Number(value)
        )
    ) {

        return `
            <span class="empty">
                —
            </span>
        `;

    }


    return (

        Number(value)

            .toLocaleString(
                'ru-RU',
                {

                    maximumFractionDigits:
                        1

                }
            )

        + '%'

    );

}


// ============================================================
// ДАТА
// ============================================================

function formatDate(date) {

    if (!date) {

        return '';

    }


    const parts =
        String(date).split('-');


    if (
        parts.length !== 3
    ) {

        return String(date);

    }


    return `${
        parts[2]
    }.${
        parts[1]
    }`;

}


// ============================================================
// КЛАСС ИЗМЕНЕНИЯ
// ============================================================

function getChangeClass(
    current,
    previous,
    type
) {

    if (
        current === null ||
        previous === null ||
        current === undefined ||
        previous === undefined
    ) {

        return '';

    }


    const currentNumber =
        Number(current);


    const previousNumber =
        Number(previous);


    if (
        !Number.isFinite(
            currentNumber
        ) ||
        !Number.isFinite(
            previousNumber
        )
    ) {

        return '';

    }


    if (
        currentNumber ===
        previousNumber
    ) {

        return 'same';

    }


    if (
        type === 'price'
    ) {

        return currentNumber <
            previousNumber
            ? 'up'
            : 'down';

    }


    if (
        type === 'spp'
    ) {

        return currentNumber >
            previousNumber
            ? 'up'
            : 'down';

    }


    if (
        type === 'sales'
    ) {

        return currentNumber >
            previousNumber
            ? 'up'
            : 'down';

    }


    // ========================================================
    // РЕНТАБЕЛЬНОСТЬ / МАРЖА
    //
    // Рост  -> зелёный
    // Падение -> красный
    // ========================================================

    if (
        type === 'profitability' ||
        type === 'margin'
    ) {

        return currentNumber >
            previousNumber
            ? 'up'
            : 'down';

    }


    return '';

}


// ============================================================
// RENDER
// ============================================================

function render(data) {

    // ========================================================
    // ВСЕ ТОВАРЫ
    // ========================================================

    const allProducts =
        Array.isArray(data?.products)
            ? data.products
            : [];


    // ========================================================
    // ФИЛЬТР ТОВАРОВ
    // ========================================================

    const filterText =
        String(
            document.getElementById(
                'productFilter'
            )?.value || ''
        )
            .trim()
            .toLowerCase();


    const hideZeroSales =
        document.getElementById(
            'hideZeroSales'
        )?.checked !== false;


    // ========================================================
    // КОЛИЧЕСТВО ДНЕЙ
    // 1–7, по умолчанию 3
    // ========================================================

    let daysCount = Number(
        document.getElementById(
            'daysCount'
        )?.value || 3
    );


    if (
        !Number.isFinite(daysCount) ||
        daysCount < 1
    ) {
        daysCount = 3;
    }

    daysCount = Math.min(
        7,
        Math.max(1, daysCount)
    );


    // ========================================================
    // СНАЧАЛА ФИЛЬТРУЕМ ТОВАРЫ
    // ========================================================

    let products =
        allProducts.filter(
            product => {

                const days =
                    Array.isArray(product.days)
                        ? product.days
                        : [];


                const visibleDays =
                    days.slice(-daysCount);


                // --------------------------------------------
                // НУЛЕВЫЕ ПРОДАЖИ
                // --------------------------------------------

                if (
                    hideZeroSales
                ) {

                    const sales =
                        visibleDays.reduce(
                            (
                                sum,
                                day
                            ) =>
                                sum +
                                Number(
                                    day?.sales ||
                                    0
                                ),
                            0
                        );


                    if (
                        sales <= 0
                    ) {

                        return false;
                    }
                }


                // --------------------------------------------
                // ПОИСК
                // --------------------------------------------

                if (
                    filterText
                ) {

                    const name =
                        String(
                            product.name ||
                            ''
                        )
                            .toLowerCase();


                    const article =
                        String(
                            product.article ||
                            ''
                        )
                            .toLowerCase();


                    const nmId =
                        String(
                            product.nmId ||
                            ''
                        )
                            .toLowerCase();


                    if (
                        !name.includes(filterText) &&
                        !article.includes(filterText) &&
                        !nmId.includes(filterText)
                    ) {

                        return false;
                    }
                }


                return true;
            }
        );


    // ========================================================
    // СОРТИРОВКА ПО ЗАКАЗАМ ЗА ВЫБРАННОЕ ЧИСЛО ДНЕЙ
    // ПО ВОЗРАСТАНИЮ
    // ========================================================

    products.sort(
        (
            a,
            b
        ) => {

            const aSales =
                (Array.isArray(a.days)
                    ? a.days
                    : []
                )
                    .slice(-daysCount)
                    .reduce(
                        (
                            sum,
                            day
                        ) =>
                            sum +
                            Number(
                                day?.sales ||
                                0
                            ),
                        0
                    );


            const bSales =
                (Array.isArray(b.days)
                    ? b.days
                    : []
                )
                    .slice(-daysCount)
                    .reduce(
                        (
                            sum,
                            day
                        ) =>
                            sum +
                            Number(
                                day?.sales ||
                                0
                            ),
                        0
                    );


            if (
                aSales !== bSales
            ) {

                return aSales - bSales;
            }


            return Number(a.nmId || 0) -
                   Number(b.nmId || 0);
        }
    );


    // ========================================================
    // ПЕРИОД
    // ========================================================

    document
        .getElementById('period')
        .textContent =
            `Заказы: ${
                formatDate(
                    data?.period?.from
                )
            } — ${
                formatDate(
                    data?.period?.to
                )
            } · товаров: ${
                products.length
            }`;


    // ========================================================
    // НЕТ ТОВАРОВ
    // ========================================================

    if (
        !products.length
    ) {

        document
            .getElementById('tableHead')
            .innerHTML = '';


        document
            .getElementById('tableBody')
            .innerHTML = `

                <tr>

                    <td
                        colspan="50"
                        class="error"
                    >

                        ${
                            filterText
                                ? 'Товары не найдены.'
                                : hideZeroSales
                                    ? `За выбранные ${daysCount} ${daysCount === 1 ? 'день' : daysCount < 5 ? 'дня' : 'дней'} продаж нет.`
                                    : 'Товары отсутствуют.'
                        }

                    </td>

                </tr>

            `;

        return;
    }


    // ========================================================
    // СОСТОЯНИЕ КОЛОНОК
    // ========================================================

    const columnState = {};


    document
        .querySelectorAll(
            '.column-chooser input[data-column]'
        )
        .forEach(
            checkbox => {

                columnState[
                    checkbox.dataset.column
                ] = checkbox.checked;

            }
        );


    // ========================================================
    // КОЛОНКИ
    // ========================================================

    const operationalColumns = [

        {
            key: 'buyerPrice',
            title: 'Цена<br>покупателя',
            className: 'day-col-wide'
        },

        {
            key: 'spp',
            title: 'СПП',
            className: 'day-col'
        },

        {
            key: 'sellerPrice',
            title: 'Цена<br>продавца',
            className: 'day-col-wide'
        },

        {
            key: 'views',
            title: 'Показы',
            className: 'day-col'
        },

        {
            key: 'clicks',
            title: 'Клики',
            className: 'day-col'
        },

        {
            key: 'atbs',
            title: 'Корзины',
            className: 'day-col'
        },

        {
            key: 'cpm',
            title: 'CPM',
            className: 'day-col'
        },

        {
            key: 'spend',
            title: 'Затраты',
            className: 'day-col-wide'
        },

        {
            key: 'orders',
            title: 'Заказы',
            className: 'day-col'
        },

        {
            key: 'sales',
            title: 'Продажи',
            className: 'day-col'
        }

    ];


    const financialColumns = [

        {
            key: 'forPay',
            title: 'К<br>перечислению',
            className: 'day-col-wide'
        },

        {
            key: 'logistics',
            title: 'Логистика',
            className: 'day-col-wide'
        },

        {
            key: 'storage',
            title: 'Хранение',
            className: 'day-col-wide'
        },

        {
            key: 'tax',
            title: 'Налог',
            className: 'day-col-wide'
        },

        {
            key: 'profit',
            title: 'Прибыль',
            className: 'day-col-wide'
        },

        {
            key: 'profitability',
            title: 'Рентабельность',
            className: 'day-col-wide'
        },

        {
            key: 'margin',
            title: 'Маржа',
            className: 'day-col-wide'
        }

    ];


    const selectedOperationalColumns =
        operationalColumns.filter(
            column =>
                columnState[column.key]
        );


    const selectedFinancialColumns =
        financialColumns.filter(
            column =>
                columnState[column.key]
        );


    const todayColumns =
        selectedOperationalColumns;


    const historicalColumns =
        selectedOperationalColumns.concat(
            selectedFinancialColumns
        );


    // ========================================================
    // ДНИ
    // ========================================================

    const sampleDays =
        Array.isArray(
            products[0]?.days
        )
            ? products[0].days
            : [];


    const visibleDateValues =
        sampleDays.slice(-daysCount).reverse();


    // ========================================================
    // НАЗВАНИЯ ДНЕЙ
    // ========================================================

    function getDayTitle(
        visibleIndex,
        total
    ) {

        if (
            visibleIndex === 0
        ) {
            return 'Сегодня';
        }


        if (
            visibleIndex === 1
        ) {
            return 'Вчера';
        }


        if (
            visibleIndex === 2
        ) {
            return 'Позавчера';
        }


        return 'День';
    }


    function renderDayTitle(
        day,
        index,
        total,
        columns
    ) {

        return `

            <th
                colspan="${columns.length}"
                class="day-title day-separator"
            >

                ${getDayTitle(
                    index,
                    total
                )}

                <span class="day-date">

                    ${formatDate(
                        day.date
                    )}

                </span>

            </th>

        `;
    }


    function renderColumnsHeader(
        columns
    ) {

        return columns
            .map(
                (
                    column,
                    index
                ) => `

                    <th
                        class="${
                            index === 0
                                ? 'day-separator '
                                : ''
                        }${
                            column.className || ''
                        }"
                    >

                        ${column.title}

                    </th>

                `
            )
            .join('');
    }


    // ========================================================
    // HEADER
    // ========================================================

    let headerTop = `

        <tr>

            <th
                rowspan="2"
                class="product-header"
            >
                Товар
            </th>

    `;


    visibleDateValues.forEach(
        (
            day,
            index
        ) => {

            const isToday =
                index === 0;


            const columns =
                isToday
                    ? todayColumns
                    : historicalColumns;


            if (
                columns.length > 0
            ) {

                headerTop +=
                    renderDayTitle(
                        day,
                        index,
                        visibleDateValues.length,
                        columns
                    );

            }

        }
    );


    headerTop += `

            <th
                rowspan="2"
                class="day-separator result-col"
            >
                Заказы<br>30 дней
            </th>

            <th
                rowspan="2"
                class="result-col"
            >
                Остаток<br>сегодня
            </th>

            <th
                rowspan="2"
                class="result-col"
            >
                Хватит<br>на
            </th>

            <th
                rowspan="2"
                class="result-col"
            >
                Позиция
            </th>

            <th
                rowspan="2"
                class="result-col"
            >
                Себестоимость
            </th>

        </tr>
    `;


    let headerBottom = '<tr>';


    visibleDateValues.forEach(
        (
            day,
            index
        ) => {

            const isToday =
                index === 0;


            const columns =
                isToday
                    ? todayColumns
                    : historicalColumns;


            if (
                columns.length > 0
            ) {

                headerBottom +=
                    renderColumnsHeader(
                        columns
                    );

            }

        }
    );


    headerBottom += '</tr>';


    document
        .getElementById('tableHead')
        .innerHTML =
            headerTop +
            headerBottom;


    // ========================================================
    // РЕНДЕР ЗНАЧЕНИЯ КОЛОНКИ
    // ========================================================

    function renderColumnValue(
        column,
        day,
        financial,
        changeClasses,
        isFirst
    ) {

        let value = '';
        let extraClass = '';


        switch (
            column.key
        ) {

            case 'buyerPrice':

                value =
                    formatMoney(
                        day.buyerPrice
                    );

                extraClass =
                    changeClasses.buyer ||
                    '';

                break;


            case 'spp':

                value =
                    formatPercent(
                        day.spp
                    );

                extraClass =
                    changeClasses.spp ||
                    '';

                break;


            case 'sellerPrice':

                value =
                    formatMoney(
                        day.sellerPrice
                    );

                extraClass =
                    changeClasses.seller ||
                    '';

                break;


            case 'views':

                value =
                    formatNumber(
                        day.advertising?.views ||
                        0
                    );

                break;


            case 'clicks':

                value =
                    formatNumber(
                        day.advertising?.clicks ||
                        0
                    );

                break;


            case 'atbs':

                value =
                    formatNumber(
                        day.advertising?.atbs ||
                        0
                    );

                break;


            case 'cpm':

                value =
                    formatNumber(
                        day.advertising?.cpm ||
                        0,
                        2
                    );

                break;


            case 'spend':

                value =
                    formatAdMoney(
                        day.advertising?.spend ||
                        0
                    );

                break;


            case 'orders':

                value =
                    formatNumber(
                        day.orders ||
                        0
                    );

                break;


            case 'sales':

                value =
                    formatNumber(
                        day.sales
                    );

                extraClass =
                    changeClasses.sales ||
                    '';

                break;


            case 'forPay':

                value =
                    formatMoney(
                        financial?.forPay
                    );

                break;


            case 'logistics':

                value =
                    formatMoney(
                        financial?.logistics
                    );

                break;


            case 'storage':

                value =
                    formatMoney(
                        financial?.storage
                    );

                break;


            case 'tax':

                value =
                    formatMoney(
                        financial?.tax
                    );

                break;


            case 'profit':

                value =
                    formatMoney(
                        financial?.profit
                    );

                break;


            case 'profitability':

                value =
                    formatPercent(
                        financial?.profitability
                    );

                extraClass =
                    changeClasses.profitability ||
                    '';

                break;


            case 'margin':

                value =
                    formatPercent(
                        financial?.margin
                    );

                extraClass =
                    changeClasses.margin ||
                    '';

                break;


            default:

                value =
                    '<span class="empty">—</span>';
        }


        return `

            <td
                class="${
                    isFirst
                        ? 'day-separator '
                        : ''
                }${
                    column.className || ''
                } ${
                    extraClass
                }"
            >

                ${value}

            </td>

        `;
    }


    // ========================================================
    // BODY
    // ========================================================

    let html = '';


    for (
        const product of products
    ) {

        const allDays =
            Array.isArray(
                product.days
            )
                ? product.days
                : [];


        const visibleDays =
            allDays.slice(-daysCount).reverse();


        html += `

            <tr>

                <td
                    class="product-cell"
                    title="${escapeHtml(
                        product.name || ''
                    )}"
                >

                    <div class="product-name">

                        ${escapeHtml(
                            product.name ||
                            'Без названия'
                        )}

                    </div>

                    <div class="product-article">

                        ${escapeHtml(
                            product.article ||
                            ''
                        )}

                        · nmId

                        ${escapeHtml(
                            product.nmId ||
                            ''
                        )}

                    </div>

                </td>

        `;


        visibleDays.forEach(
            (
                day,
                index
            ) => {

                const isToday =
                    index === 0;


                const columns =
                    isToday
                        ? todayColumns
                        : historicalColumns;


                // Предыдущий календарный день берём из ПОЛНОГО массива.
                // Поэтому самый старый отображаемый день тоже получает
                // сравнение с днём, который скрыт за пределами выбранного диапазона.
                const currentDayIndex =
                    allDays.findIndex(
                        item =>
                            String(item?.date || '') ===
                            String(day?.date || '')
                    );

                const previousDay =
                    currentDayIndex > 0
                        ? allDays[currentDayIndex - 1]
                        : null;


                // --------------------------------------------
                // ИЗМЕНЕНИЯ
                // --------------------------------------------

                const changeClasses = {

                    buyer:
                        previousDay
                            ? getChangeClass(
                                day.buyerPrice,
                                previousDay.buyerPrice,
                                'price'
                            )
                            : '',

                    spp:
                        previousDay
                            ? getChangeClass(
                                day.spp,
                                previousDay.spp,
                                'spp'
                            )
                            : '',

                    seller:
                        previousDay
                            ? getChangeClass(
                                day.sellerPrice,
                                previousDay.sellerPrice,
                                'price'
                            )
                            : '',

                    sales:
                        previousDay
                            ? getChangeClass(
                                day.sales,
                                previousDay.sales,
                                'sales'
                            )
                            : '',

                    profitability:
                        previousDay
                            ? getChangeClass(
                                day.financial?.profitability,
                                previousDay.financial?.profitability,
                                'profitability'
                            )
                            : '',

                    margin:
                        previousDay
                            ? getChangeClass(
                                day.financial?.margin,
                                previousDay.financial?.margin,
                                'margin'
                            )
                            : ''
                };


                columns.forEach(
                    (
                        column,
                        columnIndex
                    ) => {

                        html +=
                            renderColumnValue(
                                column,
                                day,
                                day.financial || {},
                                changeClasses,
                                columnIndex === 0
                            );
                    }
                );

            }
        );


        // ====================================================
        // ИТОГОВЫЕ КОЛОНКИ
        // ====================================================

        html += `

                <td
                    class="day-separator result-col"
                >

                    ${formatNumber(
                        product.orders30
                    )}

                </td>

                <td
                    class="stock result-col"
                >

                    ${formatNumber(
                        product.stockToday
                    )}

                </td>

                <td
                    class="days-left result-col"
                >

                    ${
                        product.daysLeft === null
                            ? '<span class="empty">∞</span>'
                            : formatNumber(
                                product.daysLeft,
                                1
                            ) + ' дн.'
                    }

                </td>

                <td
                    class="position result-col"
                >

                    ${formatNumber(
                        product.positionToday,
                        1
                    )}

                </td>

                <td
                    class="cost result-col"
                >

                    ${formatMoney(
                        product.cost
                    )}

                </td>

            </tr>

        `;
    }


    document
        .getElementById('tableBody')
        .innerHTML =
            html;
}


// ============================================================
// ЗАГРУЗКА
// ============================================================
//
// ВАЖНО:
//
// loadingData не позволяет отправить второй запрос,
// пока первый /api/dashboard ещё выполняется.
// ============================================================

// ============================================================
// ЗАЩИТА ОТ ПОВТОРНОЙ ЗАГРУЗКИ
// ============================================================

let loadingData = false;


// ============================================================
// ЗАГРУЗКА ДАННЫХ
//
// ВАЖНО:
// Автоматически НЕ запускается.
// Только после нажатия кнопки.
// ============================================================

async function loadData() {

    if (loadingData) {

        console.log(
            'Загрузка уже выполняется.'
        );

        return;
    }


    loadingData =
        true;


    const button =
        document.getElementById(
            'refreshButton'
        );


    const status =
        document.getElementById(
            'status'
        );


    button.disabled =
        true;


    button.textContent =
        '↻ Обновляем...';


    status.textContent =
        'Обновляем данные WB...';


    document
        .getElementById(
            'tableBody'
        )
        .innerHTML = `

            <tr>

                <td
                    colspan="60"
                    class="loading"
                >

                    Получаем данные из WB...

                    Это может занять
                    несколько минут.

                </td>

            </tr>

        `;


    try {

        const response =
            await fetch(
                '/api/dashboard?ts=' +
                Date.now(),
                {

                    method:
                        'GET',

                    cache:
                        'no-store'

                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                `HTTP ${response.status}`
            );

        }


        window.dashboardData =
            data;

        window.dashboardData = data;

        window.dashboardData =
            data;

        render(
            data
        );


        const updated =
            new Date(
                data.updatedAt
            );


        status.textContent =
            'Обновлено: ' +
            updated.toLocaleTimeString(
                'ru-RU'
            );


    } catch (error) {

        console.error(
            'LOAD DATA ERROR:',
            error
        );


        status.textContent =
            'Ошибка';


        document
            .getElementById(
                'tableBody'
            )
            .innerHTML = `

                <tr>

                    <td
                        colspan="60"
                        class="error"
                    >

                        ${escapeHtml(
                            error.message
                        )}

                    </td>

                </tr>

            `;


    } finally {

        loadingData =
            false;


        button.disabled =
            false;


        button.textContent =
            '↻ Обновить данные';

    }

}


// ============================================================
// КНОПКА
// ============================================================

document
    .getElementById(
        'refreshButton'
    )
    .addEventListener(
        'click',
        loadData
    );


// ============================================================
// ФИЛЬТР ПО ТОВАРУ
// ============================================================

document
    .getElementById(
        'productFilter'
    )
    .addEventListener(
        'input',
        () => {

            if (
                window.dashboardData
            ) {

                render(
                    window.dashboardData
                );

            }

        }
    );


// ============================================================
// НУЛЕВЫЕ ПРОДАЖИ
// ============================================================

document
    .getElementById(
        'hideZeroSales'
    )
    .addEventListener(
        'change',
        () => {

            if (
                window.dashboardData
            ) {

                render(
                    window.dashboardData
                );

            }

        }
    );


// ============================================================
// ФИЛЬТР ТОВАРОВ
// ============================================================

document
    .getElementById(
        'productFilter'
    )
    .addEventListener(
        'input',
        () => {

            if (
                window.dashboardData
            ) {

                render(
                    window.dashboardData
                );
            }
        }
    );


// ============================================================
// НУЛЕВЫЕ ПРОДАЖИ
// ============================================================

document
    .getElementById(
        'hideZeroSales'
    )
    .addEventListener(
        'change',
        () => {

            if (
                window.dashboardData
            ) {

                render(
                    window.dashboardData
                );
            }
        }
    );


// ============================================================
// ВЫБОР КОЛОНОК
// ============================================================

document
    .querySelectorAll(
        '.column-chooser input[data-column]'
    )
    .forEach(
        checkbox => {

            checkbox.addEventListener(
                'change',
                () => {

                    if (
                        window.dashboardData
                    ) {

                        render(
                            window.dashboardData
                        );
                    }
                }
            );
        }
    );


// ============================================================
// ВЫБОР КОЛИЧЕСТВА ДНЕЙ
// ============================================================

document
    .getElementById(
        'daysCount'
    )
    .addEventListener(
        'change',
        () => {

            if (
                window.dashboardData
            ) {

                render(
                    window.dashboardData
                );

            }
        }
    );


// ============================================================
// НИКАКОГО:
// loadData();
// ============================================================
//
// Данные начинают загружаться ТОЛЬКО после нажатия
// кнопки «↻ Обновить данные».
// ============================================================

</script>


</body>
