<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>WB Dashboard</title>


<style>

/* =========================================================
   BASE
   ========================================================= */

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    background: #f5f6f8;

    color: #20242b;

    font-family:
        Inter,
        Arial,
        sans-serif;

    font-size: 13px;
}


.container {

    max-width: 1900px;

    margin: auto;

    padding: 18px 22px;
}


/* =========================================================
   HEADER
   ========================================================= */

.header {

    display: flex;

    justify-content:
        space-between;

    align-items:
        center;

    margin-bottom:
        14px;
}


.title {

    font-size:
        21px;

    font-weight:
        700;
}


.subtitle {

    margin-top:
        3px;

    color:
        #858b95;

    font-size:
        12px;
}


.header-right {

    display: flex;

    align-items:
        center;

    gap:
        12px;
}


#status {

    color:
        #858b95;

    font-size:
        12px;
}


button {

    border:
        none;

    border-radius:
        9px;

    padding:
        9px 14px;

    background:
        #111827;

    color:
        white;

    font-size:
        13px;

    font-weight:
        600;

    cursor:
        pointer;
}


button:hover {

    background:
        #242b38;
}


button:disabled {

    opacity:
        .5;

    cursor:
        wait;
}


/* =========================================================
   КОМПАКТНАЯ ТАБЛИЦА
   ========================================================= */

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-size: 11px;
}

.container {
    max-width: none;
    width: 100%;
    height: 100vh;
    margin: 0;
    padding: 10px 12px;
    overflow: hidden;
}

.header {
    margin-bottom: 8px;
}

.title {
    font-size: 18px;
}

.header-right {
    gap: 8px;
}

#status {
    font-size: 10px;
}

button {
    padding: 7px 10px;
    font-size: 11px;
}

/* =========================================================
   ФИЛЬТРЫ
   ========================================================= */

.table-filters {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 7px;
    padding: 6px 8px;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
}

.filter-group {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 6px;
    width: 300px;
}

.filter-group label {
    font-size: 10px;
    white-space: nowrap;
}

#productFilter {
    width: 100%;
    height: 28px;
    padding: 0 8px;
    font-size: 11px;
    border-radius: 6px;
}

.zero-sales-filter {
    height: 28px;
    font-size: 10px;
}

.zero-sales-filter input {
    width: 14px;
    height: 14px;
}



/* =========================================================
   ПОДСВЕТКА ИЗМЕНЕНИЙ
   ========================================================= */

.up {
    background: #dff5e6 !important;
    color: #14783b !important;
    font-weight: 700;
}

.down {
    background: #ffe1e1 !important;
    color: #b42318 !important;
    font-weight: 700;
}

.same {
    color: #505762;
}

/* =========================================================
   ТАБЛИЦА
   ========================================================= */

.table-container {
    width: 100%;
    height: calc(100vh - 103px);
    overflow: hidden;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    box-shadow: 0 2px 7px rgba(0,0,0,.03);
}

table {
    width: 100%;
    min-width: 0;
    table-layout: fixed;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 9px;
}

th {
    padding: 3px 2px;
    font-size: 8px;
    line-height: 1.1;
    white-space: normal;
    text-align: center;
}

td {
    padding: 3px 2px;
    font-size: 9px;
    line-height: 1.1;
    white-space: nowrap;
    text-align: right;
}

th.product-header,
.product-cell {
    width: 175px;
    min-width: 175px;
    max-width: 175px;
}

.product-name {
    font-size: 9px;
    line-height: 1.12;
    -webkit-line-clamp: 2;
    line-clamp: 2;
}

.product-article {
    font-size: 8px;
    margin-top: 2px;
}

.day-title {
    font-size: 10px;
    padding: 3px 1px;
}

.day-date {
    font-size: 8px;
    margin-top: 1px;
}

.day-separator {
    border-left: 1px solid #e9ebef !important;
}

.empty {
    font-size: 9px;
}

/* Узкие рабочие колонки */
th:not(.product-header),
td:not(.product-cell) {
    width: auto;
}

/* Финансовые и итоговые колонки чуть шире */
thead tr:nth-child(2) th:nth-child(10),
thead tr:nth-child(2) th:nth-child(11),
thead tr:nth-child(2) th:nth-child(12),
thead tr:nth-child(2) th:nth-child(13),
thead tr:nth-child(2) th:nth-child(14),
thead tr:nth-child(2) th:nth-child(15),
thead tr:nth-child(2) th:nth-child(16),
thead tr:nth-child(2) th:nth-child(17),
thead tr:nth-child(2) th:nth-child(18),
thead tr:nth-child(2) th:nth-child(19),
thead tr:nth-child(2) th:nth-child(20),
thead tr:nth-child(2) th:nth-child(21),
thead tr:nth-child(2) th:nth-child(22),
thead tr:nth-child(2) th:nth-child(23),
thead tr:nth-child(2) th:nth-child(24),
thead tr:nth-child(2) th:nth-child(25),
thead tr:nth-child(2) th:nth-child(26) {
    width: 49px;
}

/* =========================================================
   ПОДГОН ПОД РАЗМЕР ЭКРАНА
   ========================================================= */

@media (min-width: 1600px) {
    table {
        zoom: 0.92;
        width: 108.7%;
    }
}

@media (min-width: 1900px) {
    table {
        zoom: 1;
        width: 100%;
    }
}

@media (max-width: 1599px) {
    table {
        zoom: 0.82;
        width: 121.95%;
    }
}

@media (max-width: 1100px) {
    table {
        zoom: 0.68;
        width: 147.06%;
    }

    .filter-group {
        width: 240px;
    }
}

</style>

</head>


<body>


<div class="container">


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <div class="header">

        <div>

            <div class="title">
                Wildberries · товары
            </div>

            <div
                class="subtitle"
                id="period"
            >
                Загрузка...
            </div>

        </div>


        <div class="header-right">

            <div id="status">
            </div>

            <button
                id="refreshButton"
            >
                ↻ Обновить данные
            </button>

        </div>

    </div>


    <!-- =====================================================
         ФИЛЬТРЫ
         ===================================================== -->

    <div class="table-filters">

        <div class="filter-group">

            <label for="productFilter">
                Фильтр товаров
            </label>

            <input
                type="text"
                id="productFilter"
                placeholder="Название, код или nmId"
                autocomplete="off"
            >

        </div>

        <label class="zero-sales-filter">

            <input
                type="checkbox"
                id="hideZeroSales"
                checked
            >

            <span>
                Нулевые продажи скрыты
            </span>

        </label>

    </div>


    <!-- =====================================================
         TABLE
         ===================================================== -->

    <div class="table-container">

        <table>

            <thead
                id="tableHead"
            >
            </thead>


            <tbody
                id="tableBody"
            >

                <tr>

                    <td
                        colspan="50"
                        class="loading"
                    >
                        Загрузка данных WB...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


<script>


// ============================================================
// HELPERS
// ============================================================

function escapeHtml(value) {

    return String(
        value ?? ''
    )

        .replace(
            /[&<>"']/g,
            char => ({

                '&':
                    '&amp;',

                '<':
                    '&lt;',

                '>':
                    '&gt;',

                '"':
                    '&quot;',

                "'":
                    '&#039;'

            }[char])
        );

}


// ============================================================
// ЧИСЛА
// ============================================================

function formatNumber(
    value,
    digits = 0
) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(
            Number(value)
        )
    ) {

        return `
            <span class="empty">
                —
            </span>
        `;

    }


    return Number(
        value
    )

        .toLocaleString(
            'ru-RU',
            {

                maximumFractionDigits:
                    digits

            }
        );

}


// ============================================================
// ДЕНЬГИ
// ============================================================

function formatMoney(value) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(
            Number(value)
        )
    ) {

        return `
            <span class="empty">
                —
            </span>
        `;

    }


    return (

        Number(value)

            .toLocaleString(
                'ru-RU',
                {

                    maximumFractionDigits:
                        0

                }
            )

        + ' ₽'

    );

}


// ============================================================
// ДЕНЬГИ РЕКЛАМЫ
// ============================================================

function formatAdMoney(value) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(
            Number(value)
        )
    ) {

        return `
            <span class="empty">
                —
            </span>
        `;

    }


    return (

        Number(value)

            .toLocaleString(
                'ru-RU',
                {

                    minimumFractionDigits:
                        2,

                    maximumFractionDigits:
                        2

                }
            )

        + ' ₽'

    );

}


// ============================================================
// ПРОЦЕНТ
// ============================================================

function formatPercent(value) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(
            Number(value)
        )
    ) {

        return `
            <span class="empty">
                —
            </span>
        `;

    }


    return (

        Number(value)

            .toLocaleString(
                'ru-RU',
                {

                    maximumFractionDigits:
                        1

                }
            )

        + '%'

    );

}


// ============================================================
// ДАТА
// ============================================================

function formatDate(date) {

    if (!date) {

        return '';

    }


    const parts =
        String(date).split('-');


    if (
        parts.length !== 3
    ) {

        return String(date);

    }


    return `${
        parts[2]
    }.${
        parts[1]
    }`;

}


// ============================================================
// КЛАСС ИЗМЕНЕНИЯ
// ============================================================

function getChangeClass(
    current,
    previous,
    type
) {

    if (
        current === null ||
        previous === null ||
        current === undefined ||
        previous === undefined
    ) {

        return '';

    }


    const currentNumber =
        Number(current);


    const previousNumber =
        Number(previous);


    if (
        !Number.isFinite(
            currentNumber
        ) ||
        !Number.isFinite(
            previousNumber
        )
    ) {

        return '';

    }


    if (
        currentNumber ===
        previousNumber
    ) {

        return 'same';

    }


    if (
        type === 'price'
    ) {

        return currentNumber <
            previousNumber
            ? 'up'
            : 'down';

    }


    if (
        type === 'spp'
    ) {

        return currentNumber >
            previousNumber
            ? 'up'
            : 'down';

    }


    if (
        type === 'sales'
    ) {

        return currentNumber >
            previousNumber
            ? 'up'
            : 'down';

    }


    return '';

}


// ============================================================
// RENDER
// ============================================================

function render(data) {

    // ========================================================
    // ВСЕ ТОВАРЫ
    // ========================================================

    const allProducts =
        Array.isArray(data.products)
            ? data.products
            : [];


    // ========================================================
    // ФИЛЬТРЫ
    // ========================================================

    const filterInput =
        document.getElementById(
            'productFilter'
        );

    const hideZeroSalesCheckbox =
        document.getElementById(
            'hideZeroSales'
        );

    const filterText =
        String(
            filterInput?.value || ''
        )
            .trim()
            .toLowerCase();

    const hideZeroSales =
        hideZeroSalesCheckbox
            ? hideZeroSalesCheckbox.checked
            : true;


    // ========================================================
    // ФИЛЬТРАЦИЯ ТОВАРОВ
    //
    // При включённой галочке показываем только товары,
    // у которых была хотя бы одна продажа за 3 последних дня.
    //
    // Поиск работает по:
    // - названию
    // - коду / артикулу
    // - nmId
    // ========================================================

    const products =
        allProducts.filter(
            product => {

                const dayBefore =
                    product.days?.[0] || {};

                const yesterday =
                    product.days?.[1] || {};

                const today =
                    product.days?.[2] || {};

                const sales3Days =
                    Number(dayBefore.sales || 0) +
                    Number(yesterday.sales || 0) +
                    Number(today.sales || 0);

                if (
                    hideZeroSales &&
                    sales3Days <= 0
                ) {
                    return false;
                }

                if (filterText) {

                    const name =
                        String(
                            product.name || ''
                        ).toLowerCase();

                    const article =
                        String(
                            product.article || ''
                        ).toLowerCase();

                    const nmId =
                        String(
                            product.nmId || ''
                        ).toLowerCase();

                    if (
                        !name.includes(filterText) &&
                        !article.includes(filterText) &&
                        !nmId.includes(filterText)
                    ) {
                        return false;
                    }
                }

                return true;
            }
        );


    // ========================================================
    // СОРТИРОВКА ПО ЗАКАЗАМ ЗА 3 ДНЯ
    // ПО ВОЗРАСТАНИЮ
    // ========================================================

    products.sort((a, b) => {

        const aSales =
            Number(a.days?.[0]?.sales || 0) +
            Number(a.days?.[1]?.sales || 0) +
            Number(a.days?.[2]?.sales || 0);

        const bSales =
            Number(b.days?.[0]?.sales || 0) +
            Number(b.days?.[1]?.sales || 0) +
            Number(b.days?.[2]?.sales || 0);

        if (aSales !== bSales) {
            return aSales - bSales;
        }

        return Number(a.nmId || 0) - Number(b.nmId || 0);

    });


    // ========================================================
    // ПЕРИОД
    // ========================================================

    document
        .getElementById('period')
        .textContent =
            `Заказы: ${
                formatDate(data.period.from)
            } — ${
                formatDate(data.period.to)
            } · товаров: ${
                products.length
            }`;


    // ========================================================
    // НЕТ ТОВАРОВ
    // ========================================================

    if (!products.length) {

        document
            .getElementById('tableHead')
            .innerHTML = '';

        document
            .getElementById('tableBody')
            .innerHTML = `

                <tr>

                    <td
                        colspan="50"
                        class="error"
                    >

                        ${
                            filterText
                                ? 'Товары не найдены.'
                                : hideZeroSales
                                    ? 'За последние 3 дня продаж нет.'
                                    : 'Товары отсутствуют.'
                        }

                    </td>

                </tr>

            `;

        return;
    }


    // ========================================================
    // ДНИ
    // ========================================================

    const today =
        products[0].days[2];

    const yesterday =
        products[0].days[1];

    const dayBefore =
        products[0].days[0];


    // ========================================================
    // HEADER
    // ========================================================

    document
        .getElementById('tableHead')
        .innerHTML = `

        <tr>

            <th
                rowspan="2"
                class="product-header"
            >
                Товар
            </th>

            <!-- ================== СЕГОДНЯ ================== -->

            <th
                colspan="9"
                class="day-title day-separator"
            >

                Сегодня

                <span class="day-date">
                    ${formatDate(today.date)}
                </span>

            </th>


            <!-- ==================== ВЧЕРА ==================== -->

            <th
                colspan="16"
                class="day-title day-separator"
            >

                Вчера

                <span class="day-date">
                    ${formatDate(yesterday.date)}
                </span>

            </th>


            <!-- ================= ПОЗАВЧЕРА ================= -->

            <th
                colspan="16"
                class="day-title day-separator"
            >

                Позавчера

                <span class="day-date">
                    ${formatDate(dayBefore.date)}
                </span>

            </th>


            <!-- ==================== ИТОГИ ==================== -->

            <th
                rowspan="2"
                class="day-separator result-cell"
            >
                Заказы<br>
                30 дней
            </th>

            <th
                rowspan="2"
                class="result-cell"
            >
                Остаток<br>
                сегодня
            </th>

            <th
                rowspan="2"
                class="result-cell"
            >
                Хватит<br>
                на
            </th>

            <th
                rowspan="2"
                class="result-cell"
            >
                Позиция
            </th>

            <th
                rowspan="2"
                class="result-cell"
            >
                Себестоимость
            </th>

        </tr>


        <tr>

            <!-- =================================================
                 СЕГОДНЯ — ФИНАНСОВЫХ КОЛОНОК НЕТ
                 ================================================= -->

            <th class="day-separator day-cell-wide">
                Цена<br>покупателя
            </th>

            <th class="day-cell">
                СПП
            </th>

            <th class="day-cell-wide">
                Цена<br>продавца
            </th>

            <th class="day-cell">
                Показы
            </th>

            <th class="day-cell">
                Клики
            </th>

            <th class="day-cell">
                Корзины
            </th>

            <th class="day-cell">
                CPM
            </th>

            <th class="day-cell-wide">
                Затраты
            </th>

            <th class="day-cell">
                Продажи
            </th>


            <!-- =================================================
                 ВЧЕРА
                 ================================================= -->

            <th class="day-separator day-cell-wide">
                Цена<br>покупателя
            </th>

            <th class="day-cell">
                СПП
            </th>

            <th class="day-cell-wide">
                Цена<br>продавца
            </th>

            <th class="day-cell">
                Показы
            </th>

            <th class="day-cell">
                Клики
            </th>

            <th class="day-cell">
                Корзины
            </th>

            <th class="day-cell">
                CPM
            </th>

            <th class="day-cell-wide">
                Затраты
            </th>

            <th class="day-cell">
                Продажи
            </th>

            <th class="day-cell-wide">
                К перечислению
            </th>

            <th class="day-cell-wide">
                Логистика
            </th>

            <th class="day-cell-wide">
                Хранение
            </th>

            <th class="day-cell-wide">
                Налог
            </th>

            <th class="day-cell-wide">
                Прибыль
            </th>

            <th class="day-cell-wide">
                Рентабельность
            </th>

            <th class="day-cell-wide">
                Маржа
            </th>


            <!-- =================================================
                 ПОЗАВЧЕРА
                 ================================================= -->

            <th class="day-separator day-cell-wide">
                Цена<br>покупателя
            </th>

            <th class="day-cell">
                СПП
            </th>

            <th class="day-cell-wide">
                Цена<br>продавца
            </th>

            <th class="day-cell">
                Показы
            </th>

            <th class="day-cell">
                Клики
            </th>

            <th class="day-cell">
                Корзины
            </th>

            <th class="day-cell">
                CPM
            </th>

            <th class="day-cell-wide">
                Затраты
            </th>

            <th class="day-cell">
                Продажи
            </th>

            <th class="day-cell-wide">
                К перечислению
            </th>

            <th class="day-cell-wide">
                Логистика
            </th>

            <th class="day-cell-wide">
                Хранение
            </th>

            <th class="day-cell-wide">
                Налог
            </th>

            <th class="day-cell-wide">
                Прибыль
            </th>

            <th class="day-cell-wide">
                Рентабельность
            </th>

            <th class="day-cell-wide">
                Маржа
            </th>

        </tr>

    `;


    // ========================================================
    // BODY
    // ========================================================

    let html = '';


    for (
        const product of products
    ) {

        const today =
            product.days[2];

        const yesterday =
            product.days[1];

        const dayBefore =
            product.days[0];


        // ====================================================
        // КЛАССЫ ИЗМЕНЕНИЙ
        // ====================================================

        const buyerTodayClass =
            getChangeClass(
                today.buyerPrice,
                yesterday.buyerPrice,
                'price'
            );

        const buyerYesterdayClass =
            getChangeClass(
                yesterday.buyerPrice,
                dayBefore.buyerPrice,
                'price'
            );

        const sppTodayClass =
            getChangeClass(
                today.spp,
                yesterday.spp,
                'spp'
            );

        const sppYesterdayClass =
            getChangeClass(
                yesterday.spp,
                dayBefore.spp,
                'spp'
            );

        const sellerTodayClass =
            getChangeClass(
                today.sellerPrice,
                yesterday.sellerPrice,
                'price'
            );

        const sellerYesterdayClass =
            getChangeClass(
                yesterday.sellerPrice,
                dayBefore.sellerPrice,
                'price'
            );

        const salesYesterdayClass =
            getChangeClass(
                yesterday.sales,
                dayBefore.sales,
                'sales'
            );


        // ====================================================
        // ФИНАНСЫ
        // ====================================================

        const yesterdayFinancial =
            yesterday.financial || {};

        const dayBeforeFinancial =
            dayBefore.financial || {};


        // ====================================================
        // СТРОКА
        // ====================================================

        html += `

<tr>

    <!-- ==================== ТОВАР ==================== -->

    <td
        class="product-cell"

// ============================================================
// ЗАГРУЗКА
// ============================================================
//
// ВАЖНО:
//
// loadingData не позволяет отправить второй запрос,
// пока первый /api/dashboard ещё выполняется.
// ============================================================

// ============================================================
// ЗАЩИТА ОТ ПОВТОРНОЙ ЗАГРУЗКИ
// ============================================================

let loadingData = false;


// ============================================================
// ЗАГРУЗКА ДАННЫХ
//
// ВАЖНО:
// Автоматически НЕ запускается.
// Только после нажатия кнопки.
// ============================================================

async function loadData() {

    if (loadingData) {

        console.log(
            'Загрузка уже выполняется.'
        );

        return;
    }


    loadingData =
        true;


    const button =
        document.getElementById(
            'refreshButton'
        );


    const status =
        document.getElementById(
            'status'
        );


    button.disabled =
        true;


    button.textContent =
        '↻ Обновляем...';


    status.textContent =
        'Обновляем данные WB...';


    document
        .getElementById(
            'tableBody'
        )
        .innerHTML = `

            <tr>

                <td
                    colspan="50"
                    class="loading"
                >

                    Получаем данные из WB...

                    Это может занять
                    несколько минут.

                </td>

            </tr>

        `;


    try {

        const response =
            await fetch(
                '/api/dashboard?ts=' +
                Date.now(),
                {

                    method:
                        'GET',

                    cache:
                        'no-store'

                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                `HTTP ${response.status}`
            );

        }


        window.dashboardData =
            data;

        window.dashboardData = data;

        render(
            data
        );


        const updated =
            new Date(
                data.updatedAt
            );


        status.textContent =
            'Обновлено: ' +
            updated.toLocaleTimeString(
                'ru-RU'
            );


    } catch (error) {

        console.error(
            'LOAD DATA ERROR:',
            error
        );


        status.textContent =
            'Ошибка';


        document
            .getElementById(
                'tableBody'
            )
            .innerHTML = `

                <tr>

                    <td
                        colspan="50"
                        class="error"
                    >

                        ${escapeHtml(
                            error.message
                        )}

                    </td>

                </tr>

            `;


    } finally {

        loadingData =
            false;


        button.disabled =
            false;


        button.textContent =
            '↻ Обновить данные';

    }

}


// ============================================================
// КНОПКА
// ============================================================

document
    .getElementById(
        'refreshButton'
    )
    .addEventListener(
        'click',
        loadData
    );
