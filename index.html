<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>WB Dashboard</title>


<style>

/* =========================================================
   BASE
   ========================================================= */

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    background: #f5f6f8;

    color: #20242b;

    font-family:
        Inter,
        Arial,
        sans-serif;

    font-size: 13px;
}


.container {

    max-width: 1900px;

    margin: auto;

    padding: 18px 22px;
}


/* =========================================================
   HEADER
   ========================================================= */

.header {

    display: flex;

    justify-content:
        space-between;

    align-items:
        center;

    margin-bottom:
        14px;
}


.title {

    font-size:
        21px;

    font-weight:
        700;
}


.subtitle {

    margin-top:
        3px;

    color:
        #858b95;

    font-size:
        12px;
}


.header-right {

    display: flex;

    align-items:
        center;

    gap:
        12px;
}


#status {

    color:
        #858b95;

    font-size:
        12px;
}


button {

    border:
        none;

    border-radius:
        9px;

    padding:
        9px 14px;

    background:
        #111827;

    color:
        white;

    font-size:
        13px;

    font-weight:
        600;

    cursor:
        pointer;
}


button:hover {

    background:
        #242b38;
}


button:disabled {

    opacity:
        .5;

    cursor:
        wait;
}


/* =========================================================
   TABLE
   ========================================================= */

.table-container {

    background:
        white;

    border:
        1px solid #e5e7eb;

    border-radius:
        12px;

    overflow:
        auto;

    box-shadow:
        0 2px 7px
        rgba(0,0,0,.03);
}


table {

    border-collapse:
        separate;

    border-spacing:
        0;

    width:
        100%;

    min-width:
        1280px;

    table-layout:
        auto;
}


/* =========================================================
   HEADER CELLS
   ========================================================= */

th {

    position:
        sticky;

    top:
        0;

    z-index:
        5;

    background:
        #fafbfc;

    color:
        #68707c;

    font-size:
        11px;

    font-weight:
        700;

    padding:
        7px;

    border-bottom:
        1px solid #e5e7eb;

    white-space:
        nowrap;

    text-align:
        right;
}


/* =========================================================
   ТОВАР
   ========================================================= */

th.product-header {

    text-align:
        center;

    width:
        235px;

    min-width:
        235px;

    max-width:
        235px;
}


/* =========================================================
   ЗАГОЛОВКИ ДНЕЙ
   ========================================================= */

.day-title {

    text-align:
        center;

    font-size:
        12px;

    color:
        #242932;
}


.day-date {

    display:
        block;

    color:
        #8b919a;

    font-size:
        10px;

    font-weight:
        400;

    margin-top:
        2px;
}


/* =========================================================
   TABLE CELLS
   ========================================================= */

td {

    padding:
        7px;

    border-bottom:
        1px solid #edf0f3;

    white-space:
        nowrap;

    text-align:
        right;

    font-variant-numeric:
        tabular-nums;
}


tbody tr:hover td {

    background:
        #fafcff;
}


/* =========================================================
   PRODUCT
   ========================================================= */

.product-cell {

    width:
        235px;

    min-width:
        235px;

    max-width:
        235px;

    text-align:
        left;

    white-space:
        normal;

    overflow:
        hidden;

    vertical-align:
        middle;
}


.product-name {

    font-weight:
        600;

    line-height:
        1.25;

    overflow:
        hidden;

    display:
        -webkit-box;

    -webkit-box-orient:
        vertical;

    -webkit-line-clamp:
        3;

    line-clamp:
        3;

    white-space:
        normal;

    overflow-wrap:
        anywhere;
}


.product-article {

    color:
        #858b95;

    font-size:
        11px;

    margin-top:
        3px;

    overflow:
        hidden;

    text-overflow:
        ellipsis;

    white-space:
        nowrap;

/* =========================================================
   РАЗДЕЛИТЕЛЬ ДНЕЙ
   ========================================================= */

.day-separator {

    border-left:
        2px solid #e9ebef !important;
}


/* =========================================================
   ПОДСВЕТКА
   ========================================================= */

.up {

    background:
        #dff5e6 !important;

    color:
        #14783b;

    font-weight:
        700;
}


.down {

    background:
        #ffe1e1 !important;

    color:
        #b42318;

    font-weight:
        700;
}


.same {

    color:
        #505762;
}


/* =========================================================
   OTHER
   ========================================================= */

.stock {

    font-weight:
        700;
}


.days-left {

    font-weight:
        700;
}


.position {

    font-weight:
        700;
}


.cost {

    font-weight:
        700;
}


.empty {

    color:
        #a3a8b0;
}


.error {

    padding:
        35px;

    text-align:
        center;

    color:
        #b42318;
}


.loading {

    padding:
        35px;

    text-align:
        center;

    color:
        #858b95;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (
    max-width: 800px
) {

    .container {

        padding:
            10px;
    }


    .header {

        align-items:
            flex-start;

        flex-direction:
            column;

        gap:
            10px;
    }


    .header-right {

        width:
            100%;

        justify-content:
            space-between;
    }


    .product-cell,
    th.product-header {

        width:
            190px;

        min-width:
            190px;

        max-width:
            190px;

}

</style>

</head>


<body>


<div class="container">


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <div class="header">

        <div>

            <div class="title">
                Wildberries · товары
            </div>

                class="subtitle"
                id="period"
            >
                Загрузка...
            </div>

        </div>


        <div class="header-right">

            </div>

            <button
                id="refreshButton"

                ↻ Обновить данные

        </div>

    </div>

         TABLE
         ===================================================== -->

    <div class="table-container">

        <table>

            <thead
                id="tableHead"
            >
            </thead>

                id="tableBody"
            >

                <tr>

                    <td
                        colspan="47"
                        class="loading"
                    >
                        Загрузка данных WB...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


<script>


// ============================================================
// HELPERS
// ============================================================

function escapeHtml(value) {

    return String(
        value ?? ''
    )

        .replace(
            /[&<>"']/g,
            char => ({

                '&':
                    '&amp;',

                '<':
                    '&lt;',

                '>':
                    '&gt;',

                '"':
                    '&quot;',

                "'":
                    '&#039;'

            }[char])
        );

}


// ============================================================
// ЧИСЛА
// ============================================================

function formatNumber(
    value,
    digits = 0
) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(
            Number(value)
        )
    ) {

        return `
            <span class="empty">
                —
            </span>
        `;

    }


    return Number(
        value
    )

        .toLocaleString(
            'ru-RU',
            {

                maximumFractionDigits:
                    digits

            }
        );

}


// ============================================================
// ДЕНЬГИ
// ============================================================

function formatMoney(value) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(
            Number(value)
        )
    ) {

        return `
            <span class="empty">
                —
            </span>
        `;

    }


    return (

        Number(value)

            .toLocaleString(
                'ru-RU',
                {

                    maximumFractionDigits:
                        0

                }
            )

        + ' ₽'

    );

}


// ============================================================
// ДЕНЬГИ РЕКЛАМЫ
// ============================================================

function formatAdMoney(value) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(
            Number(value)
        )
    ) {

        return `
            <span class="empty">
                —
            </span>
        `;

    }


    return (

        Number(value)

            .toLocaleString(
                'ru-RU',
                {

                    minimumFractionDigits:
                        2,

                    maximumFractionDigits:
                        2

                }
            )

        + ' ₽'

    );

}


// ============================================================
// ПРОЦЕНТ
// ============================================================

function formatPercent(value) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(
            Number(value)
        )
    ) {

        return `
            <span class="empty">
                —
            </span>
        `;

    }


    return (

        Number(value)

            .toLocaleString(
                'ru-RU',
                {

                    maximumFractionDigits:
                        1

                }
            )

        + '%'

    );

}


// ============================================================
// ДАТА
// ============================================================

function formatDate(date) {

    if (!date) {

        return '';

    }


    const parts =
        String(date).split('-');


    if (
        parts.length !== 3
    ) {

        return String(date);

    }


    return `${
        parts[2]
    }.${
        parts[1]
    }`;

}


// ============================================================
// КЛАСС ИЗМЕНЕНИЯ
// ============================================================

function getChangeClass(
    current,
    previous,
    type
) {

    if (
        current === null ||
        previous === null ||
        current === undefined ||
        previous === undefined
    ) {

        return '';

    }


    const currentNumber =
        Number(current);


    const previousNumber =
        Number(previous);


    if (
        !Number.isFinite(
            currentNumber
        ) ||
        !Number.isFinite(
            previousNumber
        )
    ) {

        return '';

    }


    if (
        currentNumber ===
        previousNumber
    ) {

        return 'same';

    }


    if (
        type === 'price'
    ) {

        return currentNumber <
            previousNumber
            ? 'up'
            : 'down';

    }


    if (
        type === 'spp'
    ) {

        return currentNumber >
            previousNumber
            ? 'up'
            : 'down';

    }


    if (
        type === 'sales'
    ) {

        return currentNumber >
            previousNumber
            ? 'up'
            : 'down';

    }


    return '';

}


// ============================================================
// RENDER
// ============================================================

    const products =
        data.products || [];


    // ========================================================
    // ПЕРИОД
    // ========================================================

    document
        .getElementById('period')
        .textContent =

        `Заказы: ${
            formatDate(
                data.period.from
            )
        } — ${
            formatDate(
                data.period.to
            )
        } · товаров: ${
            products.length
        }`;


    // ========================================================
    // НЕТ ТОВАРОВ
    // ========================================================

        !products.length
    ) {

        document
            .getElementById(
                'tableBody'
            )
            .innerHTML = `

                    <td
                        colspan="47"
                        class="error"
                    >

                        За последние 30 дней
                        заказов нет.

        return;

    // ДНИ
    // ========================================================

    const firstProduct =
        products[0];


    const today =
        firstProduct.days[2];


    const yesterday =
        firstProduct.days[1];


    const dayBefore =
        firstProduct.days[0];


    // ========================================================
    // HEADER
    // ========================================================

    document
        .getElementById(
            'tableHead'
        )
        .innerHTML = `

            >

                30 дней

            </th>

            </th>

            </th>

                Показы
            </th>

            <th>
                Клики
            </th>

            <th>
                Корзины
            </th>

            <th>
                CPM
            </th>

            <th>
                Затраты
            </th>

            <th>
                Продажи
            </th>


            <!-- ПОЗАВЧЕРА -->

            <th class="day-separator">
                Цена<br>покупателя
            </th>

            <th>
                СПП
            </th>

            </th>

            <th>
                Показы
            </th>

            <th>
                Клики

            <th>
                Корзины
            </th>

            <th>
                CPM
            </th>

            <th>
                Затраты
            </th>

            <th>
                Продажи
            </th>

    `;


    // ========================================================
    // BODY
    // ========================================================

    let html = '';


    for (
        const product of products
    ) {

        const today =
            product.days[2];


        const yesterday =
            product.days[1];


        const dayBefore =
            product.days[0];


        // ====================================================
        // ЦЕНА ПОКУПАТЕЛЯ
        // ====================================================

        const buyerTodayClass =
            getChangeClass(
                today.buyerPrice,
                yesterday.buyerPrice,
                'price'
            );


        const buyerYesterdayClass =
            getChangeClass(
                yesterday.buyerPrice,
                dayBefore.buyerPrice,
                'price'
            );


        // ====================================================
        // СПП
        // ====================================================

        const sppTodayClass =
            getChangeClass(
                today.spp,
                yesterday.spp,
                'spp'
            );


        const sppYesterdayClass =
            getChangeClass(
                yesterday.spp,
                dayBefore.spp,
                'spp'

        // ====================================================
        // ЦЕНА ПРОДАВЦА
        // ====================================================

        const sellerTodayClass =
            getChangeClass(

            getChangeClass(

<td>

    }

<td>

            ? '<span class="empty">—</span>'
            : formatPercent(

    <!-- ================== ПОЗАВЧЕРА ================== -->

    <td
        class="day-separator"
    >

        ${formatMoney(
            dayBefore.buyerPrice
        )}

    </td>


    <td>

    </td>

        )}

    <td>

        )}

    </td>

            product.daysLeft === null

                ? '<span class="empty">∞</span>'

                : (
                    formatNumber(
                        product.daysLeft,
                        1
                    ) +
                    ' дн.'
                )
        }

    </td>


    <td
        class="position"
    >

        ${formatNumber(
            product.positionToday,
            1
        )}

    </td>


    <!-- =================== СЕБЕСТОИМОСТЬ =================== -->

    <td
        class="cost"
    >

        ${formatMoney(
            product.cost
        )}

    </td>

</tr>

`;

    }


    // ========================================================
    // ВЫВОД
    // ========================================================

    document
        .getElementById(
            'tableBody'
        )
        .innerHTML =
            html;

}


// ============================================================
// ЗАГРУЗКА
// ============================================================
//
// ВАЖНО:
//
// loadingData не позволяет отправить второй запрос,
// пока первый /api/dashboard ещё выполняется.
// ============================================================

let loadingData = false;


async function loadData() {

    // --------------------------------------------------------
    // ЗАЩИТА ОТ ПОВТОРНОГО ЗАПУСКА
    // --------------------------------------------------------

    if (
        loadingData
    ) {

        console.log(
            'Загрузка уже выполняется. Второй запрос отменён.'
        );

        return;

    }


    loadingData =
        true;


    const button =
        document.getElementById(
            'refreshButton'
        );


    const status =
        document.getElementById(
            'status'
        );


    button.disabled =
        true;


    status.textContent =
        'Обновляем данные WB...';


    document
        .getElementById(
            'tableBody'
        )
        .innerHTML = `

            <tr>

                <td
                    colspan="47"
                    class="loading"
                >

                    Получаем данные из WB...

                    Это может занять
                    несколько минут.

                </td>

            </tr>

        `;


    try {

        const response =
            await fetch(
                '/api/dashboard?ts=' +
                Date.now(),
                {
                    method:
                        'GET',

                    cache:
                        'no-store'
                }
            );


        const data =
            await response.json();


        if (
            response.status === 409
        ) {

            throw new Error(
                'Данные уже обновляются. Дождитесь завершения текущей загрузки.'
            );

        }


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                `HTTP ${response.status}`
            );

        }


        render(
            data
        );


        const updated =
            new Date(
                data.updatedAt
            );


        status.textContent =
            'Обновлено: ' +
            updated.toLocaleTimeString(
                'ru-RU'
            );


    } catch (error) {

        console.error(
            'LOAD DATA ERROR:',
            error
        );


        status.textContent =
            'Ошибка';


        document
            .getElementById(
                'tableBody'
            )
            .innerHTML = `

                <tr>

                    <td
                        colspan="47"
                        class="error"
                    >

                        ${escapeHtml(
                            error.message
                        )}

                    </td>

                </tr>

            `;


    } finally {

        loadingData =
            false;


        button.disabled =
            false;

    }

}


// ============================================================
// КНОПКА
// ============================================================

document
    .getElementById(
        'refreshButton'
    )
    .addEventListener(
        'click',
        loadData
    );


// ============================================================
// ПЕРВАЯ ЗАГРУЗКА
// ============================================================

loadData();


</script>

</body>

</html>
